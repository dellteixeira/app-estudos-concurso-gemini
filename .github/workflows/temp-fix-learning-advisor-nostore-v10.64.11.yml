name: Temp fix learning advisor no-store v10.64.11

on:
  push:
    branches:
      - feat/learning-diagnosis-ai-v10.64.11

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/learning-diagnosis-ai-v10.64.11
          fetch-depth: 0
      - name: Add Learning Advisor to Worker no-store
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/index.js')
          t=p.read_text(encoding='utf-8')
          old='"/js/pdf/pdf-library-ui.js", "/js/critical-points-actions.js", "/js/app-pwa.js"'
          new='"/js/pdf/pdf-library-ui.js", "/js/learning-advisor.js", "/js/critical-points-actions.js", "/js/app-pwa.js"'
          if old not in t:
              raise SystemExit('no-store anchor not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate structural contract
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: |
          node --check src/index.js
          npm run audit
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(runtime): incluir Learning Advisor no no-store"
          git push origin HEAD:feat/learning-diagnosis-ai-v10.64.11
