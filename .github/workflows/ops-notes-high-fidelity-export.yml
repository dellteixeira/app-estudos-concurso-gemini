name: Ops Notes High Fidelity Export

on:
  push:
    branches:
      - fix/notes-pdf-high-fidelity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notes-pdf-high-fidelity
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply high fidelity export patch
        run: python scripts/ops-notes-high-fidelity-export.py
      - name: Syntax check
        run: node --check public/js/notes-export-rich.js
      - name: Focused tests
        run: node --test tests/notes-pdf-high-fidelity.test.cjs tests/notes-rich-export.test.cjs
      - name: Full test suite
        run: npm test
      - name: Structural audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/notes-export-rich.js tests/notes-pdf-high-fidelity.test.cjs
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: preserve rich note formatting in PDF export"
          git push origin HEAD:fix/notes-pdf-high-fidelity
