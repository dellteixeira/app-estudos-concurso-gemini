name: PR305 Migrate v10.64.20

on:
  push:
    branches:
      - chore/ci-performance-architecture
    paths:
      - '.github/workflows/pr305-migrate-v106420.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/ci-performance-architecture
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Complete v10.64.20 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          OLD = '10.64.19'
          NEW = '10.64.20'

          def replace_all(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new))
                  return True
              return False

          # Canonical web/runtime versions.
          replace_all('package.json', '"version": "10.64.19"', '"version": "10.64.20"')
          replace_all('package-lock.json', '"version": "10.64.19"', '"version": "10.64.20"')
          replace_all('public/version.json', '"version": "10.64.19"', '"version": "10.64.20"')
          replace_all('src/index.js', 'const APP_VERSION = "10.64.19"', 'const APP_VERSION = "10.64.20"')
          replace_all('public/js/app-pwa.js', '?v=10.64.19', '?v=10.64.20')
          replace_all('public/js/app-pwa.js', 'V10.64.19', 'V10.64.20')
          replace_all('public/sw.js', "const APP_VERSION = '10.64.19'", "const APP_VERSION = '10.64.20'")

          # Canonical responsive asset reference.
          for path in ('public/sw.js', 'public/index.html', 'public/js/ui/navigation.js'):
              replace_all(path, 'responsive-polish-v10.64.19.css', 'responsive-polish-v10.64.20.css')

          # Android release identity.
          replace_all('android/app/build.gradle', 'versionCode 106422', 'versionCode 106423')
          replace_all('android/app/build.gradle', 'versionName "10.64.19-mobile.2"', 'versionName "10.64.20-mobile.1"')

          contract_path = Path('config/release-contract.json')
          contract = json.loads(contract_path.read_text())
          contract['version'] = NEW
          contract.setdefault('android', {})['revision'] = 1
          contract['android']['versionCode'] = 106423
          contract_path.write_text(json.dumps(contract, indent=2, ensure_ascii=False) + '\n')

          assets_path = Path('config/app-assets.json')
          assets = json.loads(assets_path.read_text())
          assets['version'] = NEW
          old_asset = '/css/responsive-polish-v10.64.19.css'
          new_asset = '/css/responsive-polish-v10.64.20.css'
          retention = '/css/components/retention.css'
          for key in ('criticalAppShell', 'networkFirstPaths', 'workerNoStorePaths', 'headersNoStorePaths'):
              items = assets[key]
              items[:] = [new_asset if item == old_asset else item for item in items]
              # de-duplicate while preserving order
              items[:] = list(dict.fromkeys(items))
              if retention not in items:
                  anchor = new_asset if new_asset in items else '/css/canonical-ui.css'
                  idx = items.index(anchor) + 1 if anchor in items else len(items)
                  items.insert(idx, retention)
          assets_path.write_text(json.dumps(assets, indent=2, ensure_ascii=False) + '\n')

          # Android Release Gradle cache.
          release_path = Path('.github/workflows/android-release.yml')
          release = release_path.read_text()
          if 'cache: gradle' not in release:
              needle = "          distribution: temurin\n          java-version: '21'"
              if needle not in release:
                  raise SystemExit('Android Release Java setup block not found')
              release = release.replace(needle, needle + "\n          cache: gradle", 1)
              release_path.write_text(release)

          # Remove version pin from retention harmony test if still present.
          test_path = Path('tests/retention-metric-harmony-modal.test.cjs')
          test_text = test_path.read_text()
          pinned = "const polish = fs.readFileSync(path.join(root, 'public/css/responsive-polish-v10.64.19.css'), 'utf8');"
          if pinned in test_text:
              dynamic = "const assets = JSON.parse(fs.readFileSync(path.join(root, 'config/app-assets.json'), 'utf8'));\nconst responsivePolishPath = assets.criticalAppShell.find(asset => /^\\/css\\/responsive-polish-v\\d+\\.\\d+\\.\\d+\\.css$/.test(asset));\nassert.ok(responsivePolishPath, 'manifest must declare the canonical responsive polish CSS');\nconst polish = fs.readFileSync(path.join(root, 'public', responsivePolishPath.replace(/^\\//, '')), 'utf8');"
              test_path.write_text(test_text.replace(pinned, dynamic))

          # Extend CI architecture contract if it has not yet been migrated.
          ci_path = Path('tests/ci-performance-contract.test.cjs')
          ci = ci_path.read_text()
          decl = "const android = fs.readFileSync('.github/workflows/android-ci.yml', 'utf8');"
          if "const androidRelease = fs.readFileSync('.github/workflows/android-release.yml', 'utf8');" not in ci and decl in ci:
              ci = ci.replace(decl, decl + "\nconst androidRelease = fs.readFileSync('.github/workflows/android-release.yml', 'utf8');\nconst assets = JSON.parse(fs.readFileSync('config/app-assets.json', 'utf8'));", 1)
          old_assert = "  assert.match(android, /cache:\\s*gradle/);\n});"
          if "retention component is part of the canonical offline asset contract" not in ci and old_assert in ci:
              new_assert = "  assert.match(android, /cache:\\s*gradle/);\n  assert.match(androidRelease, /Setup Java[\\s\\S]*cache:\\s*gradle/);\n});\n\ntest('retention component is part of the canonical offline asset contract', () => {\n  assert.ok(assets.criticalAppShell.includes('/css/components/retention.css'));\n  assert.ok(assets.networkFirstPaths.includes('/css/components/retention.css'));\n  assert.ok(assets.workerNoStorePaths.includes('/css/components/retention.css'));\n  assert.ok(assets.headersNoStorePaths.includes('/css/components/retention.css'));\n});"
              ci = ci.replace(old_assert, new_assert, 1)
          ci_path.write_text(ci)

          legacy = Path('public/css/responsive-polish-v10.64.19.css')
          if legacy.exists():
              legacy.unlink()
          PY

      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check src/index.js
          npm test
          npm run audit
          node scripts/release-contract.mjs check
          test ! -e public/css/responsive-polish-v10.64.19.css
          test -e public/css/responsive-polish-v10.64.20.css
          grep -q '"version": "10.64.20"' package.json
          grep -q '"version": "10.64.20"' public/version.json
          grep -q 'const APP_VERSION = "10.64.20"' src/index.js
          grep -q 'versionCode 106423' android/app/build.gradle
          grep -q 'versionName "10.64.20-mobile.1"' android/app/build.gradle
          grep -q 'responsive-polish-v10.64.20.css' public/index.html
          ! grep -q 'responsive-polish-v10.64.19.css' public/index.html
          ! grep -q 'responsive-polish-v10.64.19.css' public/sw.js
          ! grep -q 'responsive-polish-v10.64.19.css' public/js/ui/navigation.js
          ! grep -q '?v=10.64.19' public/js/app-pwa.js
          grep -q 'cache: gradle' .github/workflows/android-release.yml
          node - <<'NODE'
          const a = require('./config/app-assets.json');
          for (const key of ['criticalAppShell','networkFirstPaths','workerNoStorePaths','headersNoStorePaths']) {
            if (!a[key].includes('/css/components/retention.css')) throw new Error(`${key} missing retention.css`);
          }
          if (a.version !== '10.64.20') throw new Error('app-assets version mismatch');
          const c = require('./config/release-contract.json');
          if (c.version !== '10.64.20' || c.android.revision !== 1 || c.android.versionCode !== 106423) throw new Error('release contract mismatch');
          NODE

      - name: Commit validated migration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr305-migrate-v106420.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(release): alinhar runtime e assets em v10.64.20'
          git push origin HEAD:chore/ci-performance-architecture
