name: Phase 3-4-5 Hardening Sync

on:
  push:
    branches: [refactor/phase-3-4-5-platform-hardening]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/phase-3-4-5-platform-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize PWA and Worker hardening
        shell: python
        run: |
          import json
          from pathlib import Path

          new_paths = [
            '/js/core/study-events.js',
            '/js/core/study-guidance-engine.js',
            '/js/core/offline-sync-coordinator.js',
            '/js/core/study-observability.js',
          ]
          manifest_path = Path('config/app-assets.json')
          manifest = json.loads(manifest_path.read_text())
          for key in ['criticalAppShell','networkFirstPaths','workerNoStorePaths','headersNoStorePaths']:
              values = manifest.setdefault(key, [])
              for item in new_paths:
                  if item not in values:
                      values.append(item)
          critical = manifest['criticalAppShell']
          disabled = '/js/core/study-now-command-center.js'
          manifest['criticalAppShell'] = [item for item in critical if item != disabled]
          optional = manifest.setdefault('optionalOfflineAssets', [])
          if disabled not in optional:
              optional.append(disabled)
          for key, values in list(manifest.items()):
              if isinstance(values, list):
                  manifest[key] = list(dict.fromkeys(values))
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          sw_path = Path('public/sw.js')
          sw = sw_path.read_text()
          old = "'./js/core/edital-integrity.js', './js/core/exam-board-intelligence.js', './js/core/contextual-ai-tutor.js', './js/core/study-now-command-center.js', './js/core/local-backup-store.js'"
          new = "'./js/core/edital-integrity.js', './js/core/exam-board-intelligence.js', './js/core/contextual-ai-tutor.js', './js/core/study-events.js', './js/core/study-guidance-engine.js', './js/core/offline-sync-coordinator.js', './js/core/study-observability.js', './js/core/local-backup-store.js'"
          if old not in sw:
              raise SystemExit('anchor critical shell not found in sw.js')
          sw = sw.replace(old, new, 1)
          optional_anchor = "const OPTIONAL_OFFLINE_ASSETS = [\n  "
          if optional_anchor not in sw:
              raise SystemExit('optional asset anchor not found in sw.js')
          sw = sw.replace(optional_anchor, optional_anchor + "'./js/core/study-now-command-center.js', ", 1)
          core_anchor = "'/js/core/edital-integrity.js', '/js/core/exam-board-intelligence.js', '/js/core/contextual-ai-tutor.js', '/js/core/study-now-command-center.js', '/js/core/local-backup-store.js'"
          core_new = "'/js/core/edital-integrity.js', '/js/core/exam-board-intelligence.js', '/js/core/contextual-ai-tutor.js', '/js/core/study-now-command-center.js', '/js/core/study-events.js', '/js/core/study-guidance-engine.js', '/js/core/offline-sync-coordinator.js', '/js/core/study-observability.js', '/js/core/local-backup-store.js'"
          if core_anchor not in sw:
              raise SystemExit('core path anchor not found in sw.js')
          sw = sw.replace(core_anchor, core_new, 1)
          sw_path.write_text(sw)

          worker_path = Path('src/index.js')
          worker = worker_path.read_text()
          no_store_anchor = '"/js/study-domain.js", "/js/core/local-backup-store.js"'
          no_store_new = '"/js/study-domain.js", "/js/core/study-events.js", "/js/core/study-guidance-engine.js", "/js/core/offline-sync-coordinator.js", "/js/core/study-observability.js", "/js/core/local-backup-store.js"'
          if no_store_anchor not in worker:
              raise SystemExit('worker no-store path anchor not found')
          worker = worker.replace(no_store_anchor, no_store_new, 1)
          old_worker = '''    if (request.method === "GET" && CORE_NO_STORE_PATHS.has(url.pathname)) {
                const assetResponse = await env.ASSETS.fetch(request);
                const headers = new Headers(assetResponse.headers);
                headers.set("cache-control", "no-cache, no-store, must-revalidate");
                headers.set("pragma", "no-cache");
                headers.set("expires", "0");
                headers.set("x-app-version", APP_VERSION);
                return new Response(assetResponse.body, { status:assetResponse.status, statusText:assetResponse.statusText, headers });
              }
          '''.replace('              ','')
          new_worker = '''    if (request.method === "GET" && url.searchParams.get("v") === APP_VERSION && /\\.(?:js|css)$/.test(url.pathname)) {
                const assetResponse = await env.ASSETS.fetch(request);
                const headers = new Headers(assetResponse.headers);
                headers.set("cache-control", "public, max-age=31536000, immutable");
                headers.set("x-app-version", APP_VERSION);
                return new Response(assetResponse.body, { status:assetResponse.status, statusText:assetResponse.statusText, headers });
              }

              if (request.method === "GET" && CORE_NO_STORE_PATHS.has(url.pathname)) {
                const assetResponse = await env.ASSETS.fetch(request);
                const headers = new Headers(assetResponse.headers);
                headers.set("cache-control", "no-cache, no-store, must-revalidate");
                headers.set("pragma", "no-cache");
                headers.set("expires", "0");
                headers.set("x-app-version", APP_VERSION);
                return new Response(assetResponse.body, { status:assetResponse.status, statusText:assetResponse.statusText, headers });
              }
          '''.replace('              ','')
          if old_worker not in worker:
              raise SystemExit('worker cache anchor not found')
          worker = worker.replace(old_worker, new_worker, 1)
          worker_path.write_text(worker)

          headers_path = Path('public/_headers')
          headers = headers_path.read_text()
          if '/js/core/study-events.js\n' not in headers:
              insert_before = '/css/responsive-polish-v10.64.28.css\n'
              blocks = ''.join(f'{item}\n  Cache-Control: no-cache, no-store, must-revalidate\n\n' for item in new_paths)
              if insert_before not in headers:
                  raise SystemExit('_headers insertion anchor not found')
              headers = headers.replace(insert_before, blocks + insert_before, 1)
          headers_path.write_text(headers)
      - name: Syntax checks
        run: |
          node --check public/js/core/offline-sync-coordinator.js
          node --check public/js/core/study-observability.js
          node --check public/js/core/study-events.js
          node --check src/index.js
      - name: New hardening tests
        run: node --test tests/phase-3-4-5-platform-hardening.test.cjs
      - name: Full unit suite
        run: npm test
      - name: Structural audit
        id: structural-audit
        shell: bash
        run: |
          set +e
          npm run audit > phase345-audit-full.log 2>&1
          rc=$?
          grep -E -B 4 -A 10 'ERRO|AUDITORIA REPROVADA|AssertionError|not ok|falhou|ausente|diverge' phase345-audit-full.log | tail -300 > phase345-audit-failure.log || true
          cat phase345-audit-failure.log
          exit $rc
      - name: Persist audit diagnostics
        if: failure() && steps.structural-audit.outcome == 'failure'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phase345-audit-failure.log
          if ! git diff --cached --quiet; then
            git commit -m "ci(platform): registrar falha estrutural das fases 3-5"
            git push origin HEAD:refactor/phase-3-4-5-platform-hardening
          fi
      - name: Commit synchronized hardening
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/app-assets.json public/sw.js src/index.js public/_headers
          if ! git diff --cached --quiet; then
            git commit -m "perf(platform): sincronizar cache e shell das fases 3-5"
            git push origin HEAD:refactor/phase-3-4-5-platform-hardening
          fi
      - name: Remove temporary workflow
        if: success()
        run: |
          git pull --rebase origin refactor/phase-3-4-5-platform-hardening
          git rm .github/workflows/phase345-hardening-sync.yml
          git rm -f .phase345-diagnostic-trigger phase345-audit-failure.log || true
          git commit -m "chore(ci): remover diagnósticos temporários das fases 3-5"
          git push origin HEAD:refactor/phase-3-4-5-platform-hardening
