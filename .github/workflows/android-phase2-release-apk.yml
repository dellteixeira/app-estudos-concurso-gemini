name: Android Phase 2A Release APK

on:
  push:
    branches:
      - feat/android-phase2a-release-apk-v10.64.16
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'src/**'
      - 'scripts/prepare-android-assets.mjs'
      - 'scripts/migrate-android-phase1b.mjs'
      - '.github/workflows/android-phase2-release-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical Android migration
        run: node scripts/migrate-android-phase1b.mjs

      - name: Run web unit tests
        run: npm test

      - name: Run structural audits
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

      - name: Prepare Worker-proxied vendor assets
        run: npm run android:prepare

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Resolve and verify release identity
        id: release_identity
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' android/app/build.gradle | head -n1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -n1)"
          WEB_VERSION="$(node -p "require('./public/version.json').version")"

          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test -n "$WEB_VERSION"

          # Android may carry an explicit mobile suffix, but its base release must
          # always match the canonical web version.
          ANDROID_BASE_VERSION="${VERSION_NAME%%-mobile.*}"
          if [[ "$ANDROID_BASE_VERSION" != "$WEB_VERSION" ]]; then
            echo "Release identity mismatch: Android=$VERSION_NAME Web=$WEB_VERSION" >&2
            exit 1
          fi

          grep -q "versionCode $VERSION_CODE" android/app/build.gradle
          grep -q "versionName \"$VERSION_NAME\"" android/app/build.gradle
          grep -q "\"version\": \"$WEB_VERSION\"" public/version.json

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "web_version=$WEB_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release APK only
        working-directory: android
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Validate release APK artifact
        shell: bash
        env:
          WEB_VERSION: ${{ steps.release_identity.outputs.web_version }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null

          if find android/app/build/outputs -type f -name '*.aab' -print -quit | grep -q .; then
            echo 'AAB inesperado foi produzido; Phase 2A deve gerar somente APK.' >&2
            exit 1
          fi

          mkdir -p dist/android
          OUTPUT="dist/android/EstudoAdaptativo-v${WEB_VERSION}-release-unsigned.apk"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" | tee dist/android/SHA256SUMS.txt
          ls -lh dist/android

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EstudoAdaptativo-release-apk
          path: |
            dist/android/*-release-unsigned.apk
            dist/android/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
