name: Repair responsive cache contract

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-responsive-cache-contract.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Synchronize canonical manifest and service worker
        shell: python
        run: |
          import json
          from pathlib import Path

          asset = '/css/responsive-polish-v10.64.17.css'
          asset_rel = './css/responsive-polish-v10.64.17.css'
          manifest_path = Path('config/app-assets.json')
          sw_path = Path('public/sw.js')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for key, anchor in [
              ('criticalAppShell', '/css/responsive-system.css'),
              ('networkFirstPaths', '/css/responsive-system.css'),
          ]:
              items = manifest[key]
              if asset not in items:
                  if anchor not in items:
                      raise SystemExit(f'anchor {anchor} missing from {key}')
                  items.insert(items.index(anchor) + 1, asset)
              if items.count(asset) != 1:
                  raise SystemExit(f'{asset} must appear exactly once in {key}')

          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          sw = sw_path.read_text(encoding='utf-8')
          critical_anchor = "'./css/responsive-system.css'"
          network_anchor = "'/css/responsive-system.css'"

          if asset_rel not in sw:
              if critical_anchor not in sw:
                  raise SystemExit('critical SW anchor missing')
              sw = sw.replace(critical_anchor, critical_anchor + ", './css/responsive-polish-v10.64.17.css'", 1)
          if sw.count("'./css/responsive-polish-v10.64.17.css'") != 1:
              raise SystemExit('critical responsive-polish entry must appear exactly once')

          if asset not in sw:
              if network_anchor not in sw:
                  raise SystemExit('network-first SW anchor missing')
              sw = sw.replace(network_anchor, network_anchor + ", '/css/responsive-polish-v10.64.17.css'", 1)
          if sw.count("'/css/responsive-polish-v10.64.17.css'") != 1:
              raise SystemExit('network-first responsive-polish entry must appear exactly once')

          sw_path.write_text(sw, encoding='utf-8')

      - name: Run canonical asset audit
        run: node scripts/audit-asset-manifest.mjs

      - name: Commit repaired cache contract
        run: |
          if git diff --quiet -- config/app-assets.json public/sw.js; then
            echo 'Cache contract already correct.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/app-assets.json public/sw.js
          git commit -m 'fix(pwa): govern responsive polish cache contract'
          git push origin HEAD:main
