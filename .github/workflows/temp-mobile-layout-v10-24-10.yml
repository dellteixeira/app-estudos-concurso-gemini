name: Temporary Mobile Layout v10.24.10
on:
  push:
    branches: [fix/mobile-library-layout-v10-24-10]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[mobile-layout-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-library-layout-v10-24-10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply mobile fixes
        run: python3 scripts/apply_mobile_library_layout_v10_24_10.py
      - name: Validate
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: |
          npm test
          npm run audit
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: mobile library and action grids [mobile-layout-applied]" || exit 0
          git push origin HEAD:fix/mobile-library-layout-v10-24-10
