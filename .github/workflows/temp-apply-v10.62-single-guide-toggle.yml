name: TEMP Apply v10.62 Single Guide Toggle

on:
  push:
    branches:
      - fix/edital-guides-single-toggle-v10.62.0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/edital-guides-single-toggle-v10.62.0
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Apply implementation
        run: python3 scripts/temp-apply-v10.62-single-guide-toggle.py
      - name: Remove temporary applicator
        run: rm .github/workflows/temp-apply-v10.62-single-guide-toggle.yml scripts/temp-apply-v10.62-single-guide-toggle.py
      - name: Validate syntax, tests and audits
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check public/js/app-core.js
          node --check public/js/app-ui.js
          npm test
          AUDIT_ALLOW_ANY_ROOT=1 npm run audit
      - name: Commit final implementation
        run: |
          set -euo pipefail
          git config user.name dellteixeira
          git config user.email 111660903+dellteixeira@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): unificar expansão e recolhimento das guias"
          git push origin HEAD:fix/edital-guides-single-toggle-v10.62.0
