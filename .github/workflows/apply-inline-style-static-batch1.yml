name: Apply Inline Style Static Batch 1

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'hardening/inline-style-static-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Migrate safe static inline styles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          html_path = Path('public/index.html')
          css_path = Path('public/css/base.css')
          test_path = Path('tests/inline-style-static-budget.test.cjs')
          budget_path = Path('security/inline-style-budget.json')

          html = html_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          original_count = len(re.findall(r'\sstyle\s*=\s*["\']', html, flags=re.I))

          # Conservative allowlist: presentation-only properties. State/layout values
          # commonly mutated by JS (display, width, height, position, opacity,
          # transforms, overflow, CSS variables, etc.) are intentionally excluded.
          allowed = {
              'margin','margin-top','margin-right','margin-bottom','margin-left',
              'padding','padding-top','padding-right','padding-bottom','padding-left',
              'gap','row-gap','column-gap','flex','flex-grow','flex-shrink','flex-basis',
              'cursor','text-align','font-size','font-weight','font-style','line-height',
              'letter-spacing','white-space','border','border-top','border-right',
              'border-bottom','border-left','border-radius','color','text-decoration'
          }

          style_to_class = {}
          generated = []

          def parse_props(style):
              props=[]
              for decl in style.split(';'):
                  decl=decl.strip()
                  if not decl:
                      continue
                  if ':' not in decl:
                      return None
                  prop,val=decl.split(':',1)
                  prop=prop.strip().lower()
                  val=val.strip()
                  if not prop or not val or prop.startswith('--'):
                      return None
                  props.append((prop,val))
              return props

          tag_re = re.compile(r'<([A-Za-z][A-Za-z0-9:-]*)([^<>]*?)\sstyle="([^"]*)"([^<>]*?)>', re.S)

          def migrate_tag(m):
              tag, before, style, after = m.groups()
              props = parse_props(style)
              if not props or any(prop not in allowed for prop,_ in props):
                  return m.group(0)
              normalized=';'.join(f'{p}:{v}' for p,v in props)+';'
              cls=style_to_class.get(normalized)
              if not cls:
                  cls=f'u-static-{len(style_to_class)+1:03d}'
                  style_to_class[normalized]=cls
                  generated.append((cls, normalized))
              attrs=(before+after)
              class_re=re.compile(r'\bclass="([^"]*)"')
              if class_re.search(attrs):
                  attrs=class_re.sub(lambda cm: f'class="{cm.group(1)} {cls}"', attrs, count=1)
              else:
                  attrs=f' class="{cls}"'+attrs
              return f'<{tag}{attrs}>'

          migrated = tag_re.sub(migrate_tag, html)
          remaining_count = len(re.findall(r'\sstyle\s*=\s*["\']', migrated, flags=re.I))
          migrated_count = original_count - remaining_count
          if migrated_count <= 0:
              raise SystemExit('No safe static inline styles were migrated; refusing empty batch.')

          marker_start='/* INLINE_STATIC_BATCH1_START */'
          marker_end='/* INLINE_STATIC_BATCH1_END */'
          if marker_start in css:
              raise SystemExit('Batch marker already exists in base.css')
          css_block='\n\n'+marker_start+'\n'+'\n'.join(f'.{cls}{{{decl}}}' for cls,decl in generated)+'\n'+marker_end+'\n'

          html_path.write_text(migrated, encoding='utf-8')
          css_path.write_text(css.rstrip()+css_block, encoding='utf-8')
          budget_path.parent.mkdir(parents=True, exist_ok=True)
          budget_path.write_text(json.dumps({
              'baseline': original_count,
              'budget': remaining_count,
              'migrated': migrated_count,
              'policy': 'Static presentation-only inline styles migrated; JS-controlled state/dynamic styles remain allowed temporarily.'
          }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          test_path.write_text(r'''const test=require('node:test');
const assert=require('node:assert/strict');
const fs=require('node:fs');
const path=require('node:path');
const root=path.resolve(__dirname,'..');
const read=r=>fs.readFileSync(path.join(root,r),'utf8');

test('inline style budget only permits dynamic/state styles after static migration',()=>{
  const h=read('public/index.html');
  const c=read('public/css/base.css');
  const b=JSON.parse(read('security/inline-style-budget.json'));
  const count=(h.match(/\sstyle\s*=\s*["']/gi)||[]).length;
  assert.ok(count<=b.budget,`inline style budget exceeded: ${count} > ${b.budget}`);
  assert.ok(b.migrated>0,'the batch must migrate at least one static style');
  assert.match(c,/INLINE_STATIC_BATCH1_START/);
  assert.match(c,/\.u-static-\d{3}\{/);
});

test('safe presentation-only style attributes are not reintroduced into index.html',()=>{
  const h=read('public/index.html');
  const allowed=new Set(['margin','margin-top','margin-right','margin-bottom','margin-left','padding','padding-top','padding-right','padding-bottom','padding-left','gap','row-gap','column-gap','flex','flex-grow','flex-shrink','flex-basis','cursor','text-align','font-size','font-weight','font-style','line-height','letter-spacing','white-space','border','border-top','border-right','border-bottom','border-left','border-radius','color','text-decoration']);
  for(const m of h.matchAll(/\sstyle="([^"]*)"/gi)){
    const props=m[1].split(';').map(x=>x.trim()).filter(Boolean).map(x=>x.split(':',1)[0].trim().toLowerCase());
    assert.ok(props.some(p=>!allowed.has(p)),`safe static inline style should be a CSS class: ${m[1]}`);
  }
});
''', encoding='utf-8')

          print(f'inline styles: {original_count} -> {remaining_count}; migrated={migrated_count}; classes={len(generated)}')
          PY

      - name: Verify tests and structural audit
        run: |
          node --test tests/*.test.cjs
          npm run audit

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/css/base.css tests/inline-style-static-budget.test.cjs security/inline-style-budget.json
          git commit -m "refactor: migrate safe static inline styles to CSS classes"
          git push origin HEAD:${{ github.head_ref }}
