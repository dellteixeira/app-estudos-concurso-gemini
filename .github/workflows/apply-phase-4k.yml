name: Apply Phase 4K
"on":
  push:
    branches:
      - feat/offline-metadata-expanded-stability-v10.42.0
    paths:
      - .github/workflows/apply-phase-4k.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/offline-metadata-expanded-stability-v10.42.0
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 tools/apply-phase-4k.py
      - name: Commit integration and remove helpers
        run: |
          git rm .github/workflows/apply-phase-4k.yml tools/apply-phase-4k.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/js/app-state.js config/app-assets.json public/sw.js src/worker.js public/_headers
          git commit -m 'feat(sync): integrate expanded metadata stability diagnostics'
          git push origin HEAD:feat/offline-metadata-expanded-stability-v10.42.0
