name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-line-endings:
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/inline-style-state-batch2'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore CRLF in index only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          raw=p.read_bytes()
          normalized=raw.replace(b'\r\n',b'\n').replace(b'\n',b'\r\n')
          p.write_bytes(normalized)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: preserve index CRLF line endings"
            git push origin HEAD:${{ github.head_ref }}
          fi
