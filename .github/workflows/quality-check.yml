name: Quality Check

on:
  push:
    branches: [hardening/inline-style-debt-batch4]

permissions:
  contents: write

jobs:
  apply-inline-style-batch4:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/inline-style-debt-batch4
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-inline-style-batch4.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/css/base.css scripts/audit-inline-csp.mjs tests/inline-style-batch4.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m "refactor(css): migrate static inline styles batch 4"
            git push origin HEAD:hardening/inline-style-debt-batch4
          fi
