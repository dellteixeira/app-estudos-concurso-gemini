name: Quality Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-visual-state-batch3:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Inspect visual-state targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets=['authStatusMessage','superUserBadge','customDailyHoursPanel','notaTituloCustomGroup','btnDownloadEdital','btnRemoveEdital','modalPdfNoteEditor']
          files=[Path('public/index.html'),*sorted(Path('public/js').rglob('*.js')),*sorted(Path('public/css').rglob('*.css'))]
          for target in targets:
              print(f'=== {target} ===')
              for p in files:
                  if not p.is_file(): continue
                  text=p.read_text(encoding='utf-8',errors='replace')
                  for n,line in enumerate(text.splitlines(),1):
                      if target in line:
                          print(f'{p}:{n}: {line.strip()}')
          print('=== style.display references in matching files ===')
          for p in sorted(Path('public/js').rglob('*.js')):
              text=p.read_text(encoding='utf-8',errors='replace')
              for n,line in enumerate(text.splitlines(),1):
                  if '.style.display' in line and any(t in text[max(0,text.find(line)-500):text.find(line)+500] for t in targets):
                      print(f'{p}:{n}: {line.strip()}')
          PY
