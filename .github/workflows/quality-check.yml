name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-library-cleanup:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/library-toolbar-remove-workspaces'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/library-toolbar-remove-workspaces
          fetch-depth: 0
      - name: Apply surgical cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/temp-library-toolbar-cleanup.yml')
          lines=p.read_text().splitlines()
          start=next(i for i,l in enumerate(lines) if l.strip()=='run: |')+1
          body=[]
          for line in lines[start:]:
              if line and len(line)-len(line.lstrip()) < 10:
                  break
              body.append(line[10:] if len(line)>=10 else '')
          Path('/tmp/apply-library-cleanup.sh').write_text('\n'.join(body)+'\n')
          PY
          bash /tmp/apply-library-cleanup.sh
      - name: Restore canonical Quality Check and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/library-toolbar-remove-workspaces
          git checkout -B fix/library-toolbar-remove-workspaces origin/fix/library-toolbar-remove-workspaces
          git checkout origin/main -- .github/workflows/quality-check.yml
          rm -f .github/workflows/temp-library-toolbar-pr-runner.yml .github/workflows/temp-library-toolbar-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: restaurar quality gate após limpeza da Biblioteca"
            git push origin HEAD:fix/library-toolbar-remove-workspaces
          fi

  test-and-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'fix/library-toolbar-remove-workspaces'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "O Quality Check canônico será restaurado antes da validação final."
