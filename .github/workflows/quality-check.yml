name: Quality Check

on:
  push:
    branches: [hardening/runtime-style-debt-batch8]

permissions:
  contents: write

jobs:
  migrate-runtime-styles:
    if: github.ref == 'refs/heads/hardening/runtime-style-debt-batch8'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/runtime-style-debt-batch8
          fetch-depth: 0

      - name: Apply migration
        run: |
          node scripts/migrate-runtime-style-debt.mjs
          node scripts/migrate-runtime-style-debt-pass2.mjs

      - name: Validate syntax
        run: |
          node --check public/js/app-core.js
          node --check public/js/app-ui.js

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/app-core.js public/js/app-ui.js public/css/base.css security/runtime-style-debt.json tests/runtime-style-debt-batch8.test.cjs
          git commit -m "Hardening — reduzir dívida de estilos em runtime" || exit 0
          git push origin HEAD:hardening/runtime-style-debt-batch8
