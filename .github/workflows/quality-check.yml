name: Quality Check

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  finalize-inline-style-batch6:
    if: github.event.pull_request.head.ref == 'hardening/inline-style-debt-batch6'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/inline-style-debt-batch6
          fetch-depth: 0
      - name: Finalize patch
        run: python3 scripts/finalize-inline-style-batch6.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/css/base.css scripts/audit-inline-csp.mjs tests/inline-style-batch6.test.cjs
          git commit -m "refactor(css): finalize static inline styles batch 6"
          git push origin HEAD:hardening/inline-style-debt-batch6
