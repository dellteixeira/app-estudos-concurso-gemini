name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare promoted v10.34.0 workspace
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/offline-edital-graduation-v10.34.0'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -l '10\.33\.3' -- public src config tests package.json || true)
          if ((${#files[@]})); then
            sed -i 's/10\.33\.3/10.34.0/g' "${files[@]}"
          fi
          if git grep -n '10\.33\.3' -- public src config tests package.json; then
            echo 'Residual 10.33.3 release literal found.' >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Syntax check
        run: node --check src/index.js

      - name: Automated tests
        run: npm test

      - name: Structural audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser responsive audit
        run: npm run test:browser

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-responsive-audit-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit promoted v10.34.0
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'feat/offline-edital-graduation-v10.34.0'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/offline-edital-graduation-v10.34.0
          git checkout -B feat/offline-edital-graduation-v10.34.0 origin/feat/offline-edital-graduation-v10.34.0
          mapfile -t files < <(git grep -l '10\.33\.3' -- public src config tests package.json || true)
          if ((${#files[@]})); then
            sed -i 's/10\.33\.3/10.34.0/g' "${files[@]}"
          fi
          if git grep -n '10\.33\.3' -- public src config tests package.json; then
            echo 'Residual 10.33.3 release literal found.' >&2
            exit 1
          fi
          git checkout origin/main -- .github/workflows/quality-check.yml
          git rm -f .github/workflows/promote-v10-34-0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public src config tests package.json .github/workflows/quality-check.yml
          if git diff --cached --quiet; then
            echo 'No promotion changes required.'
            exit 0
          fi
          git commit -m 'chore(release): synchronize v10.34.0 promotion'
          git push origin HEAD:feat/offline-edital-graduation-v10.34.0
