name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-library-diff:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/library-toolbar-remove-workspaces'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/library-toolbar-remove-workspaces
          fetch-depth: 0
      - name: Restore exact index bytes and reapply only requested removals
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- public/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          data=p.read_bytes()
          patterns=[
              rb'^[ \t]*<span class="pdf-library-contest">Concurso: <strong id="pdfLibraryContestName">[^<]*</strong></span>\r?\n',
              rb'^[ \t]*<button class="btn btn-secondary" type="button" data-action="call" data-call="PdfStudyLibraryUI\.openWorkspaceModal">\+ Workspace</button>\r?\n',
              rb'^[ \t]*<select id="pdfWorkspaceFilter" data-inline-change="ih-016"><option value="">Todos os Workspaces</option></select>\r?\n',
          ]
          for pattern in patterns:
              data,n=re.subn(pattern,b'',data,count=1,flags=re.M)
              if n!=1: raise SystemExit(f'expected one removal, got {n}: {pattern!r}')
          for token in [b'pdfLibraryContestName',b'pdfWorkspaceFilter',b'PdfStudyLibraryUI.openWorkspaceModal',b'Todos os Workspaces']:
              if token in data: raise SystemExit(f'forbidden token remains: {token!r}')
          p.write_bytes(data)
          PY
          git checkout origin/main -- .github/workflows/quality-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/quality-check.yml
          git commit -m "chore(library): preservar diff cirúrgico do markup"
          git push origin HEAD:fix/library-toolbar-remove-workspaces

  test-and-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'fix/library-toolbar-remove-workspaces'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "A validação canônica será executada após restaurar o workflow."
