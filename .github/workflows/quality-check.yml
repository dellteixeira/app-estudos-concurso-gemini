name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v10.25.5 functional branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/v10-25-5-hedged-ai-telemetry'
        uses: actions/checkout@v4
        with:
          ref: feat/v10-25-5-hedged-ai-telemetry
          fetch-depth: 0
      - name: Checkout event ref
        if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'feat/v10-25-5-hedged-ai-telemetry'
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar v10.25.5 na branch funcional
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/v10-25-5-hedged-ai-telemetry'
        run: |
          if [ -f scripts/temp-v10-25-5-hedged-telemetry-v2.mjs ]; then
            node scripts/temp-v10-25-5-hedged-telemetry-v2.mjs
          elif [ -f scripts/temp-v10-25-5-hedged-telemetry.mjs ]; then
            node scripts/temp-v10-25-5-hedged-telemetry.mjs
          fi
      - name: Sintaxe crítica
        run: |
          node --check src/index.js
      - name: Testes automatizados
        run: node --test tests/*.test.cjs
      - name: Auditoria estrutural
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: node scripts/audit-release.mjs
      - name: Gravar v10.25.5 na branch funcional
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/v10-25-5-hedged-ai-telemetry'
        run: |
          if [ ! -f scripts/temp-v10-25-5-hedged-telemetry.mjs ]; then
            exit 0
          fi
          rm -f scripts/temp-v10-25-5-hedged-telemetry.mjs scripts/temp-v10-25-5-hedged-telemetry-v2.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/index.js package.json public/version.json public/sw.js tests/*.test.cjs
          git add -u -- scripts/temp-v10-25-5-hedged-telemetry.mjs scripts/temp-v10-25-5-hedged-telemetry-v2.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat: hedged flashcard AI telemetry v10.25.5'
          git push origin HEAD:feat/v10-25-5-hedged-ai-telemetry
