name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v10-25-7-gemini-max-tokens-retry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar v10.25.7
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/v10-25-7-gemini-max-tokens-retry'
        run: node scripts/temp-v10-25-7-gemini-max-tokens-retry.mjs
      - name: Sintaxe crítica
        run: node --check src/index.js
      - name: Testes automatizados
        run: node --test tests/*.test.cjs
      - name: Auditoria estrutural
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: node scripts/audit-release.mjs
      - name: Gravar v10.25.7
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/v10-25-7-gemini-max-tokens-retry'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/index.js package.json public/version.json public/sw.js tests/*.test.cjs .github/workflows/quality-check.yml
          git add -u -- scripts/temp-v10-25-7-gemini-max-tokens-retry.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: handle Gemini MAX_TOKENS v10.25.7'
          git push origin HEAD:fix/v10-25-7-gemini-max-tokens-retry
