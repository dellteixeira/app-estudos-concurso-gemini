name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inline-batch2-codemod:
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/inline-debt-batch2'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply deterministic simple-call migration
        run: node scripts/migrate-inline-actions-batch2.mjs

      - name: Restore canonical Quality Check
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/quality-check.yml > .github/workflows/quality-check.yml

      - name: Commit transformed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/js/ui/navigation.js scripts/audit-inline-csp.mjs scripts/migrate-inline-actions-batch2.mjs .github/workflows/quality-check.yml
          git diff --cached --check -- . ':!public/index.html'
          git commit -m "Hardening: migrar chamadas inline simples para delegação"
          git push origin HEAD:${{ github.head_ref }}

  test-and-audit:
    if: github.event_name != 'pull_request' || github.head_ref != 'hardening/inline-debt-batch2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Syntax check
        run: node --check src/index.js

      - name: Automated tests
        run: npm test

      - name: Structural audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser responsive audit
        run: npm run test:browser

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-responsive-audit-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
