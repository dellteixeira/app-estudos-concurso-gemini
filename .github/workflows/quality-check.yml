name: Quality Check

on:
  push:
    branches: [hardening/visual-state-manager-batch3]

permissions:
  contents: write

jobs:
  apply-visual-state-batch3:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/visual-state-manager-batch3
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-visual-state-batch3.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/js/app-ai.js public/js/app-core.js public/js/study-domain.js public/js/pdf/pdf-reader.js public/css/base.css public/css/pdf-reader.css scripts/audit-inline-csp.mjs tests/visual-state-batch3.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m "refactor(ui): migrate dynamic visual states batch 3"
            git push origin HEAD:hardening/visual-state-manager-batch3
          fi
