name: Quality Check

on:
  push:
    branches: [feature/report-export-manual-visual]

permissions:
  contents: write

jobs:
  apply-report-manual-visual:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/report-export-manual-visual
          fetch-depth: 0
      - name: Apply visual patch
        run: python3 scripts/apply-report-manual-visual.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/study-performance-report-core.js tests/study-performance-report-manual-visual.test.cjs
          git commit -m "feat(report): align exported PDF with manual visual language"
          git push origin HEAD:feature/report-export-manual-visual
