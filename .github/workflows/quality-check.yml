name: Quality Check

on:
  push:
    branches: [fix/report-long-title-layout]

permissions:
  contents: write

jobs:
  patch-report-long-titles:
    if: github.ref == 'refs/heads/fix/report-long-title-layout'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/report-long-title-layout
          fetch-depth: 0

      - name: Apply adaptive report title patch
        run: node scripts/patch-report-long-title-layout.mjs

      - name: Validate report syntax
        run: node --check public/js/study-performance-report-core.js

      - name: Commit patch and restore canonical workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/study-performance-report-core.js tests/study-performance-report-long-title.test.cjs .github/workflows/quality-check.yml scripts/patch-report-long-title-layout.mjs
          git commit -m "Fix — adaptar títulos longos no PDF exportado" || exit 0
          git push origin HEAD:fix/report-long-title-layout
