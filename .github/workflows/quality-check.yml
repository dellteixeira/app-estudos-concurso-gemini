name: Quality Check

on:
  push:
    branches: [hardening/inline-style-runtime-zero]

permissions:
  contents: write

jobs:
  apply-inline-style-runtime-zero:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/inline-style-runtime-zero
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-inline-style-runtime-zero.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/js/app-core.js public/css/base.css scripts/audit-inline-csp.mjs tests/inline-style-batch6.test.cjs tests/inline-style-runtime-zero.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m "refactor(csp): eliminate final runtime inline styles"
            git push origin HEAD:hardening/inline-style-runtime-zero
          fi
