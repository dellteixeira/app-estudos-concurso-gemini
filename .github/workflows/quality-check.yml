name: Quality Check

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate-inline-handlers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'

      - name: Externalize static inline handlers
        run: node scripts/tmp-migrate-complex-inline-handlers.mjs

      - name: Validate generated JavaScript
        run: node --check public/js/app-ui.js

      - name: Restore canonical Quality Check and remove one-use tooling
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/quality-check.yml > .github/workflows/quality-check.yml
          git rm -f .github/workflows/tmp-inline-complex-migrate.yml
          git rm -f scripts/tmp-migrate-complex-inline-handlers.mjs

      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/quality-check.yml public/index.html public/js/app-ui.js scripts/audit-inline-csp.mjs tests/inline-handler-externalization.test.cjs
          git diff --cached --check -- ':!public/index.html'
          git commit -m "Externalizar handlers inline complexos"
          git push origin HEAD:${{ github.head_ref }}
