name: Runtime Style Finalizer

on:
  push:
    branches: [hardening/runtime-style-debt-batch8]

permissions:
  contents: write

jobs:
  finalize:
    if: github.ref == 'refs/heads/hardening/runtime-style-debt-batch8'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/runtime-style-debt-batch8
          fetch-depth: 0
      - name: Finalize migration
        run: node scripts/finalize-runtime-style-debt-batch8.mjs
      - name: Validate syntax and tests
        run: |
          node --check public/js/app-core.js
          node --check public/js/app-ui.js
          npm test
      - name: Commit final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hardening — finalizar dívida de estilos em runtime" || exit 0
          git push origin HEAD:hardening/runtime-style-debt-batch8
