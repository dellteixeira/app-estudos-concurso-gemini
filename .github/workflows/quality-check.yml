name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: node --check src/index.js

      - name: Automated tests
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test-output.txt

      - name: Upload failing test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-test-output
          path: test-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Structural audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit
