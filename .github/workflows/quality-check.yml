name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply Firefox longtask feature detection
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/firefox-longtask-observer'
        shell: python
        run: |
          from pathlib import Path

          path = Path('public/js/app-core.js')
          text = path.read_text(encoding='utf-8')
          old = """        if ('PerformanceObserver' in window) {
            try {
                const longTaskObserver = new PerformanceObserver(list => {
                    list.getEntries().forEach(entry => recordLocalPerformance('longtask', entry.name || 'longtask', entry.duration));
                });
                longTaskObserver.observe({ type: 'longtask', buffered: true });
            } catch (_) {}
        }
"""
          new = """        const supportsLongTaskObserver =
            'PerformanceObserver' in window &&
            Array.isArray(PerformanceObserver.supportedEntryTypes) &&
            PerformanceObserver.supportedEntryTypes.includes('longtask');

        if (supportsLongTaskObserver) {
            try {
                const longTaskObserver = new PerformanceObserver(list => {
                    list.getEntries().forEach(entry => recordLocalPerformance('longtask', entry.name || 'longtask', entry.duration));
                });
                longTaskObserver.observe({ type: 'longtask', buffered: true });
            } catch (_) {}
        }
"""
          if old not in text:
              raise SystemExit('Bloco alvo não encontrado; nenhuma alteração aplicada.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check src/index.js
          node --check public/js/app-core.js

      - name: Automated tests
        run: npm test

      - name: Structural audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

      - name: Commit validated patch and restore workflows
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/firefox-longtask-observer'
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/quality-check.yml
          rm -f .github/workflows/fix-firefox-longtask.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/app-core.js .github/workflows/quality-check.yml .github/workflows/fix-firefox-longtask.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: detectar suporte a longtask antes de observar"
          git push origin HEAD:fix/firefox-longtask-observer
