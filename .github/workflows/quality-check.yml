name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Finalize compact responsive cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/compact-actions-menu-v10.50.1'
        shell: bash
        run: |
          python3 scripts/cleanup-compact-responsive.py
          node --test tests/compact-actions-menu.test.cjs tests/responsive-header-phase3.test.cjs
          rm -f scripts/cleanup-compact-responsive.py
          git show origin/main:.github/workflows/quality-check.yml > .github/workflows/quality-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/css/responsive-system.css scripts/cleanup-compact-responsive.py .github/workflows/quality-check.yml
          git commit -m "chore(ui): remove final legacy action bar residue"
          git push origin HEAD:feat/compact-actions-menu-v10.50.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Syntax check
        run: node --check src/index.js

      - name: Automated tests
        run: npm test

      - name: Structural audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser responsive audit
        run: npm run test:browser

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-responsive-audit-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
