name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Audit inline visibility state candidates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html=Path('public/index.html').read_text(encoding='utf-8')
          print('=== INLINE STYLE ATTRIBUTES CONTAINING display/visibility ===')
          tag_re=re.compile(r'<([A-Za-z][A-Za-z0-9:-]*)([^<>]*?)\sstyle="([^"]*)"([^<>]*?)>',re.S)
          ids=[]
          for m in tag_re.finditer(html):
              tag,before,style,after=m.groups()
              if not re.search(r'(^|;)\s*(display|visibility)\s*:',style,re.I):
                  continue
              attrs=before+after
              idm=re.search(r'\bid="([^"]+)"',attrs)
              cls=re.search(r'\bclass="([^"]+)"',attrs)
              ident=idm.group(1) if idm else '(no-id)'
              ids.append(ident)
              print(f'{ident}\t<{tag}>\tclass={cls.group(1) if cls else ""}\tstyle={style}')

          print('\n=== JS REFERENCES TO style.display / style.visibility / hidden ===')
          for p in sorted(Path('public/js').rglob('*.js')):
              text=p.read_text(encoding='utf-8',errors='replace')
              for n,line in enumerate(text.splitlines(),1):
                  if re.search(r'\.style\.(display|visibility)\b|\.hidden\b|setAttribute\(["\']hidden|removeAttribute\(["\']hidden',line):
                      print(f'{p}:{n}: {line.strip()}')

          print('\n=== CANDIDATE ID REFERENCES ===')
          for ident in ids:
              if ident == '(no-id)':
                  continue
              needle=re.compile(re.escape(ident))
              for p in sorted(Path('public/js').rglob('*.js')):
                  text=p.read_text(encoding='utf-8',errors='replace')
                  for n,line in enumerate(text.splitlines(),1):
                      if needle.search(line):
                          print(f'{ident}\t{p}:{n}: {line.strip()}')
          PY

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Syntax check
        run: node --check src/index.js

      - name: Automated tests
        run: npm test

      - name: Structural audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser responsive audit
        run: npm run test:browser

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-responsive-audit-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
