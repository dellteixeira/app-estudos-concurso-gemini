name: Quality Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.scope.outputs.ui }}
      full_browser: ${{ steps.scope.outputs.full_browser }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed scopes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "full_browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          fi

          files="$(git diff --name-only "$base" HEAD)"
          printf '%s\n' "$files"

          ui=false
          while IFS= read -r file; do
            case "$file" in
              public/*.html|public/css/*|public/css/**/*|public/js/*|public/js/**/*|playwright.config.cjs|tests/browser/*|tests/browser/**/*|tests/*retention*)
                ui=true
                ;;
            esac
          done <<< "$files"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "full_browser=true" >> "$GITHUB_OUTPUT"

  fast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Syntax check
        run: node --check src/index.js

      - name: Automated tests
        run: npm test

      - name: Structural audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

  ui-check:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Playwright test runner
        run: node scripts/ci-retry.mjs --attempts=3 --delay-ms=4000 npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Cache full Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-full

      - name: Install full browser dependencies
        run: node scripts/ci-retry.mjs --attempts=3 --delay-ms=5000 npx playwright install-deps chromium firefox webkit

      - name: Install full browsers
        run: node scripts/ci-retry.mjs --attempts=3 --delay-ms=5000 npx playwright install chromium firefox webkit

      - name: Full browser responsive audit
        run: npm run test:browser

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-responsive-audit-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  test-and-audit:
    name: test-and-audit
    needs: [changes, fast-check, ui-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required quality gates
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.fast-check.result }}" = "success"
          ui_result="${{ needs.ui-check.result }}"
          if [ "$ui_result" != "success" ] && [ "$ui_result" != "skipped" ]; then
            echo "ui-check terminou com $ui_result" >&2
            exit 1
          fi
          echo "Fast Check: success"
          echo "UI Check: $ui_result"
