name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-index-diff:
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/inline-style-state-batch2'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reapply only the three semantic replacements
        shell: bash
        run: |
          git checkout origin/main -- public/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          raw=p.read_bytes()
          replacements=[
            (b'<input type="file" id="jsonInput" accept=".json" style="display: none;" data-inline-change="ih-003">', b'<input type="file" id="jsonInput" accept=".json" hidden data-inline-change="ih-003">'),
            (b'<input id="flashcardsImportFile" type="file" accept="application/json,.json" style="display:none;" data-inline-change="ih-020">', b'<input id="flashcardsImportFile" type="file" accept="application/json,.json" hidden data-inline-change="ih-020">'),
            (b'<input type="file" id="editalFileInput" accept=".pdf,.doc,.docx,.rtf,.txt,image/*" style="display: none;" data-inline-change="ih-077">', b'<input type="file" id="editalFileInput" accept=".pdf,.doc,.docx,.rtf,.txt,image/*" hidden data-inline-change="ih-077">'),
          ]
          for old,new in replacements:
              count=raw.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, found {count}: {old[:60]!r}')
              raw=raw.replace(old,new,1)
          p.write_bytes(raw)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: preserve original index line endings"
            git push origin HEAD:${{ github.head_ref }}
          fi
