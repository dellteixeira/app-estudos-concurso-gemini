name: Quality Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-visual-state-manager:
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/visual-state-manager'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply semantic visual-state patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui=Path('public/js/app-ui.js')
          text=ui.read_text(encoding='utf-8')

          anchor="""        // =========================================================\n        // UI MODERNA 2026 — BUSCA, RESUMO, NAVEGAÇÃO MOBILE E FAB\n        // =========================================================\n"""
          helper="""        // =========================================================\n        // UI MODERNA 2026 — BUSCA, RESUMO, NAVEGAÇÃO MOBILE E FAB\n        // =========================================================\n        function setVisualState(element, visible) {\n            if (!element) return;\n            const isVisible = Boolean(visible);\n            element.classList.toggle('is-open', isVisible);\n            element.hidden = !isVisible;\n            element.setAttribute('aria-hidden', visible ? 'false' : 'true');\n        }\n\n"""
          if 'function setVisualState(element, visible)' not in text:
              if anchor not in text: raise SystemExit('app-ui helper anchor not found')
              text=text.replace(anchor, helper, 1)

          replacements={
            "modal.style.display = 'flex';":"setVisualState(modal, true);",
            "if (modal) modal.style.display = 'none';":"setVisualState(modal, false);",
            "const modal=document.getElementById('modalLayeredReview'); if(modal) modal.style.display='flex';":"const modal=document.getElementById('modalLayeredReview'); setVisualState(modal, true);",
            "const modal=document.getElementById('modalLayeredReview'); if(modal) modal.style.display='none';":"const modal=document.getElementById('modalLayeredReview'); setVisualState(modal, false);",
            "modal.style.display='flex';":"setVisualState(modal, true);",
            "if(modal) modal.style.display='none';":"setVisualState(modal, false);",
          }
          # Only replace occurrences in app-ui; this intentionally migrates modal-like flows in this module.
          for old,new in replacements.items():
              text=text.replace(old,new)
          ui.write_text(text,encoding='utf-8')

          css=Path('public/css/base.css')
          c=css.read_text(encoding='utf-8')
          rule="        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 1rem; }\n"
          open_rule=rule+"        .modal-overlay.is-open { display: flex; }\n"
          if '.modal-overlay.is-open' not in c:
              if rule not in c: raise SystemExit('modal-overlay rule not found')
              c=c.replace(rule,open_rule,1)
          css.write_text(c,encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/app-ui.js public/css/base.css
          git commit -m "refactor(ui): centralize modal visual state"
          git push origin HEAD:${{ github.head_ref }}
