name: Apply style-src-attr hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hardening:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/runtime-geometry-csp'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/runtime-geometry-csp
          fetch-depth: 0

      - name: Align patch helper with current audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch-style-src-attr-hardening.py')
          s=p.read_text(encoding='utf-8')
          start=s.index("# Structural CSP audit now requires the explicit attr directive.")
          s=s[:start]+'''# Structural CSP audit now requires the explicit attr directive.\naudit=read('scripts/audit-inline-csp.mjs')\nneedle=\"else ok('handlers legados isolados somente em script-src-attr');\"\nif needle not in audit:\n    raise SystemExit('CSP audit insertion point missing')\naudit=audit.replace(needle, needle+\"\\nconst styleAttr = csp.match(/(?:^|;\\\\s*)style-src-attr\\\\s+([^;]+)/)?.[1] || '';\\nif (!styleAttr.includes(\\\"'none'\\\")) fail(\\\"style-src-attr deve bloquear atributos style com 'none'\\\");\\nelse ok('style-src-attr bloqueado com none');\")\nwrite('scripts/audit-inline-csp.mjs',audit)\n\nprint('style-src-attr hardening patch applied')\n'''
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply deterministic patch
        run: python3 scripts/patch-style-src-attr-hardening.py

      - name: Restore canonical Quality Check and remove patch helper
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/quality-check.yml
          rm -f scripts/patch-style-src-attr-hardening.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "hardening: lock style-src-attr and remove blocked inline styles"
          git push origin HEAD:fix/runtime-geometry-csp
