name: Diagnose v10.40.0 Tests

on:
  push:
    branches:
      - feat/offline-metadata-expansion-v10.40.0
    paths:
      - .github/workflows/diagnose-v10-40-tests.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/offline-metadata-expansion-v10.40.0
          fetch-depth: 0

      - name: offline-sync-authority
        continue-on-error: true
        run: node --test tests/offline-sync-authority.test.cjs
      - name: offline-sync-edital-graduation
        continue-on-error: true
        run: node --test tests/offline-sync-edital-graduation.test.cjs
      - name: offline-sync-metadata-authority
        continue-on-error: true
        run: node --test tests/offline-sync-metadata-authority.test.cjs
      - name: offline-sync-metadata-expansion
        continue-on-error: true
        run: node --test tests/offline-sync-metadata-expansion.test.cjs
      - name: offline-sync-metadata-graduation
        continue-on-error: true
        run: node --test tests/offline-sync-metadata-graduation.test.cjs
      - name: offline-sync-metadata-rollout
        continue-on-error: true
        run: node --test tests/offline-sync-metadata-rollout.test.cjs
      - name: offline-sync-metadata-shadow
        continue-on-error: true
        run: node --test tests/offline-sync-metadata-shadow.test.cjs
      - name: offline-sync-metadata-stability
        continue-on-error: true
        run: node --test tests/offline-sync-metadata-stability.test.cjs
      - name: offline-sync-shadow
        continue-on-error: true
        run: node --test tests/offline-sync-shadow.test.cjs
      - name: Remaining test suite
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.cjs' -print | sort | grep -v -E 'offline-sync-(authority|edital-graduation|metadata-authority|metadata-expansion|metadata-graduation|metadata-rollout|metadata-shadow|metadata-stability|shadow)\.test\.cjs$')
          node --test "${files[@]}"

      - name: Remove diagnostic workflow
        run: rm .github/workflows/diagnose-v10-40-tests.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): remove v10.40.0 diagnostic workflow"
          git push origin HEAD:feat/offline-metadata-expansion-v10.40.0
