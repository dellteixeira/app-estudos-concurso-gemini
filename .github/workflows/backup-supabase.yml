name: Backup Supabase

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create backup directory
        run: mkdir -p backups/database backups/storage

      - name: Backup roles
        run: |
          supabase db dump \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            --role-only \
            -f backups/database/roles.sql

      - name: Backup schema, RLS, RPCs and grants
        run: |
          supabase db dump \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            -f backups/database/schema.sql

      - name: Backup data
        run: |
          supabase db dump \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            --data-only \
            --use-copy \
            -f backups/database/data.sql

      - name: Backup Storage objects when configured
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORAGE_BACKUP_DIR: backups/storage
        run: node scripts/backup-supabase-storage.mjs

      - name: Generate integrity manifests
        run: |
          find backups -type f -print0 | sort -z | xargs -0 sha256sum > backups/manifest.sha256
          {
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
          } > backups/backup-info.txt

      - name: Compact backup
        run: |
          tar -czf supabase-backup-${{ github.run_id }}.tar.gz backups

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: supabase-backup-${{ github.run_id }}.tar.gz
          retention-days: 30
          if-no-files-found: error
