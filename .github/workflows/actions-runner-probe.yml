name: Actions Runner Probe

on:
  push:
    branches:
      - diagnostic/actions-runner-probe

permissions:
  contents: read

jobs:
  ubuntu-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Runner acquired
        run: echo "ubuntu-runner-ok"

  windows-probe:
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - name: Runner acquired
        shell: pwsh
        run: Write-Output "windows-runner-ok"
