name: Diagnose v10.40.0 Residues

on:
  push:
    branches:
      - feat/offline-metadata-expansion-v10.40.0
    paths:
      - .github/workflows/diagnose-v10-40-residues.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/offline-metadata-expansion-v10.40.0
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'

      - name: Capture residues and failures
        shell: bash
        run: |
          python - <<'PY' > diagnostics-v10-40-residues.txt
          from pathlib import Path
          needles=['10.39.0', r'10\.39\.0']
          for p in sorted(Path('tests').glob('*.cjs')):
              text=p.read_text()
              hits=[]
              for n in needles:
                  if n in text:
                      for i,line in enumerate(text.splitlines(),1):
                          if n in line:
                              hits.append((i,line.strip()))
              if hits:
                  print(f'FILE {p}')
                  for i,line in hits: print(f'{i}: {line}')
          PY
          set +e
          node --test tests/*.test.cjs > /tmp/all.log 2>&1
          status=$?
          set -e
          {
            echo
            echo "npm_test_status=${status}"
            echo "=== FAILURES ==="
            grep -E -B 3 -A 20 'not ok|failureType:|AssertionError|ERR_ASSERTION|Error:' /tmp/all.log | tail -n 220 || true
          } >> diagnostics-v10-40-residues.txt

      - name: Remove diagnostic workflow and commit result
        run: |
          rm .github/workflows/diagnose-v10-40-residues.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): capture v10.40.0 residues"
          git push origin HEAD:feat/offline-metadata-expansion-v10.40.0
