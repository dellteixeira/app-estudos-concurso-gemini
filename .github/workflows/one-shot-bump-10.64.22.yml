name: One-shot bump v10.64.22

on:
  push:
    branches: [feat/exam-board-intelligence-v1]
    paths:
      - '.github/workflows/one-shot-bump-10.64.22.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/exam-board-intelligence-v1
          fetch-depth: 0
      - name: Apply v10.64.22 contract and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const oldV='10.64.21', newV='10.64.22';
          const replace=(file,a,b,all=false)=>{let t=fs.readFileSync(file,'utf8');if(!t.includes(a))throw new Error(`${file}: padrão ausente ${a}`);t=all?t.split(a).join(b):t.replace(a,b);fs.writeFileSync(file,t);};
          const c=JSON.parse(fs.readFileSync('config/release-contract.json','utf8')); if(c.version!==oldV)throw new Error(`versão inesperada ${c.version}`); c.version=newV;c.android.versionCode=106424;fs.writeFileSync('config/release-contract.json',JSON.stringify(c,null,2)+'\n');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=newV;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          if(fs.existsSync('package-lock.json')){const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));if(l.version===oldV)l.version=newV;if(l.packages?.['']?.version===oldV)l.packages[''].version=newV;fs.writeFileSync('package-lock.json',JSON.stringify(l,null,2)+'\n');}
          const pv=JSON.parse(fs.readFileSync('public/version.json','utf8'));pv.version=newV;fs.writeFileSync('public/version.json',JSON.stringify(pv,null,2)+'\n');
          replace('src/index.js',`const APP_VERSION = "${oldV}";`,`const APP_VERSION = "${newV}";`);
          replace('public/sw.js',`const APP_VERSION = '${oldV}';`,`const APP_VERSION = '${newV}';`);replace('public/sw.js',`responsive-polish-v${oldV}.css`,`responsive-polish-v${newV}.css`,true);
          replace('android/app/build.gradle','versionCode 106423','versionCode 106424');replace('android/app/build.gradle',`versionName "${oldV}-mobile.1"`,`versionName "${newV}-mobile.1"`);
          replace('public/js/ui/navigation.js',`const CORE_VERSION = '${oldV}';`,`const CORE_VERSION = '${newV}';`);replace('public/js/ui/navigation.js',`responsive-polish-v${oldV}.css?v=${oldV}`,`responsive-polish-v${newV}.css?v=${newV}`);
          let nav=fs.readFileSync('public/js/ui/navigation.js','utf8');
          const anchor="            if (!global.AppNextBestStudyAction) {\n                await loader.loadScript('./js/core/next-best-study-action.js', { async: false });\n            }";
          if(!nav.includes("AppExamBoardIntelligence")){if(!nav.includes(anchor))throw new Error('anchor NextBest ausente');nav=nav.replace(anchor,"            if (!global.AppExamBoardIntelligence) {\n                await loader.loadScript('./js/core/exam-board-intelligence.js', { async: false });\n            }\n"+anchor);fs.writeFileSync('public/js/ui/navigation.js',nav);}
          for(const file of ['public/js/core/asset-loader.js','public/js/app-pwa.js']){if(fs.existsSync(file)){let t=fs.readFileSync(file,'utf8');if(t.includes(oldV))fs.writeFileSync(file,t.split(oldV).join(newV));}}
          const assets=JSON.parse(fs.readFileSync('config/app-assets.json','utf8'));assets.version=newV;const path='/js/core/exam-board-intelligence.js';for(const k of ['criticalAppShell','networkFirstPaths','workerNoStorePaths','headersNoStorePaths']){if(Array.isArray(assets[k])&&!assets[k].includes(path)){const idx=assets[k].indexOf('/js/core/error-intelligence.js');idx>=0?assets[k].splice(idx+1,0,path):assets[k].push(path);}}for(const k of Object.keys(assets)){if(Array.isArray(assets[k]))assets[k]=assets[k].map(x=>typeof x==='string'?x.split(`responsive-polish-v${oldV}.css`).join(`responsive-polish-v${newV}.css`):x);}fs.writeFileSync('config/app-assets.json',JSON.stringify(assets,null,2)+'\n');
          const oldCss=`public/css/responsive-polish-v${oldV}.css`,newCss=`public/css/responsive-polish-v${newV}.css`;if(!fs.existsSync(newCss))fs.copyFileSync(oldCss,newCss);
          NODE
          node scripts/release-contract.mjs check
          npm test -- --test-name-pattern="board|banca|Next Best|next best" || npm test
      - name: Commit bump
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/release-contract.json package.json package-lock.json public/version.json src/index.js public/sw.js config/app-assets.json android/app/build.gradle public/js/ui/navigation.js public/js/core/asset-loader.js public/js/app-pwa.js public/css/responsive-polish-v10.64.22.css
          git diff --cached --quiet && exit 0
          git commit -m 'chore(release): bump runtime to v10.64.22'
          git push origin HEAD:feat/exam-board-intelligence-v1
