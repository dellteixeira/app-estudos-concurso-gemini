name: Temp critical buttons full width v10.64.15
on:
  push:
    branches:
      - fix/critical-buttons-full-width-v10.64.15
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Apply patch
        run: python3 .github/scripts/patch-critical-buttons-v106415.py
      - name: Remove temporary migration files
        run: rm .github/workflows/temp-critical-buttons-full-width-v10.64.15.yml .github/scripts/patch-critical-buttons-v106415.py
      - name: Validate
        run: npm test && npm run audit
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): dar largura real aos botões dos pontos críticos"
          git push