name: Temp critical buttons full width v10.64.15
on:
  push:
    branches:
      - fix/critical-buttons-full-width-v10.64.15
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Apply structural fit fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js = Path('public/js/critical-points-actions.js')
          s = js.read_text()
          s = s.replace("const VERSION='1.1.0';", "const VERSION='1.1.1';")
          old = """  const copy=article.querySelector('.retention-risk-copy');\n  if(copy)copy.appendChild(controls);\n  else article.appendChild(controls);"""
          if old not in s:
              raise SystemExit('critical controls append anchor not found')
          s = s.replace(old, "  article.appendChild(controls);", 1)
          js.write_text(s)

          css = Path('public/css/learning-advisor.css')
          c = css.read_text()
          marker = '/* V10.64.15 — Pontos críticos: ações ocupam toda a largura útil do card. */'
          if marker not in c:
              c += '''\n\n/* V10.64.15 — Pontos críticos: ações ocupam toda a largura útil do card. */\n#retentionDiagnosticPanel.retention-dashboard-v1072 .retention-risk-card-v1071.critical-actions-enabled > .critical-point-controls{\n  grid-column:2 / -1 !important;\n  width:100% !important;\n  max-width:none !important;\n  box-sizing:border-box !important;\n  grid-template-columns:minmax(0,1.2fr) minmax(0,1.16fr) minmax(0,.9fr) !important;\n  gap:8px !important;\n  margin-top:4px !important;\n}\n#retentionDiagnosticPanel.retention-dashboard-v1072 .retention-risk-card-v1071.critical-actions-enabled > .critical-point-controls button{\n  min-width:0 !important;\n  width:100% !important;\n  box-sizing:border-box !important;\n  padding:7px 7px !important;\n  font-size:.70rem !important;\n  line-height:1.1 !important;\n  white-space:nowrap !important;\n  overflow-wrap:normal !important;\n  word-break:keep-all !important;\n  hyphens:none !important;\n}\n#retentionDiagnosticPanel.retention-dashboard-v1072 .retention-risk-card-v1071.critical-actions-enabled > .critical-point-controls .critical-point-note{\n  grid-column:1 / -1 !important;\n}\n@media(max-width:820px){\n  #retentionDiagnosticPanel.retention-dashboard-v1072 .retention-risk-card-v1071.critical-actions-enabled > .critical-point-controls{\n    grid-column:2 / -1 !important;\n    grid-template-columns:minmax(0,1.2fr) minmax(0,1.16fr) minmax(0,.9fr) !important;\n    gap:6px !important;\n  }\n  #retentionDiagnosticPanel.retention-dashboard-v1072 .retention-risk-card-v1071.critical-actions-enabled > .critical-point-controls button{\n    padding:7px 5px !important;\n    font-size:.65rem !important;\n  }\n}\n@media(max-width:520px){\n  #retentionDiagnosticPanel.retention-dashboard-v1072 .retention-risk-card-v1071.critical-actions-enabled > .critical-point-controls{gap:5px !important;}\n  #retentionDiagnosticPanel.retention-dashboard-v1072 .retention-risk-card-v1071.critical-actions-enabled > .critical-point-controls button{padding-inline:4px !important;font-size:.61rem !important;}\n}\n'''
          css.write_text(c)

          for file in ['package.json','public/version.json','src/index.js','public/sw.js','config/app-assets.json','public/js/app-pwa.js']:
              p = Path(file)
              t = p.read_text()
              if '10.64.14' not in t:
                  raise SystemExit(f'expected version 10.64.14 not found in {file}')
              p.write_text(t.replace('10.64.14','10.64.15'))
          PY
          npm test
          npm run audit
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/js/critical-points-actions.js public/css/learning-advisor.css package.json public/version.json src/index.js public/sw.js config/app-assets.json public/js/app-pwa.js
          git commit -m "fix(ui): dar largura real aos botões dos pontos críticos"
          git push