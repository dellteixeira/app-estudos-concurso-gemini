name: Canonical Stable Release 10.26.0

on:
  push:
    branches:
      - ops/canonical-release-10.26.0-20260822

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_SHA: 33289bd3a7e9e467f99c1c355207ea53efde9aca
      RELEASE_TAG: v10.26.0-stable.20260822
      RELEASE_ZIP: app-estudos-concurso-gemini-v10.26.0-stable-20260822.zip
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          ref: ops/canonical-release-10.26.0-20260822
          fetch-depth: 0

      - name: Verify stable main commit exists and version is correct
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$MAIN_SHA^{commit}"
          git show "$MAIN_SHA:package.json" > /tmp/package.json
          node -e "const p=require('/tmp/package.json'); if (p.version !== '10.26.0') { throw new Error('Expected version 10.26.0, found ' + p.version); }"

      - name: Refuse to move an existing tag
        shell: bash
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [ -n "$existing" ] && [ "$existing" != "$MAIN_SHA" ]; then
            echo "Tag $RELEASE_TAG already exists at $existing, expected $MAIN_SHA. Refusing to move canonical release tag."
            exit 1
          fi

      - name: Build canonical source ZIP
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix="app-estudos-concurso-gemini-v10.26.0/" --output="$RELEASE_ZIP" "$MAIN_SHA"
          sha256sum "$RELEASE_ZIP" | tee "$RELEASE_ZIP.sha256"

      - name: Publish canonical GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; preserving it."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$MAIN_SHA" \
              --title "v10.26.0 — Stable snapshot 2026-08-22" \
              --notes "Canonical stable snapshot created before the grounding-retry hardening work. Source commit: $MAIN_SHA. This release is a rollback/reference point and is not a prerelease." \
              --latest=false
          fi
          gh release upload "$RELEASE_TAG" "$RELEASE_ZIP" "$RELEASE_ZIP.sha256" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify published release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish,assets,url)"
          echo "$release_json"
          node -e '
            const r = JSON.parse(process.argv[1]);
            if (r.tagName !== process.env.RELEASE_TAG) throw new Error("Unexpected release tag");
            if (r.isDraft || r.isPrerelease) throw new Error("Release must be published and stable");
            const names = new Set((r.assets || []).map(a => a.name));
            if (!names.has(process.env.RELEASE_ZIP)) throw new Error("ZIP asset missing");
            if (!names.has(process.env.RELEASE_ZIP + ".sha256")) throw new Error("SHA256 asset missing");
          ' "$release_json"

      - name: Upload canonical ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-release-v10.26.0-stable-20260822
          path: |
            app-estudos-concurso-gemini-v10.26.0-stable-20260822.zip
            app-estudos-concurso-gemini-v10.26.0-stable-20260822.zip.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Write success marker on operational branch
        shell: bash
        run: |
          set -euo pipefail
          cat > .canonical-release-success.txt <<EOF
          release_tag=$RELEASE_TAG
          source_commit=$MAIN_SHA
          zip_asset=$RELEASE_ZIP
          workflow_run_id=$GITHUB_RUN_ID
          verified=true
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .canonical-release-success.txt
          if git diff --cached --quiet; then
            echo "Success marker already present."
          else
            git commit -m "ops: mark canonical release artifact verified"
            git push origin HEAD:ops/canonical-release-10.26.0-20260822
          fi
