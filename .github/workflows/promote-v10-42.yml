name: Promote v10.42.0
"on":
  push:
    branches:
      - feat/offline-metadata-expanded-stability-v10.42.0
    paths:
      - .github/workflows/promote-v10-42.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/offline-metadata-expanded-stability-v10.42.0
          fetch-depth: 0
      - name: Promote release identity
        run: python3 tools/promote-v10-42.py
      - name: Commit promotion and remove helpers
        run: |
          git rm .github/workflows/promote-v10-42.yml tools/promote-v10-42.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(release): promote v10.42.0'
          git push origin HEAD:feat/offline-metadata-expanded-stability-v10.42.0
