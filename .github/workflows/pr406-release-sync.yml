name: PR406 Release Sync

on:
  push:
    branches:
      - feat/web-ux-flashcards-library-notes

permissions:
  contents: write

jobs:
  sync-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/web-ux-flashcards-library-notes
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm

      - name: Synchronize canonical release 10.64.44
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-version.mjs 10.64.44
          npm install --package-lock-only --ignore-scripts

          node <<'NODE'
          const fs = require('node:fs');
          const version = '10.64.44';
          const previous = '10.64.43';

          const assetsPath = 'config/app-assets.json';
          const assets = JSON.parse(fs.readFileSync(assetsPath, 'utf8'));
          assets.version = version;
          const rewriteResponsive = value => typeof value === 'string'
            ? value.replace(`responsive-polish-v${previous}.css`, `responsive-polish-v${version}.css`)
            : value;
          for (const key of ['criticalAppShell','optionalOfflineAssets','networkFirstPaths','workerNoStorePaths','headersNoStorePaths','headersRevalidatePaths']) {
            if (Array.isArray(assets[key])) assets[key] = assets[key].map(rewriteResponsive);
          }
          for (const route of ['/css/web-study-workspaces.css','/js/web-study-workspaces.js']) {
            if (!assets.optionalOfflineAssets.includes(route)) assets.optionalOfflineAssets.push(route);
          }
          fs.writeFileSync(assetsPath, JSON.stringify(assets, null, 2) + '\n');

          const replaceIn = (path, from, to) => {
            const source = fs.readFileSync(path, 'utf8');
            fs.writeFileSync(path, source.split(from).join(to));
          };

          replaceIn('public/index.html', previous, version);
          replaceIn('public/js/app-pwa.js', previous, version);
          replaceIn('public/js/ui/navigation.js', previous, version);
          replaceIn('public/sw.js', `responsive-polish-v${previous}.css`, `responsive-polish-v${version}.css`);

          let sw = fs.readFileSync('public/sw.js', 'utf8');
          const marker = "const OPTIONAL_OFFLINE_ASSETS = [";
          if (!sw.includes("'./css/web-study-workspaces.css'")) {
            sw = sw.replace(marker, `${marker}\n  './css/web-study-workspaces.css', './js/web-study-workspaces.js',`);
          }
          fs.writeFileSync('public/sw.js', sw);

          const oldCss = `public/css/responsive-polish-v${previous}.css`;
          const newCss = `public/css/responsive-polish-v${version}.css`;
          const css = fs.readFileSync(oldCss, 'utf8')
            .replace(`Release ${previous}:`, `Release ${version}:`)
            .replaceAll(`V${previous}`, `V${version}`);
          fs.writeFileSync(newCss, css);
          NODE

      - name: Verify canonical release contract
        run: |
          node scripts/release-contract.mjs check
          node scripts/audit-asset-manifest.mjs

      - name: Commit synchronized release and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr406-release-sync.yml
          git add android/app/build.gradle config/release-contract.json config/app-assets.json package.json package-lock.json public/version.json public/index.html public/sw.js public/js/app-pwa.js public/js/ui/navigation.js public/css/responsive-polish-v10.64.44.css src/index.js
          git commit -m "chore(release): synchronize PR406 as 10.64.44"
          git push origin HEAD:feat/web-ux-flashcards-library-notes
