name: Temporary Phase 8 Finalize
on:
  push:
    branches:
      - refactor/phase-8a-8b-consolidation
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/phase-8a-8b-consolidation
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
      - name: Apply Phase 8 finalization
        run: node scripts/tmp-phase8-finalize.mjs
      - name: Validate JSON and syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config/app-assets.json','utf8'))"
          node --check public/js/core/topic-assessment.js
          node --check public/js/core/study-optimization-engine.js
          node --check public/js/core/next-best-study-action.js
          node --check public/js/core/predictive-adaptive-tutor.js
      - name: Install dependencies
        run: npm ci
      - name: Release contract
        run: node scripts/release-contract.mjs check
      - name: Focused Phase 8 tests
        run: node --test tests/phase-8a-8b-consolidation.test.cjs tests/phase-6-critical-points-integration.test.cjs tests/phase-7c-7f-runtime-performance.test.cjs
      - name: Full tests
        run: npm test
      - name: Structural audit
        run: npm run audit
      - name: Remove temporary artifacts
        if: success()
        run: rm -f scripts/tmp-phase8-finalize.mjs .github/workflows/tmp-phase8-finalize.yml
      - name: Commit final branch
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(core): concluir Fases 8A e 8B — runtime headless e avaliação unificada"
          git push origin HEAD:refactor/phase-8a-8b-consolidation
