name: Temporary AI Library Hotfix
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply AI latency and Library visibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          from datetime import datetime, timezone

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'pattern not found: {label}')
              return text.replace(old, new, 1)

          p = Path('src/index.js')
          s = p.read_text()
          s = replace_once(s, 'gemini: { id: "gemini-2.5-flash", label: "Gemini 2.5 Flash", provider: "gemini" },', 'gemini: { id: "gemini-2.5-flash-lite", label: "Gemini 2.5 Flash-Lite", provider: "gemini" },', 'gemini model')
          s = replace_once(s, 'const FLASHCARD_AUTO_CHAIN = ["gemini", "gemma", "glm", "llama"];', 'const FLASHCARD_AUTO_CHAIN = ["gemini", "llama"];', 'auto chain')
          s = replace_once(s, 'const APP_VERSION = "10.25.0";', 'const APP_VERSION = "10.25.1";', 'worker version')
          s = replace_once(s, 'maxOutputTokens: 1600,', 'maxOutputTokens: 700,', 'gemini output limit')
          s = replace_once(s, 'const text = cleanText(body?.text, 12000);', 'const text = cleanText(body?.text, 7000);', 'flashcard input limit')

          old_gemini = '''async function runGeminiFlashcard(env, model, systemPrompt, userPrompt) {
  if (!env.GEMINI_API_KEY) throw new Error("GEMINI_API_KEY não configurada");
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model.id)}:generateContent`;
  const response = await fetch(endpoint, {
    method: "POST",
    headers: { "content-type": "application/json", "x-goog-api-key": env.GEMINI_API_KEY },
    body: JSON.stringify({'''
          new_gemini = '''async function runGeminiFlashcard(env, model, systemPrompt, userPrompt) {
  if (!env.GEMINI_API_KEY) throw new Error("GEMINI_API_KEY não configurada");
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model.id)}:generateContent`;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 4000);
  let response;
  try {
    response = await fetch(endpoint, {
      method: "POST",
      signal: controller.signal,
      headers: { "content-type": "application/json", "x-goog-api-key": env.GEMINI_API_KEY },
      body: JSON.stringify({'''
          s = replace_once(s, old_gemini, new_gemini, 'gemini fetch timeout start')
          old_close = '''    })
  });
  if (!response.ok) {'''
          new_close = '''      })
    });
  } catch (error) {
    if (error?.name === "AbortError") throw new Error("Gemini excedeu o limite de 4 segundos");
    throw error;
  } finally {
    clearTimeout(timeout);
  }
  if (!response.ok) {'''
          idx = s.index('async function runGeminiFlashcard')
          tail = s[idx:]
          if old_close not in tail:
              raise SystemExit('pattern not found: gemini fetch timeout close')
          tail = tail.replace(old_close, new_close, 1)
          s = s[:idx] + tail

          marker = 'async function generateFlashcard(request, env) {'
          helper = '''function withTimeout(promise, ms, label) {
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(`${label} excedeu o limite de ${ms} ms`)), ms);
  });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
}

'''
          if helper not in s:
              s = replace_once(s, marker, helper + marker, 'withTimeout helper')

          start = s.find('  const systemPrompt = `Você é um especialista sênior em aprendizagem ativa')
          end_marker = 'Retorne somente JSON válido no formato {"question":"...","answer":"..."}.`;'
          if start < 0:
              raise SystemExit('pattern not found: flashcard system prompt start')
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('pattern not found: flashcard system prompt end')
          end += len(end_marker)
          s = s[:start] + '  const systemPrompt = `Crie UM flashcard atômico para concurso usando SOMENTE o trecho-fonte. Faça pergunta autossuficiente, específica e sem pistas; preserve regra, exceções, requisitos, números, prazos e termos jurídicos essenciais. Não invente nem complemente fatos. Retorne somente JSON válido no formato {"question":"...","answer":"..."}.`;' + s[end:]

          old_workers = 'parseFlashcardAIResponse(await env.AI.run(model.id, { messages: [{ role: "system", content: systemPrompt }, { role: "user", content: userPrompt }], temperature: 0.1, max_tokens: 1600 }));'
          new_workers = 'parseFlashcardAIResponse(await withTimeout(env.AI.run(model.id, { messages: [{ role: "system", content: systemPrompt }, { role: "user", content: userPrompt }], temperature: 0.1, max_tokens: 700 }), 2500, model.label));'
          s = replace_once(s, old_workers, new_workers, 'workers fallback timeout')
          p.write_text(s)

          p = Path('public/js/pdf/pdf-reader.js')
          s = p.read_text()
          s = replace_once(s, "const FLASHCARD_AI_MODEL_OPTIONS=[['auto','Automático — Gemini + fallback'],['gemini','Gemini 2.5 Flash — melhor qualidade'],['gemma','Gemma 4 26B — equilíbrio'],['nemotron','Nemotron 3 120B — elaborado'],['glm','GLM-4.7 Flash — rápido'],['llama','Llama 3.1 8B Fast — econômico']];", "const FLASHCARD_AI_MODEL_OPTIONS=[['auto','Automático — rápido (Gemini + fallback)'],['gemini','Gemini 2.5 Flash-Lite — mais rápido'],['gemma','Gemma 4 26B — equilíbrio'],['nemotron','Nemotron 3 120B — elaborado'],['glm','GLM-4.7 Flash — rápido'],['llama','Llama 3.1 8B Fast — fallback rápido']];", 'frontend model options')
          pattern = r'async function enhanceFlashcardWithAI\(\)\{.*?\}\n\nasync function openFlashcardComposer'
          replacement = '''async function enhanceFlashcardWithAI(){if(!flashcardDraft)return;ensureFlashcardAiModelSelector();const statusEl=$('pdfFlashcardAiStatus'),button=$('pdfFlashcardAiButton'),answerEl=$('pdfFlashcardAnswer'),questionEl=$('pdfFlashcardQuestion'),model=$('pdfFlashcardAiModel')?.value||'auto';const source=String(flashcardDraft.text||answerEl?.value||'').replace(/\\s+/g,' ').trim().slice(0,5000);if(!source){if(statusEl)statusEl.textContent='Selecione um trecho no PDF ou escreva o conteúdo-base na resposta antes de gerar com IA.';answerEl?.focus();return}if(statusEl)statusEl.textContent='Gerando flashcard com IA rápida…';if(button)button.disabled=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),7500);try{const client=core().getSupabaseClient(),{data}=await client.auth.getSession(),token=data?.session?.access_token;if(!token)throw new Error('Sessão indisponível');const response=await fetch('/api/ai/flashcard',{method:'POST',signal:controller.signal,cache:'no-store',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({text:source,existingQuestion:questionEl?.value||'',model,materia:$('pdfFlashcardMateria')?.value||'',assunto:$('pdfFlashcardAssunto')?.value||''})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||`IA indisponível (HTTP ${response.status})`);if(!flashcardDraft)return;if(result.question&&questionEl)questionEl.value=result.question;if(result.answer&&answerEl)answerEl.value=result.answer;if(statusEl)statusEl.textContent=`Gerado · ${result.model||'IA'}${result.fallbackUsed?' · fallback rápido utilizado':''}. Revise antes de salvar.`}catch(e){const msg=e?.name==='AbortError'?'A geração ultrapassou 7,5 s e foi cancelada para não travar o app. Tente novamente.':(e?.message||'Falha de conexão com a IA.');if(statusEl)statusEl.textContent=`Não foi possível gerar com IA agora: ${msg} Você pode continuar criando o flashcard manualmente.`}finally{clearTimeout(timeout);if(button)button.disabled=false}}

async function openFlashcardComposer'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'frontend enhance function replacements={n}')
          p.write_text(s2)

          p = Path('public/js/pdf/pdf-library-ui.js')
          s = p.read_text()
          old_activate = "async function activateLibrary(){ensureLibraryViewToggle();applyLibraryViewMode();if(activationPromise)return activationPromise;const now=Date.now();if(now-lastActivationAt<220)return;lastActivationAt=now;activationPromise=initialize(false).finally(()=>{activationPromise=null;ensureLibraryViewToggle();applyLibraryViewMode()});return activationPromise}"
          new_activate = "function resetLibraryToGlobalView(){state.scope='global';state.activeWorkspace='';state.activeMateria='';state.activeAssunto='';state.search='';if($('pdfLibraryScope'))$('pdfLibraryScope').value='global';if($('pdfWorkspaceFilter'))$('pdfWorkspaceFilter').value='';if($('pdfMateriaFilter'))$('pdfMateriaFilter').value='';if($('pdfAssuntoFilter'))$('pdfAssuntoFilter').value='';if($('pdfLibrarySearch'))$('pdfLibrarySearch').value=''}\nasync function activateLibrary(){ensureLibraryViewToggle();applyLibraryViewMode();resetLibraryToGlobalView();if(activationPromise)return activationPromise;const now=Date.now();if(now-lastActivationAt<220){render();return}lastActivationAt=now;activationPromise=initialize(false).finally(()=>{activationPromise=null;ensureLibraryViewToggle();applyLibraryViewMode()});return activationPromise}"
          s = replace_once(s, old_activate, new_activate, 'library activation')
          p.write_text(s)

          p = Path('public/sw.js'); s = p.read_text(); s = replace_once(s, "const APP_VERSION = '10.25.0';", "const APP_VERSION = '10.25.1';", 'sw version'); p.write_text(s)
          p = Path('package.json'); data = json.loads(p.read_text()); data['version']='10.25.1'; p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          p = Path('public/version.json'); data = json.loads(p.read_text()); data['version']='10.25.1'; data['build']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z'); p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')

          p = Path('tests/v10-25-1-gemini-flashcards.test.cjs')
          s = p.read_text()
          s = s.replace('gemini-2.5-flash', 'gemini-2.5-flash-lite')
          s = s.replace('const FLASHCARD_AUTO_CHAIN = ["gemini", "gemma", "glm", "llama"]', 'const FLASHCARD_AUTO_CHAIN = ["gemini", "llama"]')
          s = s.replace('Gemini 2.5 Flash', 'Gemini 2.5 Flash-Lite')
          s = s.replace('Automático — Gemini + fallback', 'Automático — rápido (Gemini + fallback)')
          p.write_text(s)

          p = Path('tests/library-activation.test.cjs')
          s = p.read_text()
          s = s.replace("  assert.match(ui,/activationPromise=initialize\\(false\\)/);", "  assert.match(ui,/resetLibraryToGlobalView\\(\\)/);\n  assert.match(ui,/state\\.scope='global'/);\n  assert.match(ui,/activationPromise=initialize\\(false\\)/);")
          s = s.replace("test('reabrir Biblioteca no mesmo concurso preserva filtros e apenas recarrega documentos',()=>{", "test('reabrir Biblioteca sempre volta ao acervo global e recarrega documentos',()=>{")
          p.write_text(s)

          Path('tests/v10-25-1-ai-library-hotfix.test.cjs').write_text("""const test=require('node:test');\nconst assert=require('node:assert/strict');\nconst fs=require('node:fs');\nconst worker=fs.readFileSync('src/index.js','utf8');\nconst reader=fs.readFileSync('public/js/pdf/pdf-reader.js','utf8');\nconst library=fs.readFileSync('public/js/pdf/pdf-library-ui.js','utf8');\n\ntest('IA de flashcard tem caminho rápido e limites rígidos de latência',()=>{\n  assert.ok(worker.includes('gemini-2.5-flash-lite'));\n  assert.ok(worker.includes('const FLASHCARD_AUTO_CHAIN = [\\"gemini\\", \\"llama\\"]'));\n  assert.ok(worker.includes('controller.abort(), 4000'));\n  assert.ok(worker.includes('2500, model.label'));\n  assert.ok(reader.includes('controller.abort(),7500'));\n  assert.ok(reader.includes('.slice(0,5000)'));\n});\n\ntest('Biblioteca abre no escopo global sem filtros antigos',()=>{\n  assert.ok(library.includes('function resetLibraryToGlobalView()'));\n  assert.ok(library.includes(\"state.scope='global'\"));\n  assert.ok(library.includes(\"state.activeWorkspace=''\"));\n  assert.ok(library.includes('resetLibraryToGlobalView();'));\n});\n""")
          PY
      - name: Validate syntax, tests and release audit
        run: |
          node --check src/index.js
          node --check public/js/pdf/pdf-reader.js
          node --check public/js/pdf/pdf-library-ui.js
          npm test
          AUDIT_ALLOW_ANY_ROOT=1 npm run audit
      - name: Create hotfix branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH='fix/v10-25-1-ai-library-hotfix'
          git switch -c "$BRANCH"
          git add src/index.js public/js/pdf/pdf-reader.js public/js/pdf/pdf-library-ui.js public/sw.js public/version.json package.json tests/v10-25-1-gemini-flashcards.test.cjs tests/library-activation.test.cjs tests/v10-25-1-ai-library-hotfix.test.cjs
          git commit -m 'fix: accelerate flashcard AI and restore global PDF library'
          git push --force-with-lease origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title 'fix: IA rápida e Biblioteca global visível' --body 'Corrige NetworkError/latência na geração de flashcards e faz a guia Biblioteca abrir diretamente no acervo global. Inclui timeouts, fallback curto, redução de payload, testes de regressão e bump para 10.25.1.'
