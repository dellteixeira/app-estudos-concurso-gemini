name: Android Phase 2B Signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"

      - name: Materialize release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$RUNNER_TEMP/estudo-adaptativo-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical Android migration
        run: node scripts/migrate-android-phase1b.mjs

      - name: Run web unit tests
        run: npm test

      - name: Run structural audits
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

      - name: Prepare Worker-proxied vendor assets
        run: npm run android:prepare

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Verify release version
        shell: bash
        run: |
          grep -q 'versionCode 106416' android/app/build.gradle
          grep -q 'versionName "10.64.16"' android/app/build.gradle
          grep -q '"version": "10.64.16"' public/version.json

      - name: Build signed release APK only
        working-directory: android
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Locate Android build tools
        shell: bash
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Validate signed APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee android-release-signature.txt

          if find android/app/build/outputs -type f -name '*.aab' -print -quit | grep -q .; then
            echo 'AAB inesperado foi produzido; Phase 2B deve gerar somente APK.' >&2
            exit 1
          fi

          mkdir -p dist/android
          cp "$APK" "dist/android/EstudoAdaptativo-v10.64.16-release-signed.apk"
          sha256sum "dist/android/EstudoAdaptativo-v10.64.16-release-signed.apk" | tee dist/android/SHA256SUMS.txt
          cp android-release-signature.txt dist/android/android-release-signature.txt

      - name: Upload signed release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EstudoAdaptativo-v10.64.16-signed-release-apk
          path: |
            dist/android/EstudoAdaptativo-v10.64.16-release-signed.apk
            dist/android/SHA256SUMS.txt
            dist/android/android-release-signature.txt
          if-no-files-found: error
          retention-days: 30
