name: Apply UI Reader v10.24

on:
  push:
    branches:
      - feature/library-reader-layout-v10-24
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-v10-24:
    if: github.head_ref == 'feature/library-reader-layout-v10-24' || github.ref_name == 'feature/library-reader-layout-v10-24'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/library-reader-layout-v10-24
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Confirm generated version
        run: node -e "const p=require('./package.json'); if(p.version!=='10.24.0') process.exit(1); console.log('Version',p.version)"
      - name: Run tests
        run: npm test
      - name: Run audit
        run: AUDIT_ALLOW_ANY_ROOT=1 npm run audit
