name: Apply UI Reader v10.24

on:
  push:
    branches:
      - feature/library-reader-layout-v10-24
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate-test-commit:
    if: github.head_ref == 'feature/library-reader-layout-v10-24' || github.ref_name == 'feature/library-reader-layout-v10-24'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/library-reader-layout-v10-24
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration
        run: node scripts/apply-ui-reader-v10-24.mjs
      - name: Run tests
        run: npm test
      - name: Run audit
        run: AUDIT_ALLOW_ANY_ROOT=1 npm run audit
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public src package.json tests
          git commit -m "Implementar layout e anotações v10.24.0"
          git push origin HEAD:feature/library-reader-layout-v10-24
