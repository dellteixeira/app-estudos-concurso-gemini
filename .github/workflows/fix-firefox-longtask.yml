name: Fix Firefox longtask observer

on:
  push:
    branches:
      - fix/firefox-longtask-observer

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firefox-longtask-observer
          fetch-depth: 0

      - name: Apply feature detection patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('public/js/app-core.js')
          text = path.read_text(encoding='utf-8')

          old = """        if ('PerformanceObserver' in window) {
            try {
                const longTaskObserver = new PerformanceObserver(list => {
                    list.getEntries().forEach(entry => recordLocalPerformance('longtask', entry.name || 'longtask', entry.duration));
                });
                longTaskObserver.observe({ type: 'longtask', buffered: true });
            } catch (_) {}
        }
"""

          new = """        const supportsLongTaskObserver =
            'PerformanceObserver' in window &&
            Array.isArray(PerformanceObserver.supportedEntryTypes) &&
            PerformanceObserver.supportedEntryTypes.includes('longtask');

        if (supportsLongTaskObserver) {
            try {
                const longTaskObserver = new PerformanceObserver(list => {
                    list.getEntries().forEach(entry => recordLocalPerformance('longtask', entry.name || 'longtask', entry.duration));
                });
                longTaskObserver.observe({ type: 'longtask', buffered: true });
            } catch (_) {}
        }
"""

          if old not in text:
              raise SystemExit('Bloco alvo não encontrado; nenhuma alteração aplicada.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/fix-firefox-longtask.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/app-core.js .github/workflows/fix-firefox-longtask.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: detectar suporte a longtask antes de observar"
          git push origin HEAD:fix/firefox-longtask-observer
