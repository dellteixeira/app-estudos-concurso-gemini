name: Phase 3-4 Patcher

on:
  push:
    branches: [feature/core-modularization-critical-e2e]
    paths:
      - scripts/patch-phase3-phase4.mjs
      - .github/workflows/phase34-patcher.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/feature/core-modularization-critical-e2e'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/core-modularization-critical-e2e
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - run: node scripts/patch-phase3-phase4.mjs
      - name: Commit final branch state and remove temporary patcher
        run: |
          rm scripts/patch-phase3-phase4.mjs
          rm .github/workflows/phase34-patcher.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: modularize backup core and add critical e2e" || exit 0
          git push origin HEAD:feature/core-modularization-critical-e2e
