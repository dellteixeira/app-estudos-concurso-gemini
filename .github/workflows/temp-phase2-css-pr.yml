name: Temporary Phase 2 CSS Refactor PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'refactor/pdf-reader-css-phase-2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consolidar CSS legado do Reader
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cssPath = 'public/css/pdf-reader.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          if (pkg.version === '10.24.8' && !css.includes('V10.17:') && !css.includes('V10.19 —')) process.exit(0);
          const before = css.length;
          const v1017 = /\/\* V10\.17:[\s\S]*?\/\* V10\.18\.1/;
          if (!v1017.test(css)) throw new Error('Bloco V10.17 não encontrado');
          css = css.replace(v1017, `/* Reader atual — rótulo do motor; regras antigas de EmbedPDF/PDFium removidas na Fase 2. */\n.pdf-reader-engine{color:#90f3e6;font-size:.78rem;font-weight:750;letter-spacing:.02em;white-space:nowrap}\n\n/* V10.18.1`);
          const v1019 = /\/\* V10\.19 — visualizador oficial PDF\.js com interface própria\. \*\/[\s\S]*?\/\* V10\.20/;
          if (!v1019.test(css)) throw new Error('Bloco V10.19 não encontrado');
          css = css.replace(v1019, `/* Reader atual — container canônico do renderer próprio. Seletores do PDFViewer genérico removidos na Fase 2. */\n.pdf-reader-canvas-wrap{position:relative;overflow:auto!important;padding:12px!important;background:#121b25;touch-action:auto}\n\n/* V10.20`);
          const duplicateLayers = `.pdf-reader-selection-layer{z-index:1;mix-blend-mode:multiply}.pdf-reader-selection-rect{background:rgba(36,177,204,.28);box-shadow:none}.pdf-reader-mark-layer{z-index:2}.pdf-reader-text-layer{z-index:3}\n.pdf-reader-text-layer{touch-action:auto}.pdf-reader-text-layer ::selection{background:rgba(47,194,255,.38);text-shadow:none}.pdf-reader-selection-layer{z-index:1;pointer-events:none;display:none;mix-blend-mode:normal}.pdf-reader-mark-layer{z-index:2}.pdf-reader-text-layer{z-index:3}`;
          const canonicalLayers = `.pdf-reader-selection-rect{background:rgba(36,177,204,.28);box-shadow:none}.pdf-reader-selection-layer{z-index:1;pointer-events:none;display:none;mix-blend-mode:normal}.pdf-reader-mark-layer{z-index:2}.pdf-reader-text-layer{z-index:3;touch-action:auto}.pdf-reader-text-layer ::selection{background:rgba(47,194,255,.38);text-shadow:none}`;
          if (css.includes(duplicateLayers)) css = css.replace(duplicateLayers, canonicalLayers);
          if (css.includes('.pdf-reader-page-host.pdfViewer') || css.includes('.pdf-reader-native-frame')) throw new Error('CSS visual legado permaneceu');
          if (css.length >= before) throw new Error('Consolidação não reduziu o CSS');
          fs.writeFileSync(cssPath, css);
          const reps=[['package.json',/"version": "10\.24\.7"/,'"version": "10.24.8"'],['public/version.json',/"version": "10\.24\.7"/,'"version": "10.24.8"'],['public/sw.js',/const APP_VERSION = '10\.24\.7';/,"const APP_VERSION = '10.24.8';"],['src/index.js',/const APP_VERSION = "10\.24\.7";/,'const APP_VERSION = "10.24.8";']];
          for(const [f,re,v] of reps){let s=fs.readFileSync(f,'utf8');if(!re.test(s))throw new Error('Versão esperada ausente em '+f);fs.writeFileSync(f,s.replace(re,v));}
          fs.writeFileSync('tests/pdf-reader-css-phase2.test.cjs',`const test=require('node:test');const assert=require('node:assert/strict');const fs=require('node:fs');const css=fs.readFileSync('public/css/pdf-reader.css','utf8');test('Fase 2 remove CSS de renderers obsoletos e preserva renderer atual',()=>{assert.doesNotMatch(css,/pdf-reader-page-host\\.pdfViewer/);assert.doesNotMatch(css,/pdf-reader-native-frame/);assert.doesNotMatch(css,/V10\\.17:/);assert.doesNotMatch(css,/V10\\.19 —/);assert.match(css,/pdf-reader-custom-viewer/);});test('Fase 2 preserva controles e correções atuais',()=>{for(const token of ['pdf-reader-selection-bar','pdf-reader-study-actions','pdf-note-paper','pdf-export-menu','V10.24.3'])assert.ok(css.includes(token),token);});\n`);
          NODE
      - name: Testes e auditoria pós-modificação
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm test && npm run audit
      - name: Commitar refactor na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/css/pdf-reader.css package.json public/version.json public/sw.js src/index.js tests/pdf-reader-css-phase2.test.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: consolidar CSS do PDF Reader fase 2"
          git push origin HEAD:${{ github.head_ref }}
