name: Diagnose Release Audits

on:
  push:
    branches:
      - fix/ui-mobile-web-v10.64.17
    paths:
      - '.github/workflows/diagnose-release-audits.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUDIT_ALLOW_ANY_ROOT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply canonical Android migration
        run: node scripts/migrate-android-phase1b.mjs
      - name: Run unit tests
        run: npm test
      - name: Audit release
        run: node scripts/audit-release.mjs 2>&1 | tee audit-release.log
      - name: Audit CSS ownership
        if: always()
        run: node scripts/audit-css-ownership.cjs 2>&1 | tee audit-css-ownership.log
      - name: Audit asset manifest
        if: always()
        run: node scripts/audit-asset-manifest.mjs 2>&1 | tee audit-asset-manifest.log
      - name: Audit inline CSP
        if: always()
        run: node scripts/audit-inline-csp.mjs 2>&1 | tee audit-inline-csp.log
      - name: Audit toolchain pins
        if: always()
        run: node scripts/audit-toolchain-pins.mjs 2>&1 | tee audit-toolchain-pins.log
      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-audit-diagnostics
          path: audit-*.log
          if-no-files-found: warn
          retention-days: 1
