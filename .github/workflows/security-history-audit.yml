name: Security History Audit

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1'

permissions:
  contents: read

jobs:
  audit-history:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Audit current tracked files
        run: node scripts/audit-secrets.mjs

      - name: Audit complete Git history
        run: node scripts/audit-secrets-history.mjs
