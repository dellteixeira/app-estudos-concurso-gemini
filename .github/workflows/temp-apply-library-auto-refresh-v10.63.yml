name: TEMP Apply Library Auto Refresh v10.63

on:
  push:
    branches:
      - fix/library-auto-refresh-v10.63.0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/library-auto-refresh-v10.63.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Apply surgical implementation
        shell: python
        run: |
          from pathlib import Path

          def replace_bytes(path, old, new, count=None):
              p = Path(path)
              data = p.read_bytes()
              old_b = old.encode('utf-8')
              new_b = new.encode('utf-8')
              hits = data.count(old_b)
              if hits == 0:
                  raise SystemExit(f'{path}: padrão não encontrado: {old!r}')
              if count is not None and hits != count:
                  raise SystemExit(f'{path}: esperado {count} ocorrência(s), encontrado {hits}: {old!r}')
              p.write_bytes(data.replace(old_b, new_b))

          # 1) O botão manual deixa de existir, preservando CRLF/formatacão do HTML.
          index = Path('public/index.html')
          data = index.read_bytes()
          needle = b'                            <button class="btn btn-secondary" type="button" data-action="call" data-call="PdfStudyLibraryUI.refresh">\xe2\x86\xbb Atualizar</button>\r\n'
          if data.count(needle) != 1:
              raise SystemExit(f'public/index.html: botão Atualizar esperado exatamente uma vez, encontrado {data.count(needle)}')
          index.write_bytes(data.replace(needle, b''))

          # 2) Entrar na aba Biblioteca passa a acionar a atualização completa automaticamente.
          old_switch = """            if (tabId === 'tab-calendario') {\n                requestAnimationFrame(() => {\n                    renderMonthCalendar();\n                    if (options.focus !== false) scheduleTabWorkspaceFocus(tabId, options);\n                });\n            } else {\n                if (tabId === 'tab-edital') requestAnimationFrame(() => renderChart());\n                if (options.focus !== false) scheduleTabWorkspaceFocus(tabId, options);\n            }\n"""
          new_switch = """            if (tabId === 'tab-calendario') {\n                requestAnimationFrame(() => {\n                    renderMonthCalendar();\n                    if (options.focus !== false) scheduleTabWorkspaceFocus(tabId, options);\n                });\n            } else if (tabId === 'tab-biblioteca') {\n                requestAnimationFrame(() => {\n                    Promise.resolve(window.PdfStudyLibraryUI?.onTabActivated?.())\n                        .catch(error => console.warn('Atualização automática da Biblioteca falhou:', error));\n                    if (options.focus !== false) scheduleTabWorkspaceFocus(tabId, options);\n                });\n            } else {\n                if (tabId === 'tab-edital') requestAnimationFrame(() => renderChart());\n                if (options.focus !== false) scheduleTabWorkspaceFocus(tabId, options);\n            }\n"""
          replace_bytes('public/js/app-ai.js', old_switch, new_switch, 1)

          # 3) Remove a API manual que só existia para o botão excluído.
          replace_bytes('public/js/pdf/pdf-library-ui.js', "async function refreshLibrary(){state.initializedFor='';await initialize(true)}\n", '', 1)
          replace_bytes('public/js/pdf/pdf-library-ui.js', 'Object.freeze({initialize,refresh:refreshLibrary,getCurrentContest:contest,onTabActivated:activateLibrary,', 'Object.freeze({initialize,getCurrentContest:contest,onTabActivated:activateLibrary,', 1)
          replace_bytes('public/js/pdf/pdf-library-ui.js', 'Falha temporária de conexão. Seus PDFs salvos não foram apagados. Tente atualizar a Biblioteca em alguns segundos.', 'Falha temporária de conexão. Seus PDFs salvos não foram apagados. A Biblioteca será atualizada novamente ao ser aberta.', 1)

          # 4) Identidade/cache da nova versão.
          for path in ['config/app-assets.json','package.json','public/version.json','public/sw.js','src/index.js','public/js/app-pwa.js']:
              p=Path(path)
              data=p.read_bytes()
              if b'10.62.0' not in data:
                  raise SystemExit(f'{path}: versão 10.62.0 não encontrada')
              p.write_bytes(data.replace(b'10.62.0', b'10.63.0'))

          # 5) Regressão estrutural específica.
          test = r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          const read = path => fs.readFileSync(path, 'utf8');

          test('Biblioteca atualiza automaticamente ao ativar a guia e não expõe botão manual', () => {
            const index = read('public/index.html');
            const navigation = read('public/js/app-ai.js');
            const library = read('public/js/pdf/pdf-library-ui.js');

            assert.doesNotMatch(index, /PdfStudyLibraryUI\.refresh/);
            assert.doesNotMatch(index, />\s*↻\s*Atualizar\s*</);
            assert.match(navigation, /tabId === 'tab-biblioteca'/);
            assert.match(navigation, /PdfStudyLibraryUI\?\.onTabActivated\?\.\(\)/);
            assert.match(library, /onTabActivated:activateLibrary/);
            assert.doesNotMatch(library, /refresh:refreshLibrary/);
            assert.doesNotMatch(library, /function refreshLibrary/);
          });
          '''
          Path('tests/library-auto-refresh-v10.63.test.cjs').write_text(test.replace('          ', ''), encoding='utf-8')

          # Workflows temporários nunca entram no PR final.
          for temp in [
              '.github/workflows/temp-inspect-library-auto-refresh-v10.63.yml',
              '.github/workflows/temp-apply-library-auto-refresh-v10.63.yml'
          ]:
              Path(temp).unlink(missing_ok=True)
      - name: Validate before commit
        run: |
          node --check src/index.js
          node --check public/js/app-ai.js
          node --check public/js/pdf/pdf-library-ui.js
          npm test
          npm run audit
          git diff --check
          if grep -RniE 'PdfStudyLibraryUI\.refresh|↻ Atualizar' public/index.html public/js/pdf/pdf-library-ui.js; then
            echo 'Referência manual de atualização ainda presente.' >&2
            exit 1
          fi
      - name: Commit final implementation
        run: |
          git config user.name "dellteixeira"
          git config user.email "111660903+dellteixeira@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): atualizar Biblioteca automaticamente ao abrir"
          git push origin HEAD:fix/library-auto-refresh-v10.63.0
