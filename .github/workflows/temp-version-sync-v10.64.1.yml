name: Temporary Version Sync v10.64.1

on:
  push:
    branches: [release/v10.64.1-identity]
    paths:
      - '.github/workflows/temp-version-sync-v10.64.1.yml'

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v10.64.1-identity
          fetch-depth: 0

      - name: Synchronize release identity
        shell: bash
        run: |
          set -euo pipefail
          files=(
            package.json
            public/version.json
            config/app-assets.json
            public/js/app-pwa.js
            public/sw.js
            src/index.js
          )
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'package.json',
            'public/version.json',
            'config/app-assets.json',
            'public/js/app-pwa.js',
            'public/sw.js',
            'src/index.js'
          ];
          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            const count = before.split('10.64.0').length - 1;
            if (!count) throw new Error(`Identidade 10.64.0 ausente em ${file}`);
            const after = before.replaceAll('10.64.0', '10.64.1');
            fs.writeFileSync(file, after);
            console.log(`${file}: ${count} ocorrência(s) sincronizada(s)`);
          }
          NODE

          node -e "const p=require('./package.json');const v=require('./public/version.json');const a=require('./config/app-assets.json');if(p.version!=='10.64.1'||v.version!=='10.64.1'||a.version!=='10.64.1')process.exit(1)"
          grep -Fq 'const APP_VERSION = "10.64.1";' src/index.js
          grep -Fq "const APP_VERSION = '10.64.1';" public/sw.js
          if grep -Fq '10.64.0' package.json public/version.json config/app-assets.json public/js/app-pwa.js public/sw.js src/index.js; then
            echo '::error::Restou identidade 10.64.0 em contrato canônico.'
            exit 1
          fi

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-version-sync-v10.64.1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json public/version.json config/app-assets.json public/js/app-pwa.js public/sw.js src/index.js .github/workflows/temp-version-sync-v10.64.1.yml
          git commit -m 'chore(release): sincronizar identidade v10.64.1'
          git push origin HEAD:release/v10.64.1-identity
