name: Promote v10.34.0

on:
  push:
    branches:
      - feat/offline-edital-graduation-v10.34.0

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'chore(release): add one-shot v10.34.0 promotion helper'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/offline-edital-graduation-v10.34.0
          fetch-depth: 0
      - name: Synchronize release literals
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -l '10\.33\.3' -- public src config tests package.json || true)
          if ((${#files[@]})); then
            sed -i 's/10\.33\.3/10.34.0/g' "${files[@]}"
          fi
          if git grep -n '10\.33\.3' -- public src config tests package.json; then
            echo 'Residual 10.33.3 release literal found.' >&2
            exit 1
          fi
      - name: Commit promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public src config tests package.json
          if git diff --cached --quiet; then
            echo 'No promotion changes required.'
            exit 0
          fi
          git commit -m 'chore(release): synchronize v10.34.0 promotion'
          git push origin HEAD:feat/offline-edital-graduation-v10.34.0
