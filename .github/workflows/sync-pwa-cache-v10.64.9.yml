name: Sync PWA cache version v10.64.9

on:
  push:
    branches:
      - fix/release-version-v10.64.9

permissions:
  contents: write

jobs:
  sync-pwa-cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Update PWA runtime cache-busters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('public/js/app-pwa.js')
          text=path.read_text(encoding='utf-8')
          old='10.64.8'
          new='10.64.9'
          count=text.count(old)
          if count < 5:
              raise SystemExit(f'app-pwa.js: esperado >=5 ocorrências de {old}, encontrado {count}')
          path.write_text(text.replace(old,new),encoding='utf-8')
          print(f'app-pwa.js: {count} ocorrência(s) atualizada(s)')
          PY
          grep -q 'adaptive-schedule-reconciliation.js?v=10.64.9' public/js/app-pwa.js
          grep -q 'learning-advisor.css?v=10.64.9' public/js/app-pwa.js
          grep -q 'learning-advisor.js?v=10.64.9' public/js/app-pwa.js
      - name: Commit cache version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/app-pwa.js
          git diff --cached --check
          git commit -m "fix(pwa): alinhar cache-busters à v10.64.9"
          git push origin HEAD:fix/release-version-v10.64.9
