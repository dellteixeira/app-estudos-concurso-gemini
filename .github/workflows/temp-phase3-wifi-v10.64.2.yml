name: Temporary Phase 3 Wi-Fi v10.64.2
on:
  push:
    branches:
      - fix/wifi-only-semantics-v10.64.2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wifi-only-semantics-v10.64.2
          fetch-depth: 0
      - run: python scripts/temp-phase3-wifi-v10.64.2.py
      - run: |
          git diff --check
          grep -q "function connectionStatus(settings)" public/js/pdf/pdf-offline-library-manager.js
          grep -q '"version": "10.64.2"' package.json
          test ! -e scripts/temp-phase3-wifi-v10.64.2.py
          test ! -e .github/workflows/temp-phase3-wifi-v10.64.2.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(offline): explicitar limites da detecção de Wi-Fi"
          git push origin HEAD:fix/wifi-only-semantics-v10.64.2
