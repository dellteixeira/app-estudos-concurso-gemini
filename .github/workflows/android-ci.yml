name: Android Check

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.scope.outputs.android }}
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Android scopes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          files="$(git diff --name-only "$base" HEAD)"
          printf '%s\n' "$files"

          android=false
          runtime=false
          while IFS= read -r file; do
            case "$file" in
              public/*|public/**/*|android/*|android/**/*|capacitor.config.json|config/release-contract.json|package.json|package-lock.json|scripts/release-contract.mjs|scripts/prepare-android-assets.mjs|scripts/migrate-android-phase1b.mjs|scripts/apply-android-mobile-hotfix.mjs|tests/android*|tests/release-contract.test.cjs|.github/workflows/android-ci.yml|.github/workflows/android-release.yml)
                android=true
                ;;
            esac
            case "$file" in
              android/*|android/**/*|android/mobile/*|android/mobile/**/*|capacitor.config.json|scripts/migrate-android-phase1b.mjs|scripts/apply-android-mobile-hotfix.mjs|tests/android*|.github/workflows/android-ci.yml|.github/workflows/android-release.yml)
                runtime=true
                ;;
            esac
          done <<< "$files"

          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

  android-check:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve canonical release contract
        id: release_contract
        run: node scripts/release-contract.mjs github

      - name: Setup Java with Gradle cache
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: node scripts/ci-retry.mjs --attempts=3 --delay-ms=4000 npm ci

      - name: Apply canonical Android migration
        run: node scripts/migrate-android-phase1b.mjs

      - name: Prepare Worker-proxied vendor assets
        run: npm run android:prepare

      - name: Apply Android mobile UI and branding hotfix
        run: node scripts/apply-android-mobile-hotfix.mjs

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Verify Android identity after sync
        run: node scripts/release-contract.mjs check

      - name: Build debug APK
        working-directory: android
        run: node ../scripts/ci-retry.mjs --attempts=2 --delay-ms=8000 ./gradlew --no-daemon assembleDebug

      - name: Install Android emulator image
        if: needs.changes.outputs.runtime == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1)"
          AVDMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name avdmanager -perm -u+x | head -n 1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd-ci"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
          echo no | ANDROID_AVD_HOME="$ANDROID_AVD_HOME" "$AVDMANAGER" create avd --force --name android-ci --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6'
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Start Android emulator
        if: needs.changes.outputs.runtime == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          nohup emulator @android-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel auto > android-ci-emulator.log 2>&1 &
          EMULATOR_PID=$!
          timeout 120 adb wait-for-device
          kill -0 "$EMULATOR_PID"
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell input keyevent 82 || true
          adb devices

      - name: Run connected Android instrumentation tests
        if: needs.changes.outputs.runtime == 'true'
        working-directory: android
        run: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Launch debug APK and validate runtime
        if: needs.changes.outputs.runtime == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          adb install -r "$APK" >/dev/null
          adb logcat -c
          adb shell am force-stop "$APP_PACKAGE"
          adb shell monkey -p "$APP_PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 8
          PID="$(adb shell pidof "$APP_PACKAGE" | tr -d '\r')"
          test -n "$PID"
          adb shell dumpsys activity activities > android-ci-activity.txt
          grep -q "$APP_PACKAGE" android-ci-activity.txt
          adb exec-out screencap -p > android-ci-screen.png
          adb logcat -d > android-ci-logcat.txt
          if grep -A10 'FATAL EXCEPTION' android-ci-logcat.txt | grep -q "$APP_PACKAGE"; then
            echo 'Crash detectado no APK Android de validação.' >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EstudoAdaptativo-v${{ steps.release_contract.outputs.android_version_name }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android runtime diagnostics
        if: always() && needs.changes.outputs.runtime == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EstudoAdaptativo-v${{ steps.release_contract.outputs.android_version_name }}-android-ci-diagnostics
          path: |
            android-ci-emulator.log
            android-ci-activity.txt
            android-ci-logcat.txt
            android-ci-screen.png
            android/app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 7

  validate-runtime:
    name: validate-runtime
    needs: [changes, android-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify Android gate
        shell: bash
        run: |
          set -euo pipefail
          result="${{ needs.android-check.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "android-check terminou com $result" >&2
            exit 1
          fi
          echo "Android Check: $result"
