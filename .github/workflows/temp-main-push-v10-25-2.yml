name: TEMP Main Push v10.25.2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v10-25-2-smart-flashcards-mobile-library
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply functional patch
        run: python3 scripts/temp-v10-25-2-direct.py
      - name: Validate functional files
        run: |
          node --check src/index.js
          node --check public/js/pdf/pdf-reader.js
          node --check public/js/pdf/pdf-library-ui.js
          npm test
          npm run audit
      - name: Commit functional files only
        run: |
          rm -f scripts/temp-v10-25-2-direct.py .github/workflows/temp-apply-v10-25-2-functional.yml .v10-25-2-functional-trigger .v10-25-2-prtarget-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.js public/js/pdf/pdf-reader.js public/js/pdf/pdf-library-ui.js package.json public/version.json public/sw.js
          git add -u scripts/temp-v10-25-2-direct.py .github/workflows/temp-apply-v10-25-2-functional.yml .v10-25-2-functional-trigger .v10-25-2-prtarget-trigger || true
          git diff --cached --quiet && exit 0
          git commit -m "fix: smarter iterative flashcards and reliable mobile library v10.25.2"
          git push origin HEAD:fix/v10-25-2-smart-flashcards-mobile-library
