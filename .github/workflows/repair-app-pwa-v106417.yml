name: Repair stale PWA asset version refs

on:
  push:
    branches:
      - fix/ui-mobile-web-v10.64.17
    paths:
      - '.github/workflows/repair-app-pwa-v106417.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/ui-mobile-web-v10.64.17
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Repair stale canonical PWA references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('public/js/app-pwa.js')
          text = p.read_text(encoding='utf-8')
          targets = [
              './js/adaptive-schedule-reconciliation.js?v=10.64.16',
              './css/learning-advisor.css?v=10.64.16',
              './js/learning-advisor.js?v=10.64.16',
              './js/critical-points-actions.js?v=10.64.16',
          ]
          missing = [x for x in targets if x not in text]
          if missing:
              raise SystemExit(f'Expected stale refs not found: {missing}')
          text = text.replace('V10.64.16 — ativa a reconciliação', 'V10.64.17 — ativa a reconciliação')
          text = text.replace('V10.64.16 — IA consultiva', 'V10.64.17 — IA consultiva')
          for old in targets:
              text = text.replace(old, old.replace('10.64.16', '10.64.17'))
          if '10.64.16' in '\n'.join(line for line in text.splitlines() if 'adaptive-schedule-reconciliation' in line or 'learning-advisor' in line or 'critical-points-actions' in line):
              raise SystemExit('Residual stale module version found')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run complete unit suite
        run: npm test

      - name: Verify repaired references
        shell: bash
        run: |
          set -euo pipefail
          grep -F './js/adaptive-schedule-reconciliation.js?v=10.64.17' public/js/app-pwa.js
          grep -F './css/learning-advisor.css?v=10.64.17' public/js/app-pwa.js
          grep -F './js/learning-advisor.js?v=10.64.17' public/js/app-pwa.js
          grep -F './js/critical-points-actions.js?v=10.64.17' public/js/app-pwa.js
          ! grep -E '(adaptive-schedule-reconciliation|learning-advisor|critical-points-actions).*10\.64\.16' public/js/app-pwa.js

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-app-pwa-v106417.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/js/app-pwa.js .github/workflows/repair-app-pwa-v106417.yml
          git diff --cached --check
          git commit -m 'fix(pwa): align dynamic asset refs with v10.64.17'
          git push origin HEAD:fix/ui-mobile-web-v10.64.17
