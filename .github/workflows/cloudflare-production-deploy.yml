name: Cloudflare Production Verify

on:
  workflow_run:
    workflows: ["Quality Check"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-verify
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Resolve exact deployment identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="$(node -p "require('./public/version.json').version")"
          short_sha="${sha:0:12}"
          build_id="${version}+${short_sha}.${GITHUB_RUN_ID}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "Validated source identity: version=$version sha=$sha build=$build_id"

      - name: Validate release version consistency
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const publicVersion = JSON.parse(fs.readFileSync('public/version.json', 'utf8')).version;
          const worker = fs.readFileSync('src/index.js', 'utf8');
          const sw = fs.readFileSync('public/sw.js', 'utf8');
          const workerVersion = worker.match(/const APP_VERSION = "([^"]+)"/)?.[1];
          const swVersion = sw.match(/const APP_VERSION = '([^']+)'/)?.[1];
          const versions = { package: pkg, public: publicVersion, worker: workerVersion, serviceWorker: swVersion };
          if (!pkg || Object.values(versions).some(version => version !== pkg)) {
            console.error('Version mismatch before Cloudflare deployment:', versions);
            process.exit(1);
          }
          console.log(`Validated release version ${pkg}`);
          NODE

      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN não configurado"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID não configurado"; exit 1; }

      - name: Prepare exact deployment manifest
        env:
          DEPLOY_SHA: ${{ steps.identity.outputs.sha }}
          BUILD_ID: ${{ steps.identity.outputs.build_id }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const file = 'public/version.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const sha = process.env.DEPLOY_SHA;
          const buildId = process.env.BUILD_ID;
          if (!/^[0-9a-f]{40}$/.test(sha || '')) throw new Error(`DEPLOY_SHA inválido: ${sha || '(vazio)'}`);
          manifest.build = buildId;
          manifest.commit = sha;
          manifest.deployed_at = new Date().toISOString();
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE

          printf '\n// DEPLOY_COMMIT_SHA: %s\n' "$DEPLOY_SHA" >> public/sw.js
          echo "Deployment manifest:"
          cat public/version.json
          tail -n 2 public/sw.js

      - name: Deploy exact validated revision to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 deploy

      - name: Verify exact production identity
        shell: bash
        env:
          APP_URL: https://estudoadaptativo.com
          EXPECTED_SHA: ${{ steps.identity.outputs.sha }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_BUILD: ${{ steps.identity.outputs.build_id }}
        run: |
          set -euo pipefail
          expected_sha="$EXPECTED_SHA"
          expected_version="$EXPECTED_VERSION"
          expected_build="$EXPECTED_BUILD"
          echo "Expecting Cloudflare production identity:"
          echo "  version=$expected_version"
          echo "  commit=$expected_sha"
          echo "  build=$expected_build"
          echo "  url=$APP_URL"

          matched=0
          for attempt in $(seq 1 24); do
            cache_buster="${expected_sha}-${GITHUB_RUN_ID}-${attempt}"
            version_ok=0
            sw_ok=0

            if curl --fail --silent --show-error --header 'Cache-Control: no-cache, no-store' \
              "$APP_URL/version.json?verify=$cache_buster" --output /tmp/cloudflare-version.json; then
              remote_version="$(node -e "const fs=require('fs');try{process.stdout.write(String(JSON.parse(fs.readFileSync('/tmp/cloudflare-version.json','utf8')).version||''))}catch{}")"
              remote_commit="$(node -e "const fs=require('fs');try{process.stdout.write(String(JSON.parse(fs.readFileSync('/tmp/cloudflare-version.json','utf8')).commit||''))}catch{}")"
              remote_build="$(node -e "const fs=require('fs');try{process.stdout.write(String(JSON.parse(fs.readFileSync('/tmp/cloudflare-version.json','utf8')).build||''))}catch{}")"
              if [ "$remote_version" = "$expected_version" ] && [ "$remote_commit" = "$expected_sha" ] && [ "$remote_build" = "$expected_build" ]; then
                version_ok=1
              fi
            else
              remote_version="(unavailable)"
              remote_commit="(unavailable)"
              remote_build="(unavailable)"
            fi

            if curl --fail --silent --show-error --header 'Cache-Control: no-cache, no-store' \
              "$APP_URL/sw.js?verify=$cache_buster" --output /tmp/cloudflare-sw.js; then
              if grep -F "const APP_VERSION = '$expected_version';" /tmp/cloudflare-sw.js >/dev/null && \
                 grep -F "// DEPLOY_COMMIT_SHA: $expected_sha" /tmp/cloudflare-sw.js >/dev/null; then
                sw_ok=1
              fi
            fi

            echo "Verification attempt $attempt: version=$remote_version commit=$remote_commit build=$remote_build version_ok=$version_ok sw_ok=$sw_ok"
            if [ "$version_ok" -eq 1 ] && [ "$sw_ok" -eq 1 ]; then
              matched=1
              break
            fi
            sleep 5
          done

          if [ "$matched" -ne 1 ]; then
            echo "::error::Produção não convergiu version.json e sw.js para o SHA/build exatos dentro da janela de verificação"
            exit 1
          fi

          echo "Cloudflare production verified with exact source identity and matching Service Worker."

      - name: Stability re-check
        shell: bash
        env:
          APP_URL: https://estudoadaptativo.com
          EXPECTED_SHA: ${{ steps.identity.outputs.sha }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_BUILD: ${{ steps.identity.outputs.build_id }}
        run: |
          set -euo pipefail
          sleep 20
          cache_buster="${EXPECTED_SHA}-${GITHUB_RUN_ID}-stability"

          curl --fail --silent --show-error --header 'Cache-Control: no-cache, no-store' \
            "$APP_URL/version.json?stability=$cache_buster" --output /tmp/cloudflare-stability.json
          remote_version="$(node -e "const fs=require('fs');process.stdout.write(String(JSON.parse(fs.readFileSync('/tmp/cloudflare-stability.json','utf8')).version||''))")"
          remote_commit="$(node -e "const fs=require('fs');process.stdout.write(String(JSON.parse(fs.readFileSync('/tmp/cloudflare-stability.json','utf8')).commit||''))")"
          remote_build="$(node -e "const fs=require('fs');process.stdout.write(String(JSON.parse(fs.readFileSync('/tmp/cloudflare-stability.json','utf8')).build||''))")"
          if [ "$remote_version" != "$EXPECTED_VERSION" ] || [ "$remote_commit" != "$EXPECTED_SHA" ] || [ "$remote_build" != "$EXPECTED_BUILD" ]; then
            echo "::error::Produção mudou após a verificação inicial: version=$remote_version commit=$remote_commit build=$remote_build"
            exit 1
          fi

          curl --fail --silent --show-error --header 'Cache-Control: no-cache, no-store' \
            "$APP_URL/sw.js?stability=$cache_buster" --output /tmp/cloudflare-stability-sw.js
          grep -F "const APP_VERSION = '$EXPECTED_VERSION';" /tmp/cloudflare-stability-sw.js >/dev/null || {
            echo "::error::Service Worker mudou de versão após a verificação inicial"; exit 1;
          }
          grep -F "// DEPLOY_COMMIT_SHA: $EXPECTED_SHA" /tmp/cloudflare-stability-sw.js >/dev/null || {
            echo "::error::Service Worker mudou de commit após a verificação inicial"; exit 1;
          }

          echo "Stability re-check OK: version.json and sw.js remain on commit $EXPECTED_SHA"
