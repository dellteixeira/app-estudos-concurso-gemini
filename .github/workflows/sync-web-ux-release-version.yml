name: Sync Web UX Release Version

on:
  push:
    branches:
      - feat/web-ux-hoje-retencao-edital-cronograma

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/web-ux-hoje-retencao-edital-cronograma
          fetch-depth: 0

      - name: Sync release 10.64.43
        shell: bash
        run: |
          set -euo pipefail
          old='10.64.42'
          new='10.64.43'

          node <<'NODE'
          const fs = require('fs');
          const files = [
            'config/release-contract.json',
            'config/app-assets.json',
            'public/version.json',
            'public/sw.js',
            'src/index.js',
            'package.json',
            'package-lock.json',
            'public/js/ui/navigation.js',
            'android/app/build.gradle'
          ];
          for (const file of files) {
            let source = fs.readFileSync(file, 'utf8');
            source = source.replaceAll('10.64.42', '10.64.43');
            if (file === 'config/release-contract.json' || file === 'android/app/build.gradle') {
              source = source.replaceAll('106444', '106445');
            }
            fs.writeFileSync(file, source);
          }
          NODE

          cp public/css/responsive-polish-v10.64.42.css public/css/responsive-polish-v10.64.43.css
          printf '\n/* V10.64.43 — shell canônico da fase UX web; preserva o delta 10.64.42 como baseline. */\n' >> public/css/responsive-polish-v10.64.43.css

          node scripts/release-contract.mjs check
          node scripts/release-version-guard.mjs "$(git merge-base HEAD origin/main)" HEAD || true

      - name: Remove temporary workflow and commit synchronized metadata
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-web-ux-release-version.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/release-contract.json config/app-assets.json public/version.json public/sw.js src/index.js package.json package-lock.json public/js/ui/navigation.js android/app/build.gradle public/css/responsive-polish-v10.64.43.css
          git commit -m 'chore(release): sincronizar metadados web 10.64.43'
          git push origin HEAD:feat/web-ux-hoje-retencao-edital-cronograma
