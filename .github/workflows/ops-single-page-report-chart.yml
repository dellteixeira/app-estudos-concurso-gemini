name: Ops Single Page Report Chart

on:
  push:
    branches:
      - fix/report-single-page-chart-button-color

concurrency:
  group: ops-single-page-report-chart
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-single-page-chart-button-color
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused patch
        run: |
          python scripts/ops-single-page-report-chart.py
          python scripts/ops-fix-report-compat.py
      - name: Syntax check
        run: node --check public/js/study-performance-report-core.js && node --check public/js/study-performance-report.js
      - name: Focused tests
        run: node --test tests/study-performance-report-single-page.test.cjs tests/study-performance-report-polish.test.cjs
      - name: Full test suite
        run: npm test
      - name: Structural audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/study-performance-report-core.js public/js/study-performance-report.js tests/study-performance-report-single-page.test.cjs tests/study-performance-report-polish.test.cjs
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: single-page subject chart and matching export button"
          git fetch origin fix/report-single-page-chart-button-color
          git rebase origin/fix/report-single-page-chart-button-color
          git push origin HEAD:fix/report-single-page-chart-button-color
