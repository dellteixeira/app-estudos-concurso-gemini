name: Temp sync critical points v10.64.10

on:
  push:
    branches:
      - fix/critical-points-snooze

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critical-points-snooze
          fetch-depth: 0
      - name: Synchronize canonical version and assets
        shell: python
        run: |
          from pathlib import Path
          import json

          version = '10.64.10'

          src = Path('src/index.js')
          text = src.read_text(encoding='utf-8')
          old = 'const APP_VERSION = "10.64.9"'
          new = f'const APP_VERSION = "{version}"'
          if old not in text and new not in text:
              raise SystemExit('Worker APP_VERSION anchor not found')
          src.write_text(text.replace(old, new), encoding='utf-8')

          sw = Path('public/sw.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace("const APP_VERSION = '10.64.9'", f"const APP_VERSION = '{version}'")
          anchor = "'./js/adaptive-schedule-reconciliation.js', './js/learning-advisor.js', './js/app-ai.js'"
          replacement = "'./js/adaptive-schedule-reconciliation.js', './js/learning-advisor.js', './js/critical-points-actions.js', './js/app-ai.js'"
          if './js/critical-points-actions.js' not in text:
              if anchor not in text:
                  raise SystemExit('Service Worker critical shell anchor not found')
              text = text.replace(anchor, replacement)
          sw.write_text(text, encoding='utf-8')

          cfg_path = Path('config/app-assets.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['version'] = version
          asset = '/js/critical-points-actions.js'
          for key in ('criticalAppShell','networkFirstPaths','workerNoStorePaths','headersNoStorePaths'):
              values = cfg.get(key)
              if not isinstance(values, list):
                  raise SystemExit(f'Missing asset array: {key}')
              if asset not in values:
                  try:
                      idx = values.index('/js/learning-advisor.js') + 1
                  except ValueError:
                      idx = len(values)
                  values.insert(idx, asset)
          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit synchronized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js public/sw.js config/app-assets.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(release): sincronizar runtime e assets da v10.64.10"
          git push origin HEAD:fix/critical-points-snooze
