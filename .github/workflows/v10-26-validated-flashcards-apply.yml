name: V10.26 Validated Flashcards Apply

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/v10-26-validated-flashcards'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v10-26-validated-flashcards
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sanitize one-shot applicator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-v10-26-direct.mjs')
          s = p.read_text()
          marker = 'fs.writeFileSync("tests/v10-26-source-grounded-flashcards.test.cjs"'
          i = s.find(marker)
          if i < 0:
              raise SystemExit('v10.26 test-writer marker not found')
          p.write_text(s[:i] + 'console.log("v10.26.0 aplicada diretamente aos arquivos funcionais.");\n')
          PY
          node --check scripts/apply-v10-26-direct.mjs

      - name: Apply v10.26.0 functional implementation
        run: node scripts/apply-v10-26-direct.mjs

      - name: Create v10.26 regression tests
        shell: bash
        run: |
          cat > tests/v10-26-source-grounded-flashcards.test.cjs <<'TEST'
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const worker=fs.readFileSync('src/index.js','utf8');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const version=JSON.parse(fs.readFileSync('public/version.json','utf8'));
          const sw=fs.readFileSync('public/sw.js','utf8');

          test('v10.26.0 builds deterministic evidence before asking AI',()=>{
            const buildPos=worker.indexOf('const evidenceCatalog = buildFlashcardEvidenceCatalog(text)');
            const promptPos=worker.indexOf('const systemPrompt =');
            assert.ok(buildPos>0);
            assert.ok(promptPos>buildPos);
            assert.match(worker,/function classifyFlashcardKnowledge\(/);
            assert.match(worker,/knowledgeType: classifyFlashcardKnowledge\(sentence\)/);
          });

          test('v10.26.0 uses Gemini structured output with low thinking',()=>{
            assert.match(worker,/responseMimeType: "application\/json"/);
            assert.match(worker,/evidenceId: \{ type: "STRING" \}/);
            assert.match(worker,/knowledgeType: \{ type: "STRING" \}/);
            assert.match(worker,/thinkingConfig: \{ thinkingLevel: "LOW" \}/);
            assert.match(worker,/maxOutputTokens: compactRetry \? 900 : 1600/);
          });

          test('v10.26.0 validates source grounding and rejects weak questions',()=>{
            assert.match(worker,/function evidenceSupportsAnswer\(/);
            assert.match(worker,/lexicalCoverage >= 0\.72/);
            assert.match(worker,/function isGenericFlashcardQuestion\(/);
            assert.match(worker,/function flashcardQuestionSimilarity\(/);
            assert.match(worker,/reasons\.push\("answer-not-grounded"\)/);
            assert.match(worker,/reasons\.push\("duplicate-question"\)/);
            assert.match(worker,/sourceValidated: true/);
          });

          test('v10.26.0 preserves hedge and deterministic fallback',()=>{
            assert.match(worker,/const FLASHCARD_HEDGE_DELAY_MS = 4500/);
            assert.match(worker,/runFlashcardProvidersHedged/);
            assert.match(worker,/buildDeterministicFlashcard/);
            assert.match(worker,/provider: "local-deterministic"/);
          });

          test('v10.26.0 version is synchronized',()=>{
            assert.equal(pkg.version,'10.26.0');
            assert.equal(version.version,'10.26.0');
            assert.match(worker,/const APP_VERSION = "10\.26\.0"/);
            assert.match(sw,/const APP_VERSION = '10\.26\.0'/);
          });
          TEST

      - name: Check critical syntax
        run: node --check src/index.js

      - name: Run automated tests
        run: node --test tests/*.test.cjs

      - name: Run structural audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: node scripts/audit-release.mjs

      - name: Commit only the validated functional tree
        shell: bash
        run: |
          rm -f scripts/apply-v10-26-direct.mjs
          rm -f .github/workflows/v10-26-validated-flashcards-apply.yml
          rm -f v10-26-trigger.txt

          cat > .github/workflows/quality-check.yml <<'YAML'
          name: Quality Check

          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            test-and-audit:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Testes automatizados
                  run: node --test tests/*.test.cjs
                - name: Auditoria estrutural
                  env:
                    AUDIT_ALLOW_ANY_ROOT: '1'
                  run: node scripts/audit-release.mjs
          YAML

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No validated changes to commit.'
            exit 0
          fi
          git commit -m 'feat: source-grounded validated flashcards v10.26.0'
          git push origin HEAD:feat/v10-26-validated-flashcards
