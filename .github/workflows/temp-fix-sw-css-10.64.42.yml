name: Temp Fix SW CSS 10.64.42

on:
  push:
    branches: [fix/mobile-retention-centering]

permissions:
  contents: write

jobs:
  fix-sw-css:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/mobile-retention-centering
          fetch-depth: 0

      - name: Fix service worker responsive CSS reference
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/sw.js';
          const before = fs.readFileSync(path, 'utf8');
          const after = before.replaceAll('responsive-polish-v10.64.41.css', 'responsive-polish-v10.64.42.css');
          if (after !== before) fs.writeFileSync(path, after);
          NODE
          node scripts/release-contract.mjs check

      - name: Commit service worker fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Service worker já sincronizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/sw.js
          git commit -m 'chore(release): sincronizar CSS do service worker 10.64.42'
          git push origin HEAD:fix/mobile-retention-centering
