name: Temp critical actions single row

on:
  push:
    branches:
      - fix/critical-actions-single-row-v10.64.12

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/critical-actions-single-row-v10.64.12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Apply v10.64.12 UI patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const updateJson=(file)=>{const data=JSON.parse(fs.readFileSync(file,'utf8'));data.version='10.64.12';fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n')};
          updateJson('package.json');
          updateJson('public/version.json');
          updateJson('config/app-assets.json');

          const replaceRequired=(file,from,to)=>{
            const source=fs.readFileSync(file,'utf8');
            if(!source.includes(from)) throw new Error(`${file}: token not found: ${from}`);
            fs.writeFileSync(file,source.split(from).join(to));
          };
          replaceRequired('src/index.js','const APP_VERSION = "10.64.11"','const APP_VERSION = "10.64.12"');
          replaceRequired('public/sw.js',"const APP_VERSION = '10.64.11'","const APP_VERSION = '10.64.12'");
          replaceRequired('public/js/app-pwa.js','10.64.11','10.64.12');

          const cssFile='public/css/learning-advisor.css';
          let css=fs.readFileSync(cssFile,'utf8');
          const marker='/* V10.64.12 — Pontos críticos: três ações na mesma linha. */';
          if(!css.includes(marker)){
            css += `\n${marker}\n.critical-point-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:center}.critical-point-controls button{width:100%;min-width:0;min-height:38px;padding:7px 6px;font-size:clamp(.66rem,.7rem + .08vw,.74rem);white-space:nowrap;overflow-wrap:normal}.critical-point-note{grid-column:1/-1}.critical-point-ai{grid-column:auto}\n@media(max-width:700px){.critical-point-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.critical-point-controls button{width:100%;min-width:0;min-height:40px;padding:7px 5px;font-size:.68rem;white-space:nowrap;overflow-wrap:normal}.critical-point-ai{grid-column:auto}.critical-point-note{grid-column:1/-1}}\n@media(max-width:380px){.critical-point-controls{gap:5px}.critical-point-controls button{padding:6px 3px;font-size:.64rem}}\n`;
            fs.writeFileSync(cssFile,css);
          }

          const legacyTest='tests/learning-diagnosis-ai-v10.64.11.test.cjs';
          if(fs.existsSync(legacyTest)){
            let test=fs.readFileSync(legacyTest,'utf8');
            test=test.replaceAll("'10.64.11'","'10.64.12'");
            fs.writeFileSync(legacyTest,test);
          }

          const testFile='tests/critical-actions-single-row-v10.64.12.test.cjs';
          fs.writeFileSync(testFile,`const test=require('node:test');\nconst assert=require('node:assert/strict');\nconst fs=require('node:fs');\nconst css=fs.readFileSync('public/css/learning-advisor.css','utf8');\nconst pkg=JSON.parse(fs.readFileSync('package.json','utf8'));\ntest('pontos críticos mantêm três ações na mesma linha',()=>{\n  assert.match(css,/grid-template-columns:repeat\\(3,minmax\\(0,1fr\\)\\)/);\n  assert.match(css,/\\.critical-point-ai\\{grid-column:auto\\}/);\n  assert.match(css,/white-space:nowrap/);\n  assert.match(css,/@media\\(max-width:700px\\)[\\s\\S]*repeat\\(3,minmax\\(0,1fr\\)\\)/);\n});\ntest('release do ajuste visual é 10.64.12',()=>assert.equal(pkg.version,'10.64.12'));\n`);
          NODE
          rm -f .github/workflows/temp-critical-actions-row.yml
          node --check public/js/learning-advisor.js
          node --check public/js/critical-points-actions.js
          npm test
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): alinhar ações dos pontos críticos em uma linha'
          git push origin HEAD:fix/critical-actions-single-row-v10.64.12
