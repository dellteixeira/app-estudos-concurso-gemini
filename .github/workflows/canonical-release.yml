name: Canonical GitHub Release

on:
  workflow_run:
    workflows: ["Cloudflare Production Verify"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-github-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout production-verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Resolve canonical release contract
        id: release_contract
        run: node scripts/release-contract.mjs github

      - name: Validate release candidate identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-contract.mjs check
          sha="$(git rev-parse HEAD)"
          version="$WEB_VERSION"
          tag="$RELEASE_TAG"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            expected_sha="${{ github.event.workflow_run.head_sha }}"
            if [ "$sha" != "$expected_sha" ]; then
              echo "::error::Checkout não corresponde ao SHA verificado em produção: expected=$expected_sha actual=$sha"
              exit 1
            fi
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Production release candidate: tag=$tag version=$version deployed_sha=$sha"

      - name: Verify manual release matches live production
        if: github.event_name == 'workflow_dispatch'
        env:
          APP_URL: https://estudoadaptativo.com
          EXPECTED_SHA: ${{ steps.identity.outputs.sha }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for attempt in 1 2 3 4 5 6; do
            cache_buster="${EXPECTED_SHA}-${GITHUB_RUN_ID}-${attempt}"
            if curl --fail --silent --show-error --header 'Cache-Control: no-cache, no-store' \
              "$APP_URL/version.json?canonical-release=$cache_buster" --output /tmp/live-version.json; then
              live_version="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/live-version.json','utf8'));process.stdout.write(String(d.version||''))")"
              live_commit="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/live-version.json','utf8'));process.stdout.write(String(d.commit||''))")"
              if [ "$live_version" = "$EXPECTED_VERSION" ] && [ "$live_commit" = "$EXPECTED_SHA" ]; then
                matched=1
                break
              fi
              echo "Manual release parity attempt $attempt: live_version=$live_version live_commit=$live_commit"
            fi
            sleep 5
          done
          if [ "$matched" -ne 1 ]; then
            echo "::error::Release manual bloqueada: HEAD não corresponde à revisão atualmente publicada em produção."
            exit 1
          fi
          echo "Manual release parity OK: production commit=$EXPECTED_SHA version=$EXPECTED_VERSION"

      - name: Resolve immutable canonical tag
        id: canonical_tag
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_SHA: ${{ steps.identity.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"

            if [ "$tag_sha" = "$RELEASE_SHA" ]; then
              echo "mode=canonical" >> "$GITHUB_OUTPUT"
              echo "Tag $RELEASE_TAG já existe e aponta para o SHA canônico."
              exit 0
            fi

            web_runtime_paths=(package.json public src wrangler.jsonc config)
            web_runtime_excludes=(':(exclude)config/release-contract.json')
            if git diff --quiet "$RELEASE_TAG" "$RELEASE_SHA" -- "${web_runtime_paths[@]}" "${web_runtime_excludes[@]}"; then
              echo "mode=operational-rollback" >> "$GITHUB_OUTPUT"
              echo "::notice::Runtime web idêntico ao da tag $RELEASE_TAG. A tag permanece imutável em $tag_sha; diferenças Android/operacionais no SHA $RELEASE_SHA são permitidas."
              exit 0
            fi

            echo "::error::A tag $RELEASE_TAG já existe em $tag_sha e o runtime web do SHA $RELEASE_SHA é diferente. A tag não será movida. Incremente a versão web antes de publicar outra release."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Estudo Adaptativo Inteligente $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "mode=created" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Tag canônica criada: $RELEASE_TAG -> $RELEASE_SHA"

      - name: Publish canonical GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_SHA: ${{ steps.identity.outputs.sha }}
          CANONICAL_TAG_SHA: ${{ steps.canonical_tag.outputs.tag_sha }}
          RELEASE_MODE: ${{ steps.canonical_tag.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG já existe; mantendo a release histórica imutável."
            echo "  mode=$RELEASE_MODE"
            echo "  canonical_tag_sha=$CANONICAL_TAG_SHA"
            echo "  deployed_sha=$RELEASE_SHA"
            gh release view "$RELEASE_TAG" --json url,tagName,isDraft,isPrerelease,targetCommitish
            exit 0
          fi

          if [ "$RELEASE_MODE" = "operational-rollback" ]; then
            echo "::error::Tag histórica existente sem GitHub Release associada. A criação automática foi bloqueada para preservar a identidade canônica."
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Estudo Adaptativo Inteligente $RELEASE_TAG" \
            --generate-notes \
            --latest

          release_url="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
          echo "Canonical GitHub Release published: $release_url"
          echo "  version=$RELEASE_VERSION"
          echo "  tag=$RELEASE_TAG"
          echo "  sha=$RELEASE_SHA"
