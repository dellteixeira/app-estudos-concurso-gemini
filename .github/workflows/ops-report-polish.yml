name: Ops Report Visual Polish

on:
  push:
    branches:
      - fix/report-visual-alignment-polish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-visual-alignment-polish
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused report patch
        run: python scripts/ops-polish-study-report.py
      - name: Syntax checks
        run: |
          node --check public/js/study-performance-report-core.js
          node --check public/js/study-performance-report.js
      - name: Focused regression tests
        run: node --test tests/study-performance-report-polish.test.cjs
      - name: Full automated tests
        run: npm test
      - name: Structural audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/study-performance-report-core.js public/js/study-performance-report.js tests/study-performance-report-polish.test.cjs
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: alinhar legenda e modernizar relatório de desempenho"
          git push origin HEAD:fix/report-visual-alignment-polish
