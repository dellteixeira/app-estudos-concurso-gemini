name: TEMP Run Library Auto Refresh v10.63

on:
  push:
    branches:
      - fix/library-auto-refresh-v10.63.0-clean

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/library-auto-refresh-v10.63.0-clean
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Apply
        run: node scripts/temp-apply-library-auto-refresh-v10.63.mjs
      - name: Remove temporary files
        run: rm scripts/temp-apply-library-auto-refresh-v10.63.mjs .github/workflows/temp-run-library-auto-refresh-v10.63.yml
      - name: Validate
        run: |
          node --check src/index.js
          node --check public/js/app-ai.js
          node --check public/js/pdf/pdf-library-ui.js
          npm test
          npm run audit
          git diff --check
          test "$(grep -c 'PdfStudyLibraryUI.refresh' public/index.html || true)" -eq 0
          test "$(grep -c '↻ Atualizar' public/index.html || true)" -eq 0
      - name: Commit
        run: |
          git config user.name "dellteixeira"
          git config user.email "111660903+dellteixeira@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): atualizar Biblioteca automaticamente ao abrir"
          git push origin HEAD:fix/library-auto-refresh-v10.63.0-clean
