name: Temporary Pinch Zoom v10.24.11
on:
  push:
    branches: [feature/mobile-pinch-zoom-v10-24-11]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[pinch-zoom-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-pinch-zoom-v10-24-11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply pinch zoom
        run: python3 scripts/apply_mobile_pinch_zoom_v10_24_11.py
      - name: Align legacy gesture test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/pdf-reader.test.cjs')
          s=p.read_text(encoding='utf-8')
          old="test('Reader mobile usa gestos padrão sem assistente concorrente',()=>{const r=read('public/js/pdf/pdf-reader.js'),c=read('public/css/pdf-reader.css');assert.doesNotMatch(r,/beginPinch|movePinch|touchstart/);assert.match(c,/touch-action:auto/);assert.match(c,/overflow:auto!important/);});"
          new="test('Reader mobile usa Pointer Events para pinch sem assistente touch legado',()=>{const r=read('public/js/pdf/pdf-reader.js'),c=read('public/css/pdf-reader.css');assert.match(r,/beginPinch/);assert.match(r,/pointerdown/);assert.match(r,/pointermove/);assert.doesNotMatch(r,/touchstart|touchmove/);assert.match(c,/touch-action:pan-x pan-y!important/);assert.match(c,/overflow:auto!important/);});"
          if old not in s:
              raise SystemExit('legacy gesture test anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: |
          npm test
          npm run audit
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add mobile pinch zoom to Library PDF [pinch-zoom-applied]" || exit 0
          git push origin HEAD:feature/mobile-pinch-zoom-v10-24-11
