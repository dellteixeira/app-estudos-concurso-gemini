name: Diagnose v10.64.9 tests

on:
  push:
    branches:
      - fix/release-version-v10.64.9

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@1e60f620b9541d8f06c77b986c4c7b8b0a5fbbad
        with:
          node-version: '22.23.2'
      - name: Capture npm test output
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          code=$?
          echo "$code" > test-exit-code.txt
          cat test-output.txt
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: v10.64.9-test-diagnostic
          path: |
            test-output.txt
            test-exit-code.txt
          retention-days: 1
