name: Apply Canonical Version Bump

on:
  push:
    branches: [release/canonical-v10.26.1]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release/canonical-v10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Apply canonical version bump
        run: node scripts/apply-canonical-version-bump.mjs

      - name: Commit version bump when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Version already canonical; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/version.json src/index.js public/sw.js
          git commit -m "release: bump version to 10.26.1"
          git push origin HEAD:release/canonical-v10.26.1
