name: Temp Fix Index CSS 10.64.42

on:
  push:
    branches: [fix/mobile-retention-centering]

permissions:
  contents: write

jobs:
  fix-index-css:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/mobile-retention-centering
          fetch-depth: 0

      - name: Fix index responsive CSS reference
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/index.html';
          const before = fs.readFileSync(path, 'utf8');
          const from = 'responsive-polish-v10.64.41.css';
          const to = 'responsive-polish-v10.64.42.css';
          if (!before.includes(from)) throw new Error(`Referência esperada ausente em ${path}: ${from}`);
          const after = before.replaceAll(from, to);
          fs.writeFileSync(path, after);
          NODE
          node scripts/release-contract.mjs check

      - name: Commit index fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Index já sincronizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'chore(release): carregar CSS web 10.64.42'
          git push origin HEAD:fix/mobile-retention-centering
