name: Temp Fix Lock Integrity

on:
  push:
    branches: [fix/mobile-retention-centering]

permissions:
  contents: write

jobs:
  fix-lock-integrity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/mobile-retention-centering
          fetch-depth: 0

      - name: Restore main dependency integrities
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          let text = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              'sha512-0JZ1Zkp3wURnv8oq6Qt7fMPo5MpjbLoUoa9Bu2Q4PJuSDWMTh8gwF3dQO7VTeUj3/0o1IB1wGkFWZZYgUXZMUg==',
              'sha512-0JZ1Zkp3wURnv8oq6Qt7fMPo5MpjbLoUoa9Bu2Q4PJuSDWM8H8gwF3dQO7VTeUj3/0o1IB1wGkFWZZYgUXZMUg=='
            ],
            [
              'sha512-Jqkgyq7zBs/vJ3VktQQiIcxfJyplPgECMWgdO0E1fKrrH8EF0QGHNJ9mJCn6PYe2UtHNS8JJf5G21e09DfYg==',
              'sha512-Jqkgyq7zBs/v/J3YvKtQQiIcxfJyplPgECMWgdO0E1fKrrH8EF0QGHNJ9mJCn6PYe2UtHNS8JJf5G21e09DfYg=='
            ]
          ];
          for (const [from, to] of replacements) {
            if (!text.includes(from)) throw new Error(`integrity esperado ausente: ${from}`);
            text = text.replace(from, to);
          }
          fs.writeFileSync(path, text);
          NODE

      - name: Verify lock diff and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff -- package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(release): preservar integridades do lockfile'
          git push origin HEAD:fix/mobile-retention-centering
