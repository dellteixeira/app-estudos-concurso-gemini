name: OPS Repair Videoaula Migration

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/ops-repair-videoaula-migration.yml'

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'fix/unique-videoaula-migration-version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate current material state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_DB_URL"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -Atc "select case when exists (select 1 from information_schema.columns where table_schema='public' and table_name='edital' and column_name='videoaula' and data_type='boolean' and is_nullable='NO') then 'VIDEOAULA_PRESENT' else 'VIDEOAULA_MISSING' end;" | grep -qx VIDEOAULA_PRESENT

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Repair only the migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration repair 20260816120000 --status applied --password "$SUPABASE_DB_PASSWORD"

      - name: Verify history and schema state
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -P pager=off -A -F '|' -c "select version,name from supabase_migrations.schema_migrations where version in ('20260816','20260816120000') order by version;"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -Atc "select case when exists (select 1 from information_schema.columns where table_schema='public' and table_name='edital' and column_name='videoaula' and data_type='boolean' and is_nullable='NO') then 'VIDEOAULA_PRESENT' else 'VIDEOAULA_MISSING' end;"

      - name: Dry-run after repair
        shell: bash
        run: |
          set +e
          supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee /tmp/dry-run.txt
          status=${PIPESTATUS[0]}
          grep -q '20260816_add_videoaula_to_edital.sql' /tmp/dry-run.txt && exit 1 || true
          grep -q '20260816120000_add_videoaula_to_edital.sql' /tmp/dry-run.txt && exit 1 || true
          grep -q '20260819090000_harden_pdf_reader_rls.sql' /tmp/dry-run.txt || true
          exit 0
