name: Temporary Phase 9 Version Promote

on:
  push:
    branches:
      - fix/offline-backend-integrity-v10.64.8
    paths:
      - '.github/workflows/temp-phase9-version-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offline-backend-integrity-v10.64.8
          fetch-depth: 0
      - name: Promote canonical identity
        shell: bash
        run: |
          set -euo pipefail
          files=(package.json config/app-assets.json public/version.json public/sw.js src/index.js public/js/app-pwa.js)
          perl -pi -e 's/10\.64\.7/10.64.8/g' "${files[@]}"
          test "$(node -p "require('./package.json').version")" = "10.64.8"
          grep -q '10.64.8' config/app-assets.json
          grep -q '10.64.8' public/version.json
          grep -q '10.64.8' public/sw.js
          grep -q '10.64.8' src/index.js
          ! grep -q '10\.64\.7' public/js/app-pwa.js
          rm .github/workflows/temp-phase9-version-promote.yml
          git diff --check
      - name: Validate automated suite
        run: npm test
      - name: Commit clean release identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json config/app-assets.json public/version.json public/sw.js src/index.js public/js/app-pwa.js .github/workflows/temp-phase9-version-promote.yml
          git commit -m 'chore(release): promover Fase 9 para v10.64.8'
          git push origin HEAD:fix/offline-backend-integrity-v10.64.8
