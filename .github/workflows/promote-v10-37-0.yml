name: Promote v10.37.0

on:
  push:
    branches:
      - feat/offline-metadata-graduation-v10.37.0
    paths:
      - .github/workflows/promote-v10-37-0.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/offline-metadata-graduation-v10.37.0
          fetch-depth: 0

      - name: Promote all release literals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          skip_dirs = {'.git', 'node_modules', 'playwright-report', 'test-results'}
          replacements = (
              ('10.36.0', '10.37.0'),
              (r'10\.36\.0', r'10\.37\.0'),
              ('10-36-0', '10-37-0'),
          )

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  raw = path.read_bytes()
              except OSError:
                  continue
              if b'\x00' in raw:
                  continue
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Arquivos promovidos:')
          for item in changed:
              print(item)
          if not changed:
              raise SystemExit('Nenhum literal 10.36.0 encontrado para promoção.')
          PY

          test "$(node -p "require('./package.json').version")" = "10.37.0"
          test "$(node -p "require('./public/version.json').version")" = "10.37.0"
          test "$(node -p "require('./config/app-assets.json').version")" = "10.37.0"
          grep -Fq "const APP_VERSION = '10.37.0';" public/sw.js
          grep -Fq "offline-sync-metadata-graduation.js?v=10.37.0" public/js/app-state.js

      - name: Commit coordinated promotion and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/promote-v10-37-0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): promote v10.37.0"
          git push origin HEAD:feat/offline-metadata-graduation-v10.37.0
