name: Android Phase 2C Signed APK Runtime

on:
  push:
    branches:
      - feat/android-phase2a-release-apk-v10.64.16
    paths:
      - '.github/workflows/android-phase2c-signed-apk-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"

      - name: Materialize release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$RUNNER_TEMP/estudo-adaptativo-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical Android migration
        run: node scripts/migrate-android-phase1b.mjs

      - name: Run web unit tests
        run: npm test

      - name: Run structural audits
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

      - name: Prepare Worker-proxied vendor assets
        run: npm run android:prepare

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Verify release version
        shell: bash
        run: |
          grep -q 'versionCode 106416' android/app/build.gradle
          grep -q 'versionName "10.64.16"' android/app/build.gradle
          grep -q '"version": "10.64.16"' public/version.json

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Locate Android SDK tools
        shell: bash
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1)"
          AVDMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name avdmanager -perm -u+x | head -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          test -x "$APKSIGNER"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Verify APK signature
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee android-phase2c-signature.txt

      - name: Install Android emulator image
        shell: bash
        run: |
          ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd-phase2c"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | ANDROID_AVD_HOME="$ANDROID_AVD_HOME" "$AVDMANAGER" create avd --force --name phase2c --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6'
          test -f "$ANDROID_AVD_HOME/phase2c.ini"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Start Android emulator
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          emulator -list-avds | grep -Fxq phase2c
          nohup emulator @phase2c -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel auto > android-phase2c-emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "EMULATOR_PID=$EMULATOR_PID" >> "$GITHUB_ENV"
          timeout 120 adb wait-for-device
          kill -0 "$EMULATOR_PID"
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell input keyevent 82 || true
          adb devices

      - name: Install and launch signed APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          adb install -r "$APK" | tee android-phase2c-install.txt
          adb logcat -c
          adb shell am force-stop com.estudoadaptativo.app
          adb shell monkey -p com.estudoadaptativo.app -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 10
          PID="$(adb shell pidof com.estudoadaptativo.app | tr -d '\r')"
          test -n "$PID"
          echo "ANDROID_APP_PID=$PID" >> "$GITHUB_ENV"
          adb shell dumpsys activity activities > android-phase2c-activity.txt
          grep -q 'com.estudoadaptativo.app' android-phase2c-activity.txt
          adb exec-out screencap -p > android-phase2c-launch.png
          adb logcat -d > android-phase2c-launch-logcat.txt
          if grep -A10 'FATAL EXCEPTION' android-phase2c-launch-logcat.txt | grep -q 'com.estudoadaptativo.app'; then
            echo 'Crash detectado no lançamento do APK assinado.' >&2
            exit 1
          fi

      - name: Validate background and resume
        shell: bash
        run: |
          adb shell input keyevent 3
          sleep 3
          adb shell monkey -p com.estudoadaptativo.app -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 8
          PID="$(adb shell pidof com.estudoadaptativo.app | tr -d '\r')"
          test -n "$PID"
          adb exec-out screencap -p > android-phase2c-resume.png
          adb logcat -d > android-phase2c-resume-logcat.txt
          if grep -A10 'FATAL EXCEPTION' android-phase2c-resume-logcat.txt | grep -q 'com.estudoadaptativo.app'; then
            echo 'Crash detectado após retorno do background.' >&2
            exit 1
          fi

      - name: Validate packaged API and Supabase integration markers
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          unzip -l "$APK" | grep -q 'assets/public/index.html'
          unzip -l "$APK" | grep -q 'assets/public/capacitor-runtime.js'
          unzip -l "$APK" | grep -q 'assets/public/js/app-pwa.js'
          unzip -l "$APK" | grep -q 'assets/public/vendor/supabase.js'
          unzip -p "$APK" assets/public/index.html | grep -q 'capacitor-runtime.js'

      - name: Collect runtime diagnostics
        if: always()
        shell: bash
        run: |
          adb shell dumpsys package com.estudoadaptativo.app > android-phase2c-package.txt 2>/dev/null || true
          adb shell dumpsys meminfo com.estudoadaptativo.app > android-phase2c-meminfo.txt 2>/dev/null || true
          adb logcat -d > android-phase2c-final-logcat.txt 2>/dev/null || true

      - name: Upload Phase 2C diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EstudoAdaptativo-v10.64.16-phase2c-runtime-diagnostics
          path: |
            android-phase2c-signature.txt
            android-phase2c-emulator.log
            android-phase2c-install.txt
            android-phase2c-activity.txt
            android-phase2c-launch.png
            android-phase2c-launch-logcat.txt
            android-phase2c-resume.png
            android-phase2c-resume-logcat.txt
            android-phase2c-package.txt
            android-phase2c-meminfo.txt
            android-phase2c-final-logcat.txt
          if-no-files-found: warn
          retention-days: 30
