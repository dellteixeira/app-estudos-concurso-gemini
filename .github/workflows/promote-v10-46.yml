name: Promote v10.46.0

on:
  push:
    paths:
      - '.github/workflows/promote-v10-46.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'

      - name: Promote release identity in workspace
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          explicit = [Path('package.json'), Path('config/app-assets.json'), Path('public/version.json'), Path('src/index.js'), Path('public/js/app-pwa.js'), Path('public/js/app-state.js'), Path('public/sw.js')]
          targets = explicit + sorted(Path('tests').glob('*.test.cjs'))
          for path in targets:
              text = path.read_text()
              path.write_text(text.replace('v10.45.0','v10.46.0').replace('10.45.0','10.46.0').replace('10-45-0','10-46-0'))
          PY

      - name: Test learning-advisor
        run: node --test tests/learning-advisor.test.cjs
      - name: Test library-action-alignment
        if: always()
        run: node --test tests/library-action-alignment.test.cjs
      - name: Test library-activation
        if: always()
        run: node --test tests/library-activation.test.cjs
      - name: Test library-desktop-single-row-layout
        if: always()
        run: node --test tests/library-desktop-single-row-layout.test.cjs
      - name: Test library-reader-v10-24
        if: always()
        run: node --test tests/library-reader-v10-24.test.cjs
      - name: Test offline-outbox-store
        if: always()
        run: node --test tests/offline-outbox-store.test.cjs
      - name: Test offline-pdf-library-phase2
        if: always()
        run: node --test tests/offline-pdf-library-phase2.test.cjs
      - name: Test offline-pdf-library-phase3
        if: always()
        run: node --test tests/offline-pdf-library-phase3.test.cjs
      - name: Test offline-pdf-library-phase4
        if: always()
        run: node --test tests/offline-pdf-library-phase4.test.cjs
      - name: Test offline-pdf-store
        if: always()
        run: node --test tests/offline-pdf-store.test.cjs
      - name: Test offline-sync-authority
        if: always()
        run: node --test tests/offline-sync-authority.test.cjs
      - name: Test offline-sync-delete-authority
        if: always()
        run: node --test tests/offline-sync-delete-authority.test.cjs
      - name: Test offline-sync-edital-graduation
        if: always()
        run: node --test tests/offline-sync-edital-graduation.test.cjs
      - name: Test offline-sync-metadata-authority
        if: always()
        run: node --test tests/offline-sync-metadata-authority.test.cjs
      - name: Test offline-sync-metadata-expanded-promotion
        if: always()
        run: node --test tests/offline-sync-metadata-expanded-promotion.test.cjs
      - name: Test offline-sync-metadata-expanded-stability
        if: always()
        run: node --test tests/offline-sync-metadata-expanded-stability.test.cjs
      - name: Test offline-sync-metadata-expansion
        if: always()
        run: node --test tests/offline-sync-metadata-expansion.test.cjs
      - name: Test offline-sync-metadata-graduation
        if: always()
        run: node --test tests/offline-sync-metadata-graduation.test.cjs
      - name: Test offline-sync-metadata-promoted-stability
        if: always()
        run: node --test tests/offline-sync-metadata-promoted-stability.test.cjs
      - name: Test offline-sync-metadata-rollout
        if: always()
        run: node --test tests/offline-sync-metadata-rollout.test.cjs
      - name: Test offline-sync-metadata-shadow
        if: always()
        run: node --test tests/offline-sync-metadata-shadow.test.cjs
      - name: Test offline-sync-metadata-stability
        if: always()
        run: node --test tests/offline-sync-metadata-stability.test.cjs
      - name: Test offline-sync-offline-core
        if: always()
        run: node --test tests/offline-sync-offline-core.test.cjs
      - name: Test offline-sync-shadow
        if: always()
        run: node --test tests/offline-sync-shadow.test.cjs
      - name: Diagnostic complete
        if: always()
        run: exit 0
