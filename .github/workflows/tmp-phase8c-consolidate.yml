name: Temporary Phase 8C Consolidation
on:
  push:
    branches:
      - refactor/phase-8c-consolidation
permissions:
  contents: write
jobs:
  consolidate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/phase-8c-consolidation
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
      - name: Apply Phase 8C physical graduation
        run: |
          node scripts/tmp-phase8c-patch-runner.mjs
          node scripts/tmp-phase8c-consolidate.mjs
          node scripts/tmp-phase8c-fix-tests.mjs
          node scripts/tmp-phase8c-sync-surfaces.mjs
      - name: Validate JSON and syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config/app-assets.json','utf8'))"
          node --check public/js/core/topic-assessment.js
          node --check public/js/core/study-optimization-engine.js
          node --check public/js/core/next-best-study-action.js
          node --check public/js/core/predictive-adaptive-tutor.js
          node --check tests/phase-8c-consolidation.test.cjs
      - name: Install dependencies
        run: npm ci
      - name: Release contract
        run: node scripts/release-contract.mjs check
      - name: Focused Phase 8C tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/phase-8c-consolidation.test.cjs tests/phase-8a-8b-consolidation.test.cjs tests/phase-6a-domain-risk-dashboard.test.cjs tests/phase-6b-study-optimization-dashboard.test.cjs tests/phase-6-critical-points-integration.test.cjs 2>&1 | tee phase8c-focused.log
      - name: Full tests
        run: npm test
      - name: Structural audit
        shell: bash
        run: |
          set -o pipefail
          npm run audit 2>&1 | tee phase8c-audit.log
      - name: Persist diagnostics on failure
        if: failure()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phase8c-focused.log phase8c-audit.log
          git diff --cached --quiet || git commit -m "chore(tmp): capture Phase 8C validation failure"
          git push origin HEAD:refactor/phase-8c-consolidation
      - name: Remove temporary artifacts
        if: success()
        run: rm -f scripts/tmp-phase8c-consolidate.mjs scripts/tmp-phase8c-fix-tests.mjs scripts/tmp-phase8c-patch-runner.mjs scripts/tmp-phase8c-sync-surfaces.mjs .github/workflows/tmp-phase8c-consolidate.yml phase8c-focused.log phase8c-audit.log
      - name: Commit Phase 8C
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(core): concluir Fase 8C — graduar assets legados"
          git push origin HEAD:refactor/phase-8c-consolidation
