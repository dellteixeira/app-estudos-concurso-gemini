name: Temp critical buttons nowrap v10.64.13

on:
  push:
    branches:
      - fix/critical-buttons-nowrap-v10.64.13

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/critical-buttons-nowrap-v10.64.13
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Apply v10.64.13 nowrap fix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');

          const replaceRequired=(file,from,to)=>{
            const source=fs.readFileSync(file,'utf8');
            if(!source.includes(from)) throw new Error(`${file}: token not found: ${from}`);
            fs.writeFileSync(file,source.split(from).join(to));
          };

          const updateJson=(file)=>{
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            data.version='10.64.13';
            fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
          };

          updateJson('package.json');
          updateJson('public/version.json');
          updateJson('config/app-assets.json');
          replaceRequired('src/index.js','const APP_VERSION = "10.64.12"','const APP_VERSION = "10.64.13"');
          replaceRequired('public/sw.js',"const APP_VERSION = '10.64.12'","const APP_VERSION = '10.64.13'");
          replaceRequired('public/js/app-pwa.js','10.64.12','10.64.13');

          const cssFile='public/css/learning-advisor.css';
          let css=fs.readFileSync(cssFile,'utf8');
          const marker='/* V10.64.13 — Pontos críticos: rótulos dos três botões sem quebra. */';
          if(!css.includes(marker)){
            css += `\n${marker}\n.critical-point-controls{grid-template-columns:minmax(0,1.15fr) minmax(0,1.12fr) minmax(0,.88fr)}\n.critical-point-controls button{white-space:nowrap!important;overflow-wrap:normal!important;word-break:keep-all!important;hyphens:none!important;letter-spacing:0;text-align:center}\n@media(max-width:700px){.critical-point-controls{grid-template-columns:minmax(0,1.15fr) minmax(0,1.12fr) minmax(0,.88fr)}.critical-point-controls button{font-size:clamp(.62rem,2.7vw,.68rem);padding-inline:4px;white-space:nowrap!important;overflow-wrap:normal!important;word-break:keep-all!important}}\n@media(max-width:360px){.critical-point-controls{gap:4px}.critical-point-controls button{font-size:.6rem;padding-inline:2px}}\n`;
            fs.writeFileSync(cssFile,css);
          }

          const oldTest='tests/critical-actions-single-row-v10.64.12.test.cjs';
          let oldSource=fs.readFileSync(oldTest,'utf8');
          const exact="test('release do ajuste visual é 10.64.12',()=>assert.equal(pkg.version,'10.64.12'));";
          const future="test('release do ajuste visual permanece na linha canônica 10.64.x',()=>assert.match(pkg.version,/^10\\.64\\.\\d+$/));";
          if(!oldSource.includes(exact)) throw new Error('teste legado de v10.64.12 não encontrado');
          oldSource=oldSource.replace(exact,future);
          fs.writeFileSync(oldTest,oldSource);

          const diagnosisTest='tests/learning-diagnosis-ai-v10.64.11.test.cjs';
          let diagnosisSource=fs.readFileSync(diagnosisTest,'utf8');
          const diagnosisExact="test('versão e assets permanecem sincronizados',()=>{assert.equal(JSON.parse(fs.readFileSync(path.join(root,'package.json'),'utf8')).version,'10.64.12');assert.equal(assets.version,'10.64.12');for(const route of ['/js/learning-advisor.js','/js/critical-points-actions.js']){assert.ok(assets.criticalAppShell.includes(route));assert.ok(assets.networkFirstPaths.includes(route));assert.ok(assets.workerNoStorePaths.includes(route))}});";
          const diagnosisFuture="test('versão e assets permanecem sincronizados',()=>{const packageVersion=JSON.parse(fs.readFileSync(path.join(root,'package.json'),'utf8')).version;assert.match(packageVersion,/^10\\.64\\.\\d+$/);assert.equal(assets.version,packageVersion);for(const route of ['/js/learning-advisor.js','/js/critical-points-actions.js']){assert.ok(assets.criticalAppShell.includes(route));assert.ok(assets.networkFirstPaths.includes(route));assert.ok(assets.workerNoStorePaths.includes(route))}});";
          if(!diagnosisSource.includes(diagnosisExact)) throw new Error('teste de diagnóstico com versão fixa não encontrado');
          diagnosisSource=diagnosisSource.replace(diagnosisExact,diagnosisFuture);
          fs.writeFileSync(diagnosisTest,diagnosisSource);

          const testFile='tests/critical-buttons-nowrap-v10.64.13.test.cjs';
          fs.writeFileSync(testFile,`const test=require('node:test');\nconst assert=require('node:assert/strict');\nconst fs=require('node:fs');\nconst css=fs.readFileSync('public/css/learning-advisor.css','utf8');\nconst pkg=JSON.parse(fs.readFileSync('package.json','utf8'));\n\ntest('botões de pontos críticos não quebram seus rótulos',()=>{\n  assert.match(css,/\\.critical-point-controls button\\{[^}]*white-space:nowrap!important[^}]*overflow-wrap:normal!important[^}]*word-break:keep-all!important/s);\n  assert.match(css,/grid-template-columns:minmax\\(0,1\\.15fr\\) minmax\\(0,1\\.12fr\\) minmax\\(0,\\.88fr\\)/);\n});\n\ntest('correção é promovida para 10.64.13',()=>{\n  assert.equal(pkg.version,'10.64.13');\n});\n`);
          NODE

          rm -f .github/workflows/temp-critical-nowrap-v10.64.13.yml
          node --check public/js/critical-points-actions.js
          npm test
          node scripts/audit-css-ownership.cjs
          node scripts/audit-asset-manifest.mjs
          node scripts/audit-inline-csp.mjs
          node scripts/audit-toolchain-pins.mjs
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): impedir quebra dos rótulos nos pontos críticos'
          git push origin HEAD:fix/critical-buttons-nowrap-v10.64.13
