name: Phase 4M Integrate Temp

on:
  push:
    branches:
      - feat/offline-metadata-promoted-stability-v10.44.0

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/offline-metadata-promoted-stability-v10.44.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Integrate Phase 4M
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function patch(file, before, after, expected=1){
            const source=fs.readFileSync(file,'utf8');
            const count=source.split(before).length-1;
            if(count!==expected) throw new Error(`${file}: expected ${expected} occurrence(s), found ${count}`);
            fs.writeFileSync(file,source.replace(before,after));
          }

          const appState='public/js/app-state.js';
          patch(appState,
`        if (!global.OfflineSyncMetadataExpandedPromotion) await loadExtensionScript('./js/core/offline-sync-metadata-expanded-promotion.js?v=10.43.0', 'offline-sync-metadata-expanded-promotion');
        global.OfflineSyncMetadataExpandedPromotion?.install?.();
        if (!global.OfflineSyncMetadataExpansion)`,
`        if (!global.OfflineSyncMetadataExpandedPromotion) await loadExtensionScript('./js/core/offline-sync-metadata-expanded-promotion.js?v=10.43.0', 'offline-sync-metadata-expanded-promotion');
        global.OfflineSyncMetadataExpandedPromotion?.install?.();
        if (!global.OfflineSyncMetadataPromotedStability) await loadExtensionScript('./js/core/offline-sync-metadata-promoted-stability.js?v=10.43.0', 'offline-sync-metadata-promoted-stability');
        global.OfflineSyncMetadataPromotedStability?.install?.();
        if (!global.OfflineSyncMetadataExpansion)`);
          patch(appState,
`            metadataExpandedPromotion:global.OfflineSyncMetadataExpandedPromotion?.getDiagnostics?.() || null,
            metadataExpansion:`,
`            metadataExpandedPromotion:global.OfflineSyncMetadataExpandedPromotion?.getDiagnostics?.() || null,
            metadataPromotedStability:global.OfflineSyncMetadataPromotedStability?.getDiagnostics?.() || null,
            metadataExpansion:`);
          patch(appState,
`        getOfflineSyncMetadataExpandedPromotionDiagnostics:() => global.OfflineSyncMetadataExpandedPromotion?.getDiagnostics?.() || null,
        getOfflineSyncMetadataExpansionDiagnostics:`,
`        getOfflineSyncMetadataExpandedPromotionDiagnostics:() => global.OfflineSyncMetadataExpandedPromotion?.getDiagnostics?.() || null,
        getOfflineSyncMetadataPromotedStabilityDiagnostics:() => global.OfflineSyncMetadataPromotedStability?.getDiagnostics?.() || null,
        getOfflineSyncMetadataExpansionDiagnostics:`);

          const manifest='config/app-assets.json';
          const oldAsset='"/js/core/offline-sync-metadata-expanded-promotion.js", "/js/core/offline-sync-metadata-expansion.js"';
          const newAsset='"/js/core/offline-sync-metadata-expanded-promotion.js", "/js/core/offline-sync-metadata-promoted-stability.js", "/js/core/offline-sync-metadata-expansion.js"';
          patch(manifest,oldAsset,newAsset,4);

          const sw='public/sw.js';
          const oldSw="'./js/core/offline-sync-metadata-expanded-promotion.js', './js/core/offline-sync-metadata-expansion.js'";
          const newSw="'./js/core/offline-sync-metadata-expanded-promotion.js', './js/core/offline-sync-metadata-promoted-stability.js', './js/core/offline-sync-metadata-expansion.js'";
          patch(sw,oldSw,newSw,1);
          const oldSwPath="'/js/core/offline-sync-metadata-expanded-promotion.js', '/js/core/offline-sync-metadata-expansion.js'";
          const newSwPath="'/js/core/offline-sync-metadata-expanded-promotion.js', '/js/core/offline-sync-metadata-promoted-stability.js', '/js/core/offline-sync-metadata-expansion.js'";
          patch(sw,oldSwPath,newSwPath,1);

          patch('src/worker.js',
`  '/js/core/offline-sync-metadata-expanded-promotion.js',
  '/js/core/offline-sync-metadata-expansion.js',`,
`  '/js/core/offline-sync-metadata-expanded-promotion.js',
  '/js/core/offline-sync-metadata-promoted-stability.js',
  '/js/core/offline-sync-metadata-expansion.js',`);

          patch('public/_headers',
`/js/core/offline-sync-metadata-expanded-promotion.js
  Cache-Control: no-cache, no-store, must-revalidate

/js/core/offline-sync-metadata-expansion.js`,
`/js/core/offline-sync-metadata-expanded-promotion.js
  Cache-Control: no-cache, no-store, must-revalidate

/js/core/offline-sync-metadata-promoted-stability.js
  Cache-Control: no-cache, no-store, must-revalidate

/js/core/offline-sync-metadata-expansion.js`);
          NODE

      - name: Syntax checks
        run: |
          node --check public/js/core/offline-sync-metadata-promoted-stability.js
          node --check public/js/app-state.js
          node --check public/sw.js
          node --check src/worker.js

      - name: Automated tests
        run: npm test

      - name: Structural audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/js/app-state.js config/app-assets.json public/sw.js src/worker.js public/_headers
          git commit -m 'feat(sync): integrate phase 4M diagnostics'
          git push origin HEAD:feat/offline-metadata-promoted-stability-v10.44.0
