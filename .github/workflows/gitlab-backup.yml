name: GitLab Backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup repository to GitLab
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Create bare clone from canonical GitHub repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --bare \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            backup.git

      - name: Push backup to GitLab
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$(printf '%s:%s' "$GITLAB_USERNAME" "$GITLAB_TOKEN" | base64 -w0)"
          git -C backup.git \
            -c http.extraHeader="Authorization: Basic ${AUTH}" \
            push --mirror \
            "https://gitlab.com/dellteixeira-group/app-estudos-concurso-gemini.git"
