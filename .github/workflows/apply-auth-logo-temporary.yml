name: Apply Auth Logo Temporary

on:
  push:
    branches: [auth/login-logo-branding]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[auth-logo-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth/login-logo-branding
          fetch-depth: 0

      - name: Apply auth branding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('public/index.html')
          data = index.read_bytes()
          if b'id="authBrandLogo"' not in data:
              for nl in (b'\r\n', b'\n'):
                  needle = b'        <div class="auth-card">' + nl + b'            <h2>Entrar no Sistema</h2>'
                  if needle in data:
                      repl = (
                          b'        <div class="auth-card">' + nl +
                          b'            <div id="authBrandLogo" class="auth-brand-logo" aria-hidden="true">' + nl +
                          b'                <img src="./icon-192.png" alt="" width="82" height="82">' + nl +
                          b'            </div>' + nl +
                          b'            <h2>Entrar no Sistema</h2>'
                      )
                      data = data.replace(needle, repl, 1)
                      break
              else:
                  raise SystemExit('Auth card anchor not found in public/index.html')
              index.write_bytes(data)

          css = Path('public/css/base.css')
          text = css.read_text(encoding='utf-8')
          if '.auth-brand-logo {' not in text:
              anchor = '        .auth-card h2 { margin-bottom: 1.5rem; color: var(--primary-blue); }\n'
              if anchor not in text:
                  raise SystemExit('Auth CSS anchor not found in public/css/base.css')
              styles = '''        .auth-brand-logo { display:flex; justify-content:center; align-items:center; width:100%; margin:0 auto 1rem; }\n        .auth-brand-logo img { display:block; width:82px; height:82px; object-fit:contain; border-radius:50%; filter:drop-shadow(0 6px 16px rgba(0,0,0,.28)); }\n        @media (max-width:700px) {\n            .auth-card { padding:2rem 1.5rem; }\n            .auth-brand-logo { margin-bottom:.85rem; }\n            .auth-brand-logo img { width:68px; height:68px; }\n        }\n'''
              text = text.replace(anchor, anchor + styles, 1)
              css.write_text(text, encoding='utf-8')

          test = Path('tests/auth-login-branding.test.cjs')
          test.write_text(r'''const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const test = require('node:test');

          const html = fs.readFileSync(path.join(__dirname, '..', 'public', 'index.html'), 'utf8');
          const css = fs.readFileSync(path.join(__dirname, '..', 'public', 'css', 'base.css'), 'utf8');

          test('tela de autenticação exibe logo centralizada e responsiva', () => {
            assert.match(html, /id="authBrandLogo"/);
            assert.match(html, /src="\.\/icon-192\.png"/);
            assert.match(css, /\.auth-brand-logo\s*\{[^}]*justify-content:center/);
            assert.match(css, /\.auth-brand-logo img\s*\{[^}]*width:82px;[^}]*height:82px/);
            assert.match(css, /@media \(max-width:700px\)[\s\S]*\.auth-brand-logo img\s*\{[^}]*width:68px;[^}]*height:68px/);
          });
          '''.replace('          ', ''), encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/apply-auth-logo-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/css/base.css tests/auth-login-branding.test.cjs
          git commit -m "Centralizar logo na tela inicial [auth-logo-applied]"
          git push origin HEAD:auth/login-logo-branding
