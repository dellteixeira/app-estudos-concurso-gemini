name: Temp learning diagnosis v10.64.11

on:
  push:
    branches:
      - feat/learning-diagnosis-ai-v10.64.11

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/learning-diagnosis-ai-v10.64.11
          fetch-depth: 0
      - name: Apply controlled patch
        run: python .github/scripts/patch-learning-diagnosis-v10.64.11.py
      - name: Validate syntax and focused tests
        run: |
          node --check src/index.js
          node --check public/js/learning-advisor.js
          node --check public/js/critical-points-actions.js
          node --test tests/learning-diagnosis-ai-v10.64.11.test.cjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/version.json config/app-assets.json public/sw.js src/index.js public/js/app-pwa.js public/js/learning-advisor.js public/js/critical-points-actions.js public/css/learning-advisor.css tests/learning-diagnosis-ai-v10.64.11.test.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(ai): concluir diagnóstico de aprendizagem v10.64.11"
          git push origin HEAD:feat/learning-diagnosis-ai-v10.64.11
