name: Temp learning diagnosis edge fix v10.64.11

on:
  push:
    branches:
      - feat/learning-diagnosis-ai-v10.64.11

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/learning-diagnosis-ai-v10.64.11
          fetch-depth: 0
      - name: Preserve explicit topic candidate
        run: >-
          python -c "from pathlib import Path; p=Path('public/js/learning-advisor.js'); t=p.read_text(encoding='utf-8'); old=\"if(options.topicId)candidates=candidates.filter(item=>item.topicId===options.topicId);\"; new=\"if(options.topicId){candidates=candidates.filter(item=>item.topicId===options.topicId);if(!candidates.length)candidates=currentCandidates.filter(item=>item.topicId===options.topicId)}\"; assert old in t; p.write_text(t.replace(old,new,1),encoding='utf-8')"
      - name: Validate
        run: |
          node --check public/js/learning-advisor.js
          node --test tests/learning-diagnosis-ai-v10.64.11.test.cjs
      - name: Commit edge fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/learning-advisor.js
          git commit -m "fix(ai): preservar diagnóstico individual fora do limiar"
          git push origin HEAD:feat/learning-diagnosis-ai-v10.64.11
