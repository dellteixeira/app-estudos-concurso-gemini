.critical-point-ai{border:1px solid rgba(121,242,192,.48);background:rgba(40,190,142,.11);color:#8cf5c9}.critical-point-ai:hover{background:rgba(40,190,142,.2)}
.learning-advisor-manual{display:flex;align-items:end;flex-wrap:wrap;gap:9px;margin-top:10px;padding:10px;border:1px dashed rgba(121,242,192,.24);border-radius:10px;background:rgba(24,92,73,.08)}.learning-advisor-manual label{display:grid;gap:5px;flex:1 1 260px;color:#a9bdca;font-size:.75rem}.learning-advisor-manual select{width:100%;min-height:42px;padding:7px 9px;border:1px solid rgba(115,151,178,.42);border-radius:9px;background:#0b2234;color:#e8f4f7}.learning-advisor-manual .btn{min-height:42px}
@media(max-width:700px){.critical-point-controls{grid-template-columns:1fr 1fr}.critical-point-ai{grid-column:1/-1}.learning-advisor-manual{display:grid}.learning-advisor-manual .btn{width:100%}}
"""
          if 'V10.64.11 — IA acionável' not in text:
              text += addition
          write(path,text)

          # Tests
          test_path=Path('tests/learning-diagnosis-ai-v10.64.11.test.cjs')
          test_path.write_text(r'''const test=require('node:test');
const assert=require('node:assert/strict');
const fs=require('node:fs');
const path=require('node:path');
const root=path.resolve(__dirname,'..');
const worker=fs.readFileSync(path.join(root,'src/index.js'),'utf8');
const advisor=fs.readFileSync(path.join(root,'public/js/learning-advisor.js'),'utf8');
const critical=fs.readFileSync(path.join(root,'public/js/critical-points-actions.js'),'utf8');
const css=fs.readFileSync(path.join(root,'public/css/learning-advisor.css'),'utf8');
const assets=JSON.parse(fs.readFileSync(path.join(root,'config/app-assets.json'),'utf8'));

test('backend expõe diagnóstico de aprendizagem autenticado com fallback local',()=>{
  assert.match(worker,/async function learningDiagnosis\(request, env\)/);
  assert.match(worker,/\/api\/ai\/learning-diagnosis/);
  assert.match(worker,/authenticateSupabaseUser\(request, env\)/);
  assert.match(worker,/localLearningIntervention/);
  assert.match(worker,/aiUsed: false, provider: "local"/);
});
test('advisor possui fallback local real e análise de um único tópico',()=>{
  assert.match(advisor,/function localIntervention\(candidate\)/);
  assert.match(advisor,/function analyzeTopic\(topicId,rowIndex=null\)/);
  assert.match(advisor,/const payload=localPayload\(candidates/);
  assert.match(advisor,/data-learning-action="manual-method"/);
  assert.match(advisor,/Método escolhido manualmente pelo estudante/);
});
test('ponto crítico oferece Consultar IA sem remover estudo ou adiamento',()=>{
  assert.match(critical,/ai\.textContent='Consultar IA'/);
  assert.match(critical,/AppLearningAdvisor\.analyzeTopic/);
  assert.match(critical,/study\.textContent='Estudar agora'/);
  assert.match(critical,/snoozeButton\.textContent='Adiar 24h'/);
  assert.match(css,/\.critical-point-ai/);
});
test('versão e assets permanecem sincronizados',()=>{
  assert.equal(JSON.parse(fs.readFileSync(path.join(root,'package.json'),'utf8')).version,'10.64.11');
  assert.equal(assets.version,'10.64.11');
  for(const route of ['/js/learning-advisor.js','/js/critical-points-actions.js']){
    assert.ok(assets.criticalAppShell.includes(route));
    assert.ok(assets.networkFirstPaths.includes(route));
    assert.ok(assets.workerNoStorePaths.includes(route));
  }
});
''',encoding='utf-8')
      - name: Validate syntax
        run: |
          node --check src/index.js
          node --check public/js/learning-advisor.js
          node --check public/js/critical-points-actions.js
          node --test tests/learning-diagnosis-ai-v10.64.11.test.cjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/version.json config/app-assets.json public/sw.js src/index.js public/js/app-pwa.js public/js/learning-advisor.js public/js/critical-points-actions.js public/css/learning-advisor.css tests/learning-diagnosis-ai-v10.64.11.test.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(ai): concluir diagnóstico de aprendizagem v10.64.11"
          git push origin HEAD:feat/learning-diagnosis-ai-v10.64.11
