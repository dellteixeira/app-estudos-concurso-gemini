name: Temporary Phase 4 Version Fix

on:
  push:
    branches:
      - fix/offline-init-diagnostics-v10.64.3
    paths:
      - .github/workflows/temp-phase4-version-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offline-init-diagnostics-v10.64.3
      - name: Apply version fix and cleanup
        run: python3 scripts/apply-phase4-version-fix.py
      - name: Validate full automated suite
        run: |
          node --check public/js/app-pwa.js
          npm test
          git diff --check
      - name: Commit clean functional result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): alinhar assets PWA à v10.64.3"
          git push origin HEAD:fix/offline-init-diagnostics-v10.64.3
