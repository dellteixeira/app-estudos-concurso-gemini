name: Diagnose v10.40.0 Concurrency

on:
  push:
    branches:
      - feat/offline-metadata-expansion-v10.40.0
    paths:
      - .github/workflows/diagnose-v10-40-concurrency.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/offline-metadata-expansion-v10.40.0
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'

      - name: Current aggregate command
        continue-on-error: true
        run: node --test tests/*.test.cjs

      - name: Serial aggregate command
        run: node --test --test-concurrency=1 tests/*.test.cjs

      - name: Remove diagnostic workflow
        run: rm .github/workflows/diagnose-v10-40-concurrency.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): remove concurrency diagnostic workflow"
          git push origin HEAD:feat/offline-metadata-expansion-v10.40.0
