name: Trigger AI Library Hotfix
on:
  issue_comment:
    types: [created]
permissions:
  actions: write
  contents: read
  pull-requests: read
jobs:
  dispatch:
    if: github.event.issue.number == 73 && github.event.comment.body == '/run-ai-library-hotfix' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch hotfix workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run temp-gemini-migrator.yml --repo '${{ github.repository }}' --ref main
