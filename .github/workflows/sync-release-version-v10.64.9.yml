name: Sync release version v10.64.9

on:
  push:
    branches:
      - fix/release-version-v10.64.9

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Synchronize canonical version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old='10.64.8'
          new='10.64.9'
          files=[Path('package.json'),Path('public/version.json'),Path('src/index.js'),Path('public/sw.js'),Path('config/app-assets.json')]
          for path in files:
              text=path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: versão {old} não encontrada')
              path.write_text(text.replace(old,new),encoding='utf-8')
          PY

      - name: Validate synchronized version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          public_version="$(node -p "require('./public/version.json').version")"
          asset_version="$(node -p "require('./config/app-assets.json').version")"
          worker_version="$(node -e "const fs=require('fs');const m=fs.readFileSync('src/index.js','utf8').match(/const APP_VERSION = \"([^\"]+)\"/);process.stdout.write(m?.[1]||'')")"
          sw_version="$(node -e "const fs=require('fs');const m=fs.readFileSync('public/sw.js','utf8').match(/const APP_VERSION = '([^']+)'/);process.stdout.write(m?.[1]||'')")"
          test "$version" = "10.64.9"
          test "$public_version" = "$version"
          test "$asset_version" = "$version"
          test "$worker_version" = "$version"
          test "$sw_version" = "$version"

      - name: Commit synchronized release version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/version.json src/index.js public/sw.js config/app-assets.json
          git diff --cached --check
          git commit -m "chore(release): bump canonical version to v10.64.9"
          git push origin HEAD:fix/release-version-v10.64.9
