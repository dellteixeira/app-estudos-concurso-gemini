          index_path.write_text(index)

          advisor_path=Path('public/js/learning-advisor.js')
          advisor=advisor_path.read_text()
          advisor=replace_once(advisor,"  }).filter(Boolean).filter(item=>item.frictionScore>=MIN_FRICTION)","  }).filter(Boolean).filter(item=>!global.AppCriticalReviewMemory?.isSnoozed?.(item.topicId)).filter(item=>item.frictionScore>=MIN_FRICTION)",'advisor snooze candidates')
          advisor=replace_once(advisor,"  }).filter(Boolean).sort((a,b)=>b.riskScore-a.riskScore||a.retention-b.retention);","  }).filter(Boolean).filter(entry=>!global.AppCriticalReviewMemory?.isSnoozed?.(entry?.row?.state?.key)).sort((a,b)=>b.riskScore-a.riskScore||a.retention-b.retention);",'advisor snooze risk rows')
          old_request="async function requestAdvice(candidates){\n  const token=await authToken();"
          new_request="async function requestAdvice(candidates,options={}){\n  const token=await authToken();"
          advisor=replace_once(advisor,old_request,new_request,'advisor request signature')
          old_body="body:JSON.stringify({contest:getContestName(),topics:candidates.map(({topicId,materia,assunto,prioridade,assuntoPrioridade,frictionScore,metrics})=>({topicId,materia,assunto,prioridade,assuntoPrioridade,frictionScore,metrics}))})"
          new_body="body:JSON.stringify({contest:getContestName(),mode:options.mode||'general',topics:candidates.map(candidate=>({topicId:candidate.topicId,materia:candidate.materia,assunto:candidate.assunto,prioridade:candidate.prioridade,assuntoPrioridade:candidate.assuntoPrioridade,frictionScore:candidate.frictionScore,metrics:candidate.metrics,history:candidate.history||null}))})"
          advisor=replace_once(advisor,old_body,new_body,'advisor request body')
          marker="async function analyze(options={}){"
          layered_method=r'''async function recommendLayeredReview(input={}){
  const candidate=input?.candidate;
  if(!candidate?.topicId)return null;
  const history=input?.history||{};
  const payload=await requestAdvice([{...candidate,history}],{mode:'layered_review'});
  const intervention=Array.isArray(payload?.interventions)?payload.interventions.find(item=>item?.topicId===candidate.topicId):null;
  return intervention?{...intervention,aiUsed:Boolean(payload?.aiUsed),provider:payload?.provider||'unknown'}:null;
}

'''
          advisor=replace_once(advisor,marker,layered_method+marker,'advisor layered method')
          advisor=replace_once(advisor,"global.AppLearningAdvisor=Object.freeze({VERSION,computeLearningFriction,collectCandidates,getRiskRows,openRiskView,analyze,refresh,close:closeDialog,getDiagnostics:diagnostics});","global.AppLearningAdvisor=Object.freeze({VERSION,computeLearningFriction,collectCandidates,getRiskRows,openRiskView,analyze,recommendLayeredReview,refresh,close:closeDialog,getDiagnostics:diagnostics});",'advisor export')
          advisor_path.write_text(advisor)

          server_path=Path('src/learning-diagnosis.js')
          server=server_path.read_text()
          server=replace_once(server,"const ACTIONS=new Set(['active_recall','short_review','questions','focused_restudy','flashcards','compare_map','law_reading']);","const ACTIONS=new Set(['active_recall','short_review','questions','focused_restudy','flashcards','compare_map','law_reading']);\nconst LAYER_ACTIONS=new Set(['active_recall','short_review','questions','focused_restudy']);",'server layer actions')
          old_sanitize="      acquired:Boolean(m.acquired)\n    }\n  };"
          new_sanitize="      acquired:Boolean(m.acquired)\n    },\n    history:{\n      recentRecommendedLayers:(Array.isArray(raw?.history?.recentRecommendedLayers)?raw.history.recentRecommendedLayers:[]).map(Number).filter(layer=>layer>=1&&layer<=4).slice(0,4),\n      recentStartedLayers:(Array.isArray(raw?.history?.recentStartedLayers)?raw.history.recentStartedLayers:[]).map(Number).filter(layer=>layer>=1&&layer<=4).slice(0,4),\n      lastRecommendedAt:clamp(raw?.history?.lastRecommendedAt,0,Date.now()),\n      lastStartedAt:clamp(raw?.history?.lastStartedAt,0,Date.now())\n    }\n  };"
          server=replace_once(server,old_sanitize,new_sanitize,'server history sanitize')

          old_det_end="  const severity=topic.frictionScore>=70?'high':topic.frictionScore>=50?'medium':'low';\n  return {topicId:topic.topicId,diagnosisType,severity,recommendedAction,suggestedMinutes:minutes,method,rationale:`Fricção ${Math.round(topic.frictionScore)}/100; retenção ${Math.round(m.retention)}%${m.accuracy==null?'':`; questões ${Math.round(m.accuracy)}%`}. A recomendação é consultiva e deve ser validada pelo motor local.`};"
          new_det_end="  const severity=topic.frictionScore>=70?'high':topic.frictionScore>=50?'medium':'low';\n  const layerByAction={active_recall:1,short_review:2,questions:3,focused_restudy:4};\n  const actionByLayer={1:'active_recall',2:'short_review',3:'questions',4:'focused_restudy'};\n  const recent=topic?.history?.recentRecommendedLayers||[];\n  const currentLayer=layerByAction[recommendedAction];\n  const severe=m.forgot||m.retention<38||(m.accuracy!=null&&m.confidence>=.25&&m.accuracy<42);\n  if(currentLayer&&recent[0]===currentLayer&&!severe){\n    const alternate=m.acquired&&(m.accuracy==null||m.accuracy<75)?3:(m.retention>=62?1:4);\n    recommendedAction=actionByLayer[alternate];\n    method=alternate===3?'Resolva questões curtas e comentadas para testar a aplicação.':alternate===1?'Faça recuperação mental sem consulta e confira somente as lacunas.':'Reconstrua o ponto central e teste a recuperação logo depois.';\n    minutes=alternate===3?20:alternate===1?8:30;\n  }\n  return {topicId:topic.topicId,diagnosisType,severity,recommendedAction,suggestedMinutes:minutes,method,rationale:`Fricção ${Math.round(topic.frictionScore)}/100; retenção ${Math.round(m.retention)}%${m.accuracy==null?'':`; questões ${Math.round(m.accuracy)}%`}. O histórico recente de métodos também foi considerado para evitar repetição mecânica.`};"
          server=replace_once(server,old_det_end,new_det_end,'server deterministic anti repeat')

          server=replace_once(server,"function validateIntervention(raw,topic){","function validateIntervention(raw,topic,mode='general'){")
          server=replace_once(server,"    recommendedAction:ACTIONS.has(raw.recommendedAction)?raw.recommendedAction:fallback.recommendedAction,","    recommendedAction:(mode==='layered_review'?LAYER_ACTIONS:ACTIONS).has(raw.recommendedAction)?raw.recommendedAction:fallback.recommendedAction,",'server validate action mode')
          server=replace_once(server,"async function runGemini(env,contest,topics){","async function runGemini(env,contest,topics,mode='general'){")
          old_system="  const system=`Você é um consultor pedagógico para preparação de concursos públicos. Você NÃO controla o cronograma, NÃO altera prioridades, NÃO cria assuntos e NÃO diagnostica condições médicas. O Retention Engine determinístico é a autoridade. Sua única função é interpretar métricas já calculadas e sugerir UMA intervenção de estudo por tópico. Seja conservador, objetivo e use somente os dados fornecidos. Nunca recomende excluir conteúdo. Retorne apenas JSON no schema solicitado.`;"
          new_system="  const layered=mode==='layered_review';\n  const system=`Você é um consultor pedagógico para preparação de concursos públicos. Você NÃO controla o cronograma, NÃO altera prioridades, NÃO cria assuntos e NÃO diagnostica condições médicas. O Retention Engine determinístico é a autoridade. Sua única função é interpretar métricas já calculadas e sugerir UMA intervenção de estudo por tópico. ${layered?'Neste modo escolha EXATAMENTE entre active_recall, short_review, questions e focused_restudy. Considere history.recentRecommendedLayers e history.recentStartedLayers e evite repetir o mesmo método sem nova evidência; só repita quando os sinais atuais justificarem claramente.':''} Seja conservador, objetivo e use somente os dados fornecidos. Nunca recomende excluir conteúdo. Retorne apenas JSON no schema solicitado.`;"
          server=replace_once(server,old_system,new_system,'server AI system')
          server=replace_once(server,"recommendedAction:{type:'STRING',enum:[...ACTIONS]}","recommendedAction:{type:'STRING',enum:[...(layered?LAYER_ACTIONS:ACTIONS)]}",'server schema mode')
          server=replace_once(server,"  const fallback=topics.map(deterministicIntervention);\n  let interventions=fallback,aiUsed=false;","  const mode=body?.mode==='layered_review'?'layered_review':'general';\n  const fallback=topics.map(deterministicIntervention);\n  let interventions=fallback,aiUsed=false;",'server mode parse')
          server=replace_once(server,"    const raw=await runGemini(env,body?.contest,topics);","    const raw=await runGemini(env,body?.contest,topics,mode);",'server gemini mode')
          server=replace_once(server,"    interventions=topics.map(topic=>validateIntervention(byId.get(topic.topicId),topic));","    interventions=topics.map(topic=>validateIntervention(byId.get(topic.topicId),topic,mode));",'server validate mode call')
          server_path.write_text(server)

          Path('.github/workflows/temp-critical-points-adaptive.yml').unlink()
