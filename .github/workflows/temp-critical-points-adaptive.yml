          old_start="            const base={kind:'study',materia:item.materia,assunto:item.assunto,itemId:item.id,isRevision:true,minutes:def.minutes,source:'layered_review',layer:Number(layer)};\n            const modal=document.getElementById('modalLayeredReview'); setVisualState(modal, false);\n            pendingLayeredReview=null;"
          new_start="            const base={kind:'study',materia:item.materia,assunto:item.assunto,itemId:item.id,isRevision:true,minutes:def.minutes,source:'layered_review',layer:Number(layer)};\n            const key=pending?.row?.state?.key || getStudyTopicKey(item.materia,item.assunto);\n            recordCriticalReviewEvent(key,'started',Number(layer),'user');\n            const modal=document.getElementById('modalLayeredReview'); setVisualState(modal, false);\n            pendingLayeredReview=null;"
          app=replace_once(app,old_start,new_start,'start layered history')

          old_diag="            const diag = buildRetentionDiagnostics();\n            const totalRows = Math.max(1, diag.rows.length);\n            const average = Number.isFinite(diag.avg) ? Math.round(diag.avg) : null;\n            set('retentionDiagAverage', average != null ? `${average}%` : '—');\n            set('retentionDiagRisk', diag.risk.length);"
          new_diag="            const diag = buildRetentionDiagnostics();\n            const visibleRisk = diag.risk.filter(row => !isCriticalTopicSnoozed(row?.state?.key));\n            const totalRows = Math.max(1, diag.rows.length);\n            const average = Number.isFinite(diag.avg) ? Math.round(diag.avg) : null;\n            set('retentionDiagAverage', average != null ? `${average}%` : '—');\n            set('retentionDiagRisk', visibleRisk.length);"
          app=replace_once(app,old_diag,new_diag,'visible risk count')
          app=replace_once(app,"            setBar('retentionDiagRiskBar', countBar(diag.risk.length));","            setBar('retentionDiagRiskBar', countBar(visibleRisk.length));",'visible risk bar')
          app=replace_once(app,"            retentionDiagnosticRows = diag.risk.slice(0,20);","            retentionDiagnosticRows = visibleRisk.slice(0,20);",'visible risk rows')

          old_action="                if (action === 'start-layered-review') {\n                    startLayeredReviewLayer(Number(actionTarget.dataset.layer));\n                    return;\n                }"
          new_action="                if (action === 'start-layered-review') {\n                    startLayeredReviewLayer(Number(actionTarget.dataset.layer));\n                    return;\n                }\n                if (action === 'snooze-critical-review') {\n                    snoozeCriticalReview24h().catch(error => console.warn('Não foi possível adiar o ponto crítico:',error));\n                    return;\n                }"
          app=replace_once(app,old_action,new_action,'snooze action')
          app_path.write_text(app)

          index_path=Path('public/index.html')
          index=index_path.read_text()
          old_buttons='''            <div class="layered-review-actions">\n                <button class="btn btn-secondary btn-sm" type="button" data-action="call" data-call="closeLayeredReviewModal">Fechar (ESC)</button>\n                <button class="btn btn-primary btn-sm" type="button" id="layeredReviewStartRecommended" data-action="call" data-call="startRecommendedLayeredReview" data-enter-default="true">Iniciar camada recomendada</button>\n            </div>'''
          if old_buttons not in index:
              old_buttons=old_buttons.replace('\n','\r\n')
          new_buttons='''            <div class="layered-review-actions">\n                <button class="btn btn-secondary btn-sm" type="button" data-action="call" data-call="closeLayeredReviewModal">Fechar (ESC)</button>\n                <button class="btn btn-secondary btn-sm" type="button" data-dynamic-action="snooze-critical-review">Adiar 24h</button>\n                <button class="btn btn-primary btn-sm" type="button" id="layeredReviewStartRecommended" data-action="call" data-call="startRecommendedLayeredReview" data-enter-default="true">Iniciar camada recomendada</button>\n            </div>'''
          if '\r\n' in old_buttons:
              new_buttons=new_buttons.replace('\n','\r\n')
