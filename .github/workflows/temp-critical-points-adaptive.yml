name: Temporary Critical Points Adaptive Patch

on:
  push:
    branches:
      - fix/critical-points-adaptive-method-v10.64.9
    paths:
      - '.github/workflows/temp-critical-points-adaptive.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critical-points-adaptive-method-v10.64.9
          fetch-depth: 0
      - name: Apply adaptive patch
        run: python .github/scripts/temp-critical-points-patch.py
      - name: Preserve auxiliary AI contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/learning-diagnosis.js')
          s=p.read_text()
          needle="const LAYER_ACTIONS=new Set(['active_recall','short_review','questions','focused_restudy']);"
          contract="const ADVISOR_POLICY=Object.freeze({advisorRole:'auxiliary',authority:'retention-engine',autoSchedule:false});"
          if contract not in s:
              if needle not in s:
                  raise SystemExit('layer actions marker missing')
              s=s.replace(needle,needle+'\n'+contract,1)
          p.write_text(s)
          PY
      - name: Validate adaptive implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/app-ui.js
          node --check public/js/learning-advisor.js
          node --check src/learning-diagnosis.js
          npm test
          git diff --check
      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(retention): tornar Pontos críticos adaptativos'
          git push origin HEAD:fix/critical-points-adaptive-method-v10.64.9
