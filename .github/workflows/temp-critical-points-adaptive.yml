            const modal=document.getElementById('modalLayeredReview'); setVisualState(modal, true);
        }
'''
          new_open=r'''        function openLayeredReviewModal(index) {
            const row = retentionDiagnosticRows[index];
            if (!row?.state) return;
            const item = editalItems.find(i => getStudyTopicKey(i.materia,i.assunto) === row.state.key);
