name: Retention Modal Hotfix V2

on:
  push:
    branches:
      - fix/retention-modal-unification-v1

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Apply deterministic retention modal hotfix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-version.mjs 10.64.27
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          old='10.64.26'; new='10.64.27'; root=Path('.')
          p=root/'config/release-contract.json'; d=json.loads(p.read_text()); d['version']=new; d.setdefault('android',{})['versionCode']=106429; p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          p=root/'config/app-assets.json'; d=json.loads(p.read_text()); d['version']=new
          for k,v in list(d.items()):
              if isinstance(v,list): d[k]=[x.replace(f'responsive-polish-v{old}.css',f'responsive-polish-v{new}.css') if isinstance(x,str) else x for x in v]
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          oldcss=root/f'public/css/responsive-polish-v{old}.css'; newcss=root/f'public/css/responsive-polish-v{new}.css'
          if not newcss.exists(): shutil.copyfile(oldcss,newcss)
          p=root/'public/index.html'; s=p.read_text().replace(f'responsive-polish-v{old}.css',f'responsive-polish-v{new}.css')
          style=f'    <link rel="stylesheet" href="./css/responsive-polish-v{new}.css">'; advisor_style='    <link rel="stylesheet" href="./css/learning-advisor.css" data-learning-advisor-style="1">'
          if advisor_style not in s: s=s.replace(style,style+'\n'+advisor_style,1)
          core='    <script src="./js/app-core.js" defer></script>'
          scripts=f'    <script src="./js/learning-advisor.js?v={new}" defer data-learning-advisor="1"></script>\n    <script src="./js/critical-points-actions.js?v={new}" defer data-critical-point-actions="1"></script>'
          if 'data-learning-advisor="1"' not in s: s=s.replace(core,core+'\n'+scripts,1)
          p.write_text(s)
          p=root/'public/js/app-pwa.js'; p.write_text(p.read_text().replace(old,new))
          for rel in ['src/worker.js','package-lock.json']:
              p=root/rel
              if p.exists(): p.write_text(p.read_text().replace(old,new))
          for p in list((root/'android').rglob('*.gradle'))+list((root/'android').rglob('*.kts')):
              s=p.read_text().replace('versionCode 106428','versionCode 106429').replace('versionCode = 106428','versionCode = 106429').replace(f'versionName "{old}-mobile.1"',f'versionName "{new}-mobile.1"').replace(f'versionName = "{old}-mobile.1"',f'versionName = "{new}-mobile.1"'); p.write_text(s)
          (root/'tests/retention-metric-deterministic-loader.test.cjs').write_text(r'''const fs=require('node:fs');const path=require('node:path');const test=require('node:test');const assert=require('node:assert/strict');
          const root=path.join(__dirname,'..');const html=fs.readFileSync(path.join(root,'public/index.html'),'utf8');const critical=fs.readFileSync(path.join(root,'public/js/critical-points-actions.js'),'utf8');const advisor=fs.readFileSync(path.join(root,'public/js/learning-advisor.js'),'utf8');
          test('ordered retention modal runtime',()=>{const core=html.indexOf('./js/app-core.js'),a=html.indexOf('./js/learning-advisor.js'),c=html.indexOf('./js/critical-points-actions.js'),ui=html.indexOf('./js/app-ui.js');assert.ok(core>=0&&a>core&&c>a&&ui>c);assert.match(html,/data-learning-advisor="1"/);assert.match(html,/data-critical-point-actions="1"/);});
          test('overdue and mastered intercept legacy modal',()=>{assert.match(critical,/document\.addEventListener\('click',onMetricClick,true\)/);assert.match(critical,/kind!==['"]overdue['"]&&kind!==['"]mastered['"]/);assert.match(critical,/event\.stopImmediatePropagation\(\)/);assert.match(critical,/openModernRetentionMetric\(kind\)/);});
          test('modern dialog closes by X backdrop and Escape',()=>{assert.match(advisor,/id="learningAdvisorClose"/);assert.match(advisor,/event\.target===overlay\)closeDialog\(\)/);assert.match(advisor,/event\.key===['"]Escape['"][\s\S]*closeDialog\(\)/);});
          ''')
          PY

      - name: Validate hotfix and release contract
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/retention-metric-modern-dialog.test.cjs tests/retention-metric-deterministic-loader.test.cjs
          npm test
          node scripts/audit-release.mjs
          node scripts/audit-asset-manifest.mjs
          node scripts/audit-inline-csp.mjs
          node scripts/audit-toolchain-pins.mjs

      - name: Commit validated hotfix and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/retention-modal-hotfix.yml .github/workflows/retention-modal-hotfix-v2.yml
          git add config/release-contract.json config/app-assets.json package.json package-lock.json public/version.json public/sw.js src/index.js src/worker.js public/index.html public/js/app-pwa.js public/css/responsive-polish-v10.64.27.css tests/retention-metric-deterministic-loader.test.cjs android || true
          git commit -m "fix(ui): unificar modais de retenção e diagnóstico"
          git push origin HEAD:fix/retention-modal-unification-v1
