name: TEMP Direct Functional v10.25.2
on:
  pull_request:
    branches: [main]
    types: [reopened]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/v10-25-2-functional-direct' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v10-25-2-functional-direct
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply functional patch
        run: python3 scripts/temp-v10-25-2-direct.py
      - name: Validate
        run: |
          node --check src/index.js
          node --check public/js/pdf/pdf-reader.js
          node --check public/js/pdf/pdf-library-ui.js
          npm test
          AUDIT_ALLOW_ANY_ROOT=1 npm run audit
      - name: Commit functional files
        run: |
          rm -f scripts/temp-v10-25-2-direct.py scripts/temp-v10-25-2.py
          rm -f .github/workflows/temp-direct-functional.yml .github/workflows/temp-apply-v10-25-2-functional.yml .github/workflows/temp-v10-25-2-push.yml
          rm -f .v10-25-2-functional-trigger .v10-25-2-prtarget-trigger .v10-25-2-qc-trigger .v10-25-2-trigger .v10-25-2-trigger-2 .v10-25-2-trigger-3 .v10-25-2-trigger-4
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.js public/js/pdf/pdf-reader.js public/js/pdf/pdf-library-ui.js package.json public/version.json public/sw.js
          git add -u scripts .github/workflows .v10-25-2-functional-trigger .v10-25-2-prtarget-trigger .v10-25-2-qc-trigger .v10-25-2-trigger .v10-25-2-trigger-2 .v10-25-2-trigger-3 .v10-25-2-trigger-4 || true
          git diff --cached --quiet && exit 0
          git commit -m "fix: smarter iterative flashcards and reliable mobile library v10.25.2"
          git push origin HEAD:fix/v10-25-2-functional-direct
