name: Android Release

on:
  workflow_run:
    workflows: ["Canonical GitHub Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  signed-runtime-distribution:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}

    steps:
      - name: Checkout canonical release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Resolve canonical release contract
        id: release_contract
        run: node scripts/release-contract.mjs github

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"

      - name: Materialize release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/estudo-adaptativo-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical Android migration
        run: node scripts/migrate-android-phase1b.mjs

      - name: Run web unit tests
        run: npm test

      - name: Run structural audits
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

      - name: Prepare Worker-proxied vendor assets
        run: npm run android:prepare

      - name: Apply Android mobile UI and branding hotfix
        run: node scripts/apply-android-mobile-hotfix.mjs

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Verify release identity and branding
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-contract.mjs check
          grep -q "versionCode $APP_VERSION_CODE" android/app/build.gradle
          grep -q "versionName \"$ANDROID_VERSION_NAME\"" android/app/build.gradle
          grep -q "\"version\": \"$WEB_VERSION\"" public/version.json
          grep -q 'android:icon="@drawable/estudo_adaptativo_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/estudo_adaptativo_launcher"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/drawable-nodpi/estudo_adaptativo_launcher.png
          grep -q 'android-mobile-hotfix.css' android/app/src/main/assets/public/index.html
          test -s "android/app/src/main/assets/public/css/$RESPONSIVE_CSS"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1)"
          AVDMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name avdmanager -perm -u+x | head -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

      - name: Validate final distributable APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee android-release-signature.txt
          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "package: name='$APP_PACKAGE'"
          printf '%s\n' "$BADGING" | grep -q "versionCode='$APP_VERSION_CODE'"
          printf '%s\n' "$BADGING" | grep -q "versionName='$ANDROID_VERSION_NAME'"
          unzip -l "$APK" | grep -q 'assets/public/css/android-mobile-hotfix.css'
          unzip -l "$APK" | grep -q "assets/public/css/$RESPONSIVE_CSS"
          unzip -l "$APK" | grep -q 'assets/public/vendor/supabase.js'
          if find android/app/build/outputs -type f -name '*.aab' -print -quit | grep -q .; then
            echo 'AAB inesperado foi produzido; o pipeline canônico distribui somente APK.' >&2
            exit 1
          fi

      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd-release"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | ANDROID_AVD_HOME="$ANDROID_AVD_HOME" "$AVDMANAGER" create avd --force --name android-release --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6'
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Start Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          nohup emulator @android-release -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel auto > android-release-emulator.log 2>&1 &
          EMULATOR_PID=$!
          timeout 120 adb wait-for-device
          kill -0 "$EMULATOR_PID"
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell input keyevent 82 || true
          adb devices

      - name: Install, launch and resume signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          adb install -r "$APK" | tee android-release-install.txt
          adb logcat -c
          adb shell am force-stop "$APP_PACKAGE"
          adb shell monkey -p "$APP_PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 10
          PID="$(adb shell pidof "$APP_PACKAGE" | tr -d '\r')"
          test -n "$PID"
          adb shell dumpsys activity activities > android-release-activity.txt
          grep -q "$APP_PACKAGE" android-release-activity.txt
          adb exec-out screencap -p > android-release-launch.png
          adb shell input keyevent 3
          sleep 3
          adb shell monkey -p "$APP_PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 8
          test -n "$(adb shell pidof "$APP_PACKAGE" | tr -d '\r')"
          adb exec-out screencap -p > android-release-resume.png
          adb logcat -d > android-release-logcat.txt
          if grep -A10 'FATAL EXCEPTION' android-release-logcat.txt | grep -q "$APP_PACKAGE"; then
            echo 'Crash detectado no APK Android assinado.' >&2
            exit 1
          fi

      - name: Prepare direct distribution package
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/android/direct"
          mkdir -p "$OUT"
          FINAL="EstudoAdaptativo-v${ANDROID_VERSION_NAME}-android-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT/$FINAL"
          sha256sum "$OUT/$FINAL" | tee "$OUT/SHA256SUMS.txt"
          cp android-release-signature.txt "$OUT/android-release-signature.txt"
          cat > "$OUT/INSTALL-ANDROID.txt" <<EOF
          Estudo Adaptativo Inteligente ${ANDROID_VERSION_NAME}
          Pacote: ${APP_PACKAGE}
          Version code: ${APP_VERSION_CODE}

          1. Transfira ${FINAL} para o Android.
          2. Abra o APK no aparelho e confirme a instalação/atualização.
          3. Abra o Estudo Adaptativo Inteligente.

          Validação ADB opcional:
          adb install -r ${FINAL}
          adb shell dumpsys package ${APP_PACKAGE} | grep -E 'versionName|versionCode'
          EOF
          cat > "$OUT/distribution-manifest.json" <<EOF
          {
            "app": "Estudo Adaptativo Inteligente",
            "package": "${APP_PACKAGE}",
            "versionName": "${ANDROID_VERSION_NAME}",
            "versionCode": ${APP_VERSION_CODE},
            "webVersion": "${WEB_VERSION}",
            "format": "APK",
            "signed": true,
            "aabProduced": false,
            "sourceCommit": "${GITHUB_SHA}",
            "workflowRun": "${GITHUB_RUN_ID}",
            "permanentReleaseTag": "${RELEASE_TAG}"
          }
          EOF

      - name: Upload direct distribution APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EstudoAdaptativo-v${{ steps.release_contract.outputs.android_version_name }}-direct-distribution-apk
          path: dist/android/direct/
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed runtime diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EstudoAdaptativo-v${{ steps.release_contract.outputs.android_version_name }}-release-runtime-diagnostics
          path: |
            android-release-signature.txt
            android-release-emulator.log
            android-release-install.txt
            android-release-activity.txt
            android-release-launch.png
            android-release-resume.png
            android-release-logcat.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish permanent APK assets to canonical GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/android/direct"
          FINAL="EstudoAdaptativo-v${ANDROID_VERSION_NAME}-android-release.apk"

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release canônica $RELEASE_TAG ausente. Android Release só pode publicar após Canonical GitHub Release concluir com sucesso."
            exit 1
          fi

          git fetch --tags --force
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          current_sha="$(git rev-parse HEAD)"
          if [ "$tag_sha" != "$current_sha" ]; then
            echo "::error::Tag canônica $RELEASE_TAG aponta para $tag_sha, mas o APK foi construído de $current_sha."
            exit 1
          fi

          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$existing_assets" | grep -Fxq "$FINAL"; then
            echo "Asset permanente $FINAL já existe; mantendo o binário publicado sem substituição."
            exit 0
          fi
          cp "$OUT/SHA256SUMS.txt" "$OUT/EstudoAdaptativo-v${ANDROID_VERSION_NAME}-android-SHA256SUMS.txt"
          cp "$OUT/android-release-signature.txt" "$OUT/EstudoAdaptativo-v${ANDROID_VERSION_NAME}-android-signature.txt"
          cp "$OUT/distribution-manifest.json" "$OUT/EstudoAdaptativo-v${ANDROID_VERSION_NAME}-android-distribution-manifest.json"
          cp "$OUT/INSTALL-ANDROID.txt" "$OUT/EstudoAdaptativo-v${ANDROID_VERSION_NAME}-INSTALL-ANDROID.txt"
          gh release upload "$RELEASE_TAG" \
            "$OUT/$FINAL" \
            "$OUT/EstudoAdaptativo-v${ANDROID_VERSION_NAME}-android-SHA256SUMS.txt" \
            "$OUT/EstudoAdaptativo-v${ANDROID_VERSION_NAME}-android-signature.txt" \
            "$OUT/EstudoAdaptativo-v${ANDROID_VERSION_NAME}-android-distribution-manifest.json" \
            "$OUT/EstudoAdaptativo-v${ANDROID_VERSION_NAME}-INSTALL-ANDROID.txt"
          gh release view "$RELEASE_TAG" --json url,tagName,assets --jq '{url,tagName,assets:[.assets[].name]}'
