name: Apply Lazy PDF Bootstrap Patch

on:
  push:
    branches:
      - perf/true-lazy-pdf-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/true-lazy-pdf-bootstrap
          fetch-depth: 0
      - name: Patch index without newline churn
        shell: python
        run: |
          from pathlib import Path

          path = Path('public/index.html')
          raw = path.read_bytes()
          text = raw.decode('utf-8')

          anchor = '    <script src="./js/core/edital-integrity.js" defer></script>'
          loader = '    <script src="./js/performance-loader.js" defer></script>'
          if loader not in text:
              if anchor not in text:
                  raise SystemExit('index anchor not found')
              text = text.replace(anchor, loader + ('\r\n' if '\r\n' in text else '\n') + anchor, 1)

          eager_pdf = [
              '    <script src="./js/pdf/pdf-core.js" defer></script>',
              '    <script src="./js/pdf/pdf-workspaces.js" defer></script>',
              '    <script src="./js/pdf/pdf-links.js" defer></script>',
              '    <script src="./js/pdf/pdf-library.js" defer></script>',
              '    <script src="./js/pdf/pdf-upload.js" defer></script>',
              '    <script src="./js/pdf/pdf-annotations.js" defer></script>',
              '    <script src="./vendor/pdf.min.js" defer></script>',
              '    <script src="./js/pdf/pdf-reader.js" defer></script>',
              '    <script src="./js/pdf/pdf-library-ui.js" defer></script>',
          ]
          for tag in eager_pdf:
              text = text.replace(tag + '\r\n', '').replace(tag + '\n', '').replace(tag, '')

          if any(tag in text for tag in eager_pdf):
              raise SystemExit('eager PDF tag remained')
          if loader not in text:
              raise SystemExit('performance loader was not inserted')
          path.write_bytes(text.encode('utf-8'))

          Path('.github/workflows/apply-lazy-pdf-bootstrap.yml').unlink()
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/apply-lazy-pdf-bootstrap.yml
          git diff --cached --check
          git commit -m "perf(pdf): remove eager library scripts from bootstrap"
          git push origin HEAD:perf/true-lazy-pdf-bootstrap
