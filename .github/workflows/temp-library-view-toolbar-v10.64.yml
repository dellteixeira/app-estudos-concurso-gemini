name: Temporary Library View Toolbar v10.64

on:
  push:
    branches:
      - fix/library-view-toggle-order-v10.64.0

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/library-view-toggle-order-v10.64.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Aplicar layout e identidade v10.64.0
        shell: python
        run: |
          from pathlib import Path

          ui_path = Path('public/js/pdf/pdf-library-ui.js')
          ui = ui_path.read_text()
          old_head = "function ensureLibraryViewToggle(){ensureLibraryViewStyles();const materia=$('pdfMateriaFilter');if(!materia)return;let wrap=$('pdfLibraryViewToggle');"
          new_head = "function ensureLibraryViewToggle(){ensureLibraryViewStyles();const actions=document.querySelector('.pdf-library-actions');if(!actions)return;let wrap=$('pdfLibraryViewToggle');"
          if old_head not in ui:
              raise SystemExit('Cabeçalho esperado de ensureLibraryViewToggle não encontrado')
          ui = ui.replace(old_head, new_head, 1)
          old_tail = ");materia.insertAdjacentElement('afterend',wrap)}applyLibraryViewMode()}"
          new_tail = ");actions.appendChild(wrap)}else if(wrap.parentElement!==actions){actions.appendChild(wrap)}applyLibraryViewMode()}"
          if old_tail not in ui:
              raise SystemExit('Cauda esperada de ensureLibraryViewToggle não encontrada')
          ui = ui.replace(old_tail, new_tail, 1)
          ui_path.write_text(ui)

          ordering_path = Path('public/js/pdf/pdf-library-ordering.js')
          ordering = ordering_path.read_text()
          old_place = """function placeSortControl(wrap){
            const actions=document.querySelector('.pdf-library-actions');
            if(!actions)return false;
            wrap.classList.add('pdf-library-sort-control--actions');
            if(wrap.parentElement!==actions||wrap!==actions.lastElementChild)actions.appendChild(wrap);
            return true;
          }"""
          new_place = """function placeSortControl(wrap){
            const actions=document.querySelector('.pdf-library-actions');
            if(!actions)return false;
            const viewToggle=$('pdfLibraryViewToggle');
            wrap.classList.add('pdf-library-sort-control--actions');
            if(viewToggle?.parentElement===actions){
              if(wrap.parentElement!==actions||wrap.nextElementSibling!==viewToggle)actions.insertBefore(wrap,viewToggle);
            }else if(wrap.parentElement!==actions||wrap!==actions.lastElementChild)actions.appendChild(wrap);
            return true;
          }"""
          if old_place not in ordering:
              raise SystemExit('placeSortControl esperado não encontrado')
          ordering = ordering.replace(old_place, new_place, 1)
          ordering_path.write_text(ordering)

          for filename in ['package.json','public/version.json','src/index.js','public/sw.js']:
              path = Path(filename)
              text = path.read_text()
              if '10.63.0' not in text:
                  raise SystemExit(f'Versão 10.63.0 não encontrada em {filename}')
              path.write_text(text.replace('10.63.0','10.64.0'))

          Path('tests/pdf-library-view-toolbar-v10.64.test.cjs').write_text(r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = path.resolve(__dirname, '..');
          const ui = fs.readFileSync(path.join(root, 'public/js/pdf/pdf-library-ui.js'), 'utf8');
          const ordering = fs.readFileSync(path.join(root, 'public/js/pdf/pdf-library-ordering.js'), 'utf8');
          const layout = fs.readFileSync(path.join(root, 'public/js/pdf/pdf-library-layout-fix.js'), 'utf8');

          test('Cards e Lista ficam no mesmo trilho de ações do botão Ordenar', () => {
            assert.match(ui, /const actions=document\.querySelector\('\.pdf-library-actions'\)/);
            assert.match(ui, /actions\.appendChild\(wrap\)/);
            assert.doesNotMatch(ui, /materia\.insertAdjacentElement\('afterend',wrap\)/);
            assert.match(ordering, /actions\.insertBefore\(wrap,viewToggle\)/);
          });

          test('ordem visual permanece Adicionar PDFs, Ordenar, Cards\/Lista quando o toggle já existe', () => {
            assert.match(ordering, /const viewToggle=\$\('pdfLibraryViewToggle'\)/);
            assert.match(ordering, /wrap\.nextElementSibling!==viewToggle/);
            assert.match(layout, /grid-template-columns:repeat\(3,minmax\(0,1fr\)\)/);
          });

          test('mobile mantém os três controles no trilho horizontal alcançável', () => {
            assert.match(layout, /\.pdf-library-actions \{[\s\S]*?display:flex!important;[\s\S]*?overflow-x:auto!important/);
            assert.match(layout, /\.pdf-library-actions>\* \{[\s\S]*?flex:0 0 150px!important/);
          });
          ''')
      - name: Testes unitários e auditorias
        run: npm run check
      - name: Remover workflow temporário e publicar commit
        run: |
          rm -f .github/workflows/temp-library-view-toolbar-v10.64.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(library): alinhar Cards e Lista ao lado de Ordenar"
          git push origin HEAD:fix/library-view-toggle-order-v10.64.0
