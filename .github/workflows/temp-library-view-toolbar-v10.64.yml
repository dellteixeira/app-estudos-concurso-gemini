name: Temporary Library View Toolbar v10.64
on:
  push:
    branches: [fix/library-view-toggle-order-v10.64.0]
permissions:
  contents: write
jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/library-view-toggle-order-v10.64.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Apply
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/js/pdf/pdf-library-ui.js'); s=p.read_text()
          a="function ensureLibraryViewToggle(){ensureLibraryViewStyles();const materia=$('pdfMateriaFilter');if(!materia)return;let wrap=$('pdfLibraryViewToggle');"
          b="function ensureLibraryViewToggle(){ensureLibraryViewStyles();const actions=document.querySelector('.pdf-library-actions');if(!actions)return;let wrap=$('pdfLibraryViewToggle');"
          assert a in s; s=s.replace(a,b,1)
          a=");materia.insertAdjacentElement('afterend',wrap)}applyLibraryViewMode()}"
          b=");actions.appendChild(wrap)}else if(wrap.parentElement!==actions){actions.appendChild(wrap)}applyLibraryViewMode()}"
          assert a in s; p.write_text(s.replace(a,b,1))

          p=Path('public/js/pdf/pdf-library-ordering.js'); s=p.read_text()
          a="""function placeSortControl(wrap){
            const actions=document.querySelector('.pdf-library-actions');
            if(!actions)return false;
            wrap.classList.add('pdf-library-sort-control--actions');
            if(wrap.parentElement!==actions||wrap!==actions.lastElementChild)actions.appendChild(wrap);
            return true;
          }"""
          b="""function placeSortControl(wrap){
            const actions=document.querySelector('.pdf-library-actions');
            if(!actions)return false;
            const viewToggle=$('pdfLibraryViewToggle');
            wrap.classList.add('pdf-library-sort-control--actions');
            if(viewToggle?.parentElement===actions){
              if(wrap.parentElement!==actions||wrap.nextElementSibling!==viewToggle)actions.insertBefore(wrap,viewToggle);
            }else if(wrap.parentElement!==actions||wrap!==actions.lastElementChild)actions.appendChild(wrap);
            return true;
          }"""
          assert a in s; p.write_text(s.replace(a,b,1))

          for f in ['package.json','public/version.json','src/index.js','public/sw.js']:
            p=Path(f); s=p.read_text(); assert '10.63.0' in s, f; p.write_text(s.replace('10.63.0','10.64.0'))

          Path('tests/pdf-library-view-toolbar-v10.64.test.cjs').write_text("""const test=require('node:test');\nconst assert=require('node:assert/strict');\nconst fs=require('node:fs');\nconst ui=fs.readFileSync('public/js/pdf/pdf-library-ui.js','utf8');\nconst ordering=fs.readFileSync('public/js/pdf/pdf-library-ordering.js','utf8');\nconst layout=fs.readFileSync('public/js/pdf/pdf-library-layout-fix.js','utf8');\ntest('Cards/Lista ficam ao lado de Ordenar',()=>{assert.match(ui,/const actions=document\\.querySelector\\('\\.pdf-library-actions'\\)/);assert.match(ui,/actions\\.appendChild\\(wrap\\)/);assert.doesNotMatch(ui,/materia\\.insertAdjacentElement\\('afterend',wrap\\)/);assert.match(ordering,/actions\\.insertBefore\\(wrap,viewToggle\\)/)});\ntest('desktop preserva três colunas de ações',()=>assert.match(layout,/grid-template-columns:repeat\\(3,minmax\\(0,1fr\\)\\)/));\ntest('mobile preserva trilho horizontal',()=>{assert.match(layout,/overflow-x:auto!important/);assert.match(layout,/\\.pdf-library-actions>\\* \\{[\\s\\S]*?flex:0 0 150px!important/)})\n""")
      - run: npm run check
      - name: Commit
        run: |
          rm .github/workflows/temp-library-view-toolbar-v10.64.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(library): alinhar Cards e Lista ao lado de Ordenar"
          git push
