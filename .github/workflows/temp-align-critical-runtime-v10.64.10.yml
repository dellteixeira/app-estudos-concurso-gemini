name: Temp align critical runtime v10.64.10

on:
  push:
    branches:
      - fix/critical-points-snooze

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critical-points-snooze
          fetch-depth: 0
      - name: Align runtime route lists
        shell: python
        run: |
          from pathlib import Path

          sw = Path('public/sw.js')
          text = sw.read_text(encoding='utf-8')
          sw_route = "'/js/critical-points-actions.js'"
          needle = "'/js/adaptive-schedule-reconciliation.js', '/js/learning-advisor.js', '/js/notes-import-export.js'"
          replacement = "'/js/adaptive-schedule-reconciliation.js', '/js/learning-advisor.js', '/js/critical-points-actions.js', '/js/notes-import-export.js'"
          if sw_route not in text[text.find('const NETWORK_FIRST_PATHS'):]:
              if needle not in text:
                  raise SystemExit('Service Worker network-first anchor not found')
              text = text.replace(needle, replacement, 1)
          sw.write_text(text, encoding='utf-8')

          worker = Path('src/index.js')
          text = worker.read_text(encoding='utf-8')
          worker_route = '"/js/critical-points-actions.js"'
          core_start = text.find('const CORE_NO_STORE_PATHS = new Set([')
          core_end = text.find(']);', core_start)
          if core_start < 0 or core_end < 0:
              raise SystemExit('Cloudflare Worker CORE_NO_STORE_PATHS not found')
          core_block = text[core_start:core_end]
          if worker_route not in core_block:
              needle = '"/js/pdf/pdf-library-ui.js", "/js/app-pwa.js"'
              replacement = '"/js/pdf/pdf-library-ui.js", "/js/critical-points-actions.js", "/js/app-pwa.js"'
              if needle not in text:
                  raise SystemExit('Cloudflare Worker no-store insertion anchor not found')
              text = text.replace(needle, replacement, 1)
          worker.write_text(text, encoding='utf-8')
      - name: Commit runtime alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sw.js src/index.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(runtime): alinhar rotas dos pontos críticos"
          git push origin HEAD:fix/critical-points-snooze
