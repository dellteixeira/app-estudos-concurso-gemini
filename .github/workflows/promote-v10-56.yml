name: Promote v10.56.0

on:
  push:
    branches:
      - feat/offline-metadata-ring3-promotion-v10.56.0

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/offline-metadata-ring3-promotion-v10.56.0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'

      - name: Promote release identity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-version.mjs 10.56.0
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = ['config','public','tests','src'];
          const allowed = new Set(['.js','.cjs','.mjs','.json','.html','.css','.txt']);
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const ent of fs.readdirSync(dir,{withFileTypes:true})) {
              const p = path.join(dir,ent.name);
              if (ent.isDirectory()) walk(p);
              else if (allowed.has(path.extname(ent.name))) {
                const old = fs.readFileSync(p,'utf8');
                const next = old
                  .replaceAll('10.55.0','10.56.0')
                  .replaceAll('10\\.55\\.0','10\\.56\\.0');
                if (next !== old) fs.writeFileSync(p,next);
              }
            }
          }
          for (const root of roots) walk(root);
          fs.writeFileSync('public/version.json', JSON.stringify({version:'10.56.0',build:'source',commit:'source'},null,2)+'\n');
          NODE
          node tests/deploy-identity.test.cjs
          npm test

      - name: Commit promotion and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dellteixeira'
          git config user.email '111660903+dellteixeira@users.noreply.github.com'
          git rm .github/workflows/promote-v10-56.yml
          git add -A
          git commit -m 'chore(release): promote v10.56.0'
          git push origin HEAD:feat/offline-metadata-ring3-promotion-v10.56.0
