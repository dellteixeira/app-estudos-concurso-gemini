name: TEMP Fix Index Diff v10.62

on:
  push:
    branches:
      - fix/edital-guides-single-toggle-v10.62.0

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/edital-guides-single-toggle-v10.62.0
          fetch-depth: 0
      - name: Restore index and apply surgical replacement
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- public/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          data = p.read_bytes()
          old = (b'                <div class="edital-guide-actions">\r\n'
                 b'                    <button class="btn btn-secondary btn-sm" data-inline-click="ih-009">Expandir Todas as Guias</button>\r\n'
                 b'                    <button class="btn btn-secondary btn-sm" data-inline-click="ih-010">Recolher Todas as Guias</button>\r\n'
                 b'                </div>')
          new = (b'                <div class="edital-guide-actions">\r\n'
                 b'                    <button id="toggleAllGuidesBtn" class="btn btn-secondary btn-sm" type="button" data-inline-click="ih-009" aria-expanded="false">Expandir Todas as Guias</button>\r\n'
                 b'                </div>')
          if data.count(old) != 1:
              raise SystemExit(f'Expected exactly one button block, found {data.count(old)}')
          p.write_bytes(data.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-fix-index-diff-v10.62.yml
      - name: Validate
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check public/js/app-core.js
          node --check public/js/app-ui.js
          npm test
          AUDIT_ALLOW_ANY_ROOT=1 npm run audit
      - name: Commit corrected diff
        run: |
          set -euo pipefail
          git config user.name dellteixeira
          git config user.email 111660903+dellteixeira@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): preservar diff cirúrgico do controle de guias"
          git push origin HEAD:fix/edital-guides-single-toggle-v10.62.0
