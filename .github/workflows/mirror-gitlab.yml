name: Mirror GitHub to GitLab

on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-gitlab
  cancel-in-progress: true

jobs:
  promote-v10-44:
    if: github.ref == 'refs/heads/feat/offline-metadata-promoted-stability-v10.44.0' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/offline-metadata-promoted-stability-v10.44.0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Promote release-bound identity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const files = [
            'package.json',
            'config/app-assets.json',
            'public/version.json',
            'src/index.js',
            'public/js/app-pwa.js',
            'public/js/app-state.js',
            'public/sw.js',
            'docs/phase-4m-promoted-metadata-stability.md'
          ];
          for (const name of fs.readdirSync('tests')) {
            if (name.endsWith('.test.cjs')) files.push(path.join('tests', name));
          }
          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            const before = fs.readFileSync(file, 'utf8');
            const after = before
              .replaceAll('10\\.43\\.0', '10\\.44\\.0')
              .replaceAll('10.43.0', '10.44.0')
              .replaceAll('10-43-0', '10-44-0')
              .replaceAll('v10.43.0', 'v10.44.0');
            if (after !== before) fs.writeFileSync(file, after);
          }
          NODE

      - name: Syntax check
        run: |
          node --check src/index.js
          node --check public/js/app-state.js
          node --check public/sw.js
          node --check public/js/core/offline-sync-metadata-promoted-stability.js

      - name: Automated tests
        run: npm test

      - name: Structural audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser responsive audit
        run: npm run test:browser

      - name: Restore canonical mirror workflow and commit promotion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/mirror-gitlab.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json config/app-assets.json public/version.json src/index.js public/js/app-pwa.js public/js/app-state.js public/sw.js tests docs/phase-4m-promoted-metadata-stability.md .github/workflows/mirror-gitlab.yml
          git commit -m 'chore(release): promote v10.44.0'
          git push origin HEAD:feat/offline-metadata-promoted-stability-v10.44.0
