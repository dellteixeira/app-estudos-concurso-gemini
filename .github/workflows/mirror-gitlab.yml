name: Edital Dedup Integrator

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'

      - name: Apply integration patch
        run: python3 scripts/apply-edital-dedup-patch.py

      - name: Syntax check
        run: |
          node --check public/js/core/edital-integrity.js
          node --check public/js/app-core.js

      - name: Automated tests
        run: npm test

      - name: Structural audit
        run: npm run audit

      - name: Commit integrated fix
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/mirror-gitlab.yml > .github/workflows/mirror-gitlab.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(edital): prevent duplicate topics across the app"
          git push origin HEAD:${GITHUB_REF_NAME}
