name: Temp Sync Release 10.64.42

on:
  push:
    branches: [fix/mobile-retention-centering]

permissions:
  contents: write

jobs:
  sync-derived-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/mobile-retention-centering
          fetch-depth: 0

      - name: Synchronize canonical release derivatives
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const version = '10.64.42';
          const versionCode = 106444;

          const assetsPath = 'config/app-assets.json';
          const assets = JSON.parse(fs.readFileSync(assetsPath, 'utf8'));
          assets.version = version;
          assets.criticalAppShell = assets.criticalAppShell.map((value) =>
            value === '/css/responsive-polish-v10.64.41.css'
              ? '/css/responsive-polish-v10.64.42.css'
              : value
          );
          fs.writeFileSync(assetsPath, JSON.stringify(assets, null, 2) + '\n');

          const replaceExact = (path, from, to) => {
            const before = fs.readFileSync(path, 'utf8');
            if (!before.includes(from)) throw new Error(`${path}: padrão esperado ausente: ${from}`);
            const after = before.replace(from, to);
            fs.writeFileSync(path, after);
          };

          replaceExact('src/index.js', 'const APP_VERSION = "10.64.41";', `const APP_VERSION = "${version}";`);
          replaceExact('public/sw.js', "const APP_VERSION = '10.64.41';", `const APP_VERSION = '${version}';`);
          replaceExact('android/app/build.gradle', 'versionCode 106443', `versionCode ${versionCode}`);
          replaceExact('android/app/build.gradle', 'versionName "10.64.41-mobile.1"', `versionName "${version}-mobile.1"`);
          NODE

          node scripts/release-contract.mjs check

      - name: Commit synchronized derivatives
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Derivados já sincronizados; nenhum commit necessário.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/app-assets.json src/index.js public/sw.js android/app/build.gradle
          git commit -m 'chore(release): sincronizar derivados 10.64.42'
          git push origin HEAD:fix/mobile-retention-centering
