name: PR305 Finalize

on:
  push:
    branches:
      - chore/ci-performance-architecture
    paths:
      - '.github/workflows/pr305-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/ci-performance-architecture
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Apply coherent v10.64.20 release migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          replacements = {
              'package.json': [('"version": "10.64.19"', '"version": "10.64.20"')],
              'package-lock.json': [('"version": "10.64.19"', '"version": "10.64.20"')],
              'public/version.json': [('"version": "10.64.19"', '"version": "10.64.20"')],
              'src/index.js': [('const APP_VERSION = "10.64.19"', 'const APP_VERSION = "10.64.20"')],
              'public/sw.js': [("const APP_VERSION = '10.64.19'", "const APP_VERSION = '10.64.20'"), ('responsive-polish-v10.64.19.css', 'responsive-polish-v10.64.20.css')],
              'public/index.html': [('responsive-polish-v10.64.19.css', 'responsive-polish-v10.64.20.css')],
              'public/js/ui/navigation.js': [('responsive-polish-v10.64.19.css', 'responsive-polish-v10.64.20.css')],
              'android/app/build.gradle': [('versionCode 106422', 'versionCode 106423'), ('versionName "10.64.19-mobile.2"', 'versionName "10.64.20-mobile.1"')],
          }
          for filename, pairs in replacements.items():
              p = Path(filename)
              text = p.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected token in {filename}: {old}')
                  text = text.replace(old, new)
              p.write_text(text)

          contract = json.loads(Path('config/release-contract.json').read_text())
          contract['version'] = '10.64.20'
          contract['android']['revision'] = 1
          contract['android']['versionCode'] = 106423
          Path('config/release-contract.json').write_text(json.dumps(contract, indent=2, ensure_ascii=False) + '\n')

          assets_path = Path('config/app-assets.json')
          assets = json.loads(assets_path.read_text())
          assets['version'] = '10.64.20'
          old = '/css/responsive-polish-v10.64.19.css'
          new = '/css/responsive-polish-v10.64.20.css'
          retention = '/css/components/retention.css'
          for key in ('criticalAppShell', 'networkFirstPaths', 'workerNoStorePaths', 'headersNoStorePaths'):
              items = assets[key]
              items[:] = [new if item == old else item for item in items]
              if retention not in items:
                  anchor = new if new in items else '/css/canonical-ui.css'
                  idx = items.index(anchor) + 1 if anchor in items else len(items)
                  items.insert(idx, retention)
          assets_path.write_text(json.dumps(assets, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Validate migration
        run: |
          npm ci
          node --check src/index.js
          npm test
          npm run audit
      - name: Commit finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json public/version.json src/index.js public/sw.js public/index.html public/js/ui/navigation.js android/app/build.gradle config/release-contract.json config/app-assets.json
          git commit -m 'chore(release): alinhar runtime e assets em v10.64.20'
          git push origin HEAD:chore/ci-performance-architecture
