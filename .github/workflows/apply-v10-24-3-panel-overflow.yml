name: Apply v10.24.3 panel overflow fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.head_ref == 'fix/v10-24-3-panel-overflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v10-24-3-panel-overflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar correção
        run: |
          if grep -q '"version": "10.24.3"' package.json; then
            echo 'v10.24.3 already applied'
          else
            node scripts/apply-v10-24-3-panel-overflow.mjs
          fi
      - name: Testes
        run: npm test
      - name: Auditoria
        run: AUDIT_ALLOW_ANY_ROOT=1 npm run audit
      - name: Commitar resultado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json public src tests
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Corrigir textos cortados do painel v10.24.3'
          git push origin HEAD:fix/v10-24-3-panel-overflow
