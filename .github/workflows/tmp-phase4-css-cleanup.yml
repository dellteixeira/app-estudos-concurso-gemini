name: Temporary Phase 4 CSS Cleanup

on:
  push:
    branches:
      - refactor/css-consolidation-phase-4

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/css-consolidation-phase-4

      - name: Consolidate legacy responsive ownership
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/css/base.css';
          let css = fs.readFileSync(path, 'utf8');

          const replacements = [
            [
              '#app-dashboard { display: none; max-width: 1300px; margin: 0 auto; padding: 1.5rem; width: 100%; }',
              '#app-dashboard { display: none; margin: 0 auto; width: 100%; }'
            ],
            [
              '.action-bar { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; width: 100%; }',
              '.action-bar { margin-bottom: 1.5rem; width: 100%; }'
            ],
            [
              '.grid-top { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }',
              '.grid-top { margin-bottom: 1.5rem; }'
            ]
          ];

          for (const [before, after] of replacements) {
            const count = css.split(before).length - 1;
            if (count !== 1) {
              throw new Error(`Expected exactly one legacy block, found ${count}: ${before}`);
            }
            css = css.replace(before, after);
          }

          fs.writeFileSync(path, css);

          const test = `const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');
const path = require('node:path');

const root = path.resolve(__dirname, '..');
const base = fs.readFileSync(path.join(root, 'public/css/base.css'), 'utf8');
const responsive = fs.readFileSync(path.join(root, 'public/css/responsive-system.css'), 'utf8');

test('phase 4 keeps responsive layout ownership in responsive-system.css', () => {
  assert.doesNotMatch(base, /#app-dashboard\\s*\\{[^}]*max-width\\s*:\\s*1300px/i);
  assert.doesNotMatch(base, /#app-dashboard\\s*\\{[^}]*padding\\s*:\\s*1\\.5rem/i);
  assert.doesNotMatch(base, /\\.grid-top\\s*\\{[^}]*grid-template-columns\\s*:\\s*1fr\\s+1fr/i);
  assert.doesNotMatch(base, /\\.action-bar\\s*\\{[^}]*display\\s*:\\s*flex/i);

  assert.match(responsive, /#app-dashboard\\s*\\{/);
  assert.match(responsive, /\\.grid-top\\s*\\{/);
  assert.match(responsive, /\\.action-bar\\s*\\{/);
});

test('phase 4 preserves specialized PDF layout isolation', () => {
  assert.doesNotMatch(responsive, /\\.pdf-library-actions[^\\n]*,/);
  assert.doesNotMatch(responsive, /\\.pdf-reader[^\\n]*,/);
});
`;
          fs.writeFileSync('tests/css-consolidation-phase4.test.cjs', test);
          NODE

      - name: Remove temporary workflow
        run: git rm .github/workflows/tmp-phase4-css-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/css/base.css tests/css-consolidation-phase4.test.cjs
          git commit -m "Consolidar ownership responsivo legado da Fase 4"
          git push
