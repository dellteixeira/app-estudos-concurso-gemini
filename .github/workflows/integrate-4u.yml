name: Integrate phase 4U

on:
  push:
    branches:
      - feat/offline-metadata-ring2-promoted-stability-v10.53.0
    paths:
      - '.github/workflows/integrate-4u.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/offline-metadata-ring2-promoted-stability-v10.53.0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Integrate ring-2 promoted stability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}')
              if count == 0:
                  raise SystemExit(f'{path}: integration anchor not found')
              p.write_text(text.replace(old, new))

          # AppState: load 4U after 4T and before expansion.
          replace_exact(
              'public/js/app-state.js',
              "        if (!global.OfflineSyncMetadataRing2Promotion) await loadExtensionScript('./js/core/offline-sync-metadata-ring2-promotion.js?v=10.52.0', 'offline-sync-metadata-ring2-promotion');\n        global.OfflineSyncMetadataRing2Promotion?.install?.();\n        if (!global.OfflineSyncMetadataExpansion) await loadExtensionScript('./js/core/offline-sync-metadata-expansion.js?v=10.52.0', 'offline-sync-metadata-expansion');",
              "        if (!global.OfflineSyncMetadataRing2Promotion) await loadExtensionScript('./js/core/offline-sync-metadata-ring2-promotion.js?v=10.52.0', 'offline-sync-metadata-ring2-promotion');\n        global.OfflineSyncMetadataRing2Promotion?.install?.();\n        if (!global.OfflineSyncMetadataRing2PromotedStability) await loadExtensionScript('./js/core/offline-sync-metadata-ring2-promoted-stability.js?v=10.52.0', 'offline-sync-metadata-ring2-promoted-stability');\n        global.OfflineSyncMetadataRing2PromotedStability?.install?.();\n        if (!global.OfflineSyncMetadataExpansion) await loadExtensionScript('./js/core/offline-sync-metadata-expansion.js?v=10.52.0', 'offline-sync-metadata-expansion');",
              1
          )
          replace_exact(
              'public/js/app-state.js',
              "            metadataRing2Promotion:global.OfflineSyncMetadataRing2Promotion?.getDiagnostics?.() || null,\n            metadataExpansion:global.OfflineSyncMetadataExpansion?.getDiagnostics?.() || null,",
              "            metadataRing2Promotion:global.OfflineSyncMetadataRing2Promotion?.getDiagnostics?.() || null,\n            metadataRing2PromotedStability:global.OfflineSyncMetadataRing2PromotedStability?.getDiagnostics?.() || null,\n            metadataExpansion:global.OfflineSyncMetadataExpansion?.getDiagnostics?.() || null,",
              1
          )
          replace_exact(
              'public/js/app-state.js',
              "        getOfflineSyncMetadataRing2PromotionDiagnostics:() => global.OfflineSyncMetadataRing2Promotion?.getDiagnostics?.() || null,\n        getOfflineSyncMetadataExpansionDiagnostics:() => global.OfflineSyncMetadataExpansion?.getDiagnostics?.() || null,",
              "        getOfflineSyncMetadataRing2PromotionDiagnostics:() => global.OfflineSyncMetadataRing2Promotion?.getDiagnostics?.() || null,\n        getOfflineSyncMetadataRing2PromotedStabilityDiagnostics:() => global.OfflineSyncMetadataRing2PromotedStability?.getDiagnostics?.() || null,\n        getOfflineSyncMetadataExpansionDiagnostics:() => global.OfflineSyncMetadataExpansion?.getDiagnostics?.() || null,",
              1
          )

          # Governed asset manifest: critical shell + network-first + worker/header lists.
          replace_exact(
              'config/app-assets.json',
              '"/js/core/offline-sync-metadata-ring2-promotion.js", "/js/core/offline-sync-metadata-expansion.js"',
              '"/js/core/offline-sync-metadata-ring2-promotion.js", "/js/core/offline-sync-metadata-ring2-promoted-stability.js", "/js/core/offline-sync-metadata-expansion.js"',
              4
          )

          # Service worker shell and network-first core assets.
          replace_exact(
              'public/sw.js',
              "'./js/core/offline-sync-metadata-ring2-promotion.js', './js/core/offline-sync-metadata-expansion.js'",
              "'./js/core/offline-sync-metadata-ring2-promotion.js', './js/core/offline-sync-metadata-ring2-promoted-stability.js', './js/core/offline-sync-metadata-expansion.js'",
              1
          )
          replace_exact(
              'public/sw.js',
              "'/js/core/offline-sync-metadata-ring2-promotion.js', '/js/core/offline-sync-metadata-expansion.js'",
              "'/js/core/offline-sync-metadata-ring2-promotion.js', '/js/core/offline-sync-metadata-ring2-promoted-stability.js', '/js/core/offline-sync-metadata-expansion.js'",
              1
          )

          # Worker no-store policy.
          replace_exact(
              'src/worker.js',
              "  '/js/core/offline-sync-metadata-ring2-promotion.js',\n  '/js/core/offline-sync-metadata-expansion.js',",
              "  '/js/core/offline-sync-metadata-ring2-promotion.js',\n  '/js/core/offline-sync-metadata-ring2-promoted-stability.js',\n  '/js/core/offline-sync-metadata-expansion.js',",
              1
          )

          # Static headers no-store policy.
          replace_exact(
              'public/_headers',
              "/js/core/offline-sync-metadata-ring2-promotion.js\n  Cache-Control: no-cache, no-store, must-revalidate\n\n/js/core/offline-sync-metadata-expansion.js",
              "/js/core/offline-sync-metadata-ring2-promotion.js\n  Cache-Control: no-cache, no-store, must-revalidate\n\n/js/core/offline-sync-metadata-ring2-promoted-stability.js\n  Cache-Control: no-cache, no-store, must-revalidate\n\n/js/core/offline-sync-metadata-expansion.js",
              1
          )
          PY

      - name: Validate 4U integration
        run: |
          test "$(node -p "require('./package.json').version")" = "10.52.0"
          node --test tests/offline-sync-metadata-ring2-promoted-stability.test.cjs
          npm test

      - name: Commit integration and self-clean
        run: |
          rm .github/workflows/integrate-4u.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/js/app-state.js public/js/core/offline-sync-metadata-ring2-promoted-stability.js config/app-assets.json public/sw.js public/_headers src/worker.js tests/offline-sync-metadata-ring2-promoted-stability.test.cjs docs/phase-4u-ring2-promoted-stability.md .github/workflows/integrate-4u.yml
          git commit -m 'feat(sync): integrate phase 4U ring-2 promoted stability'
          git push origin HEAD:feat/offline-metadata-ring2-promoted-stability-v10.53.0
