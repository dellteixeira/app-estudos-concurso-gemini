name: Apply Sync Worker No-Store Patch

on:
  push:
    branches: [feature/sync-engine-app-state]
    paths:
      - 'scripts/patch-sync-worker-nostore.mjs'
      - '.github/workflows/apply-sync-worker-nostore.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/sync-engine-app-state
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - run: node scripts/patch-sync-worker-nostore.mjs
      - name: Remove temporary patch machinery
        run: git rm scripts/patch-sync-worker-nostore.mjs .github/workflows/apply-sync-worker-nostore.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.js
          git commit -m 'fix: align Worker no-store paths with sync architecture'
          git push origin HEAD:feature/sync-engine-app-state
