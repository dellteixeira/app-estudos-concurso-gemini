name: Diagnose v10.38 Tests

on:
  push:
    branches:
      - feat/offline-metadata-rollout-v10.38.0
    paths:
      - .github/workflows/diagnose-v10-38-tests.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Capture automated test output
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          code=$?
          echo "$code" > test-exit-code.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v10-38-test-diagnostics-${{ github.run_id }}
          path: |
            test-output.txt
            test-exit-code.txt
          if-no-files-found: error
          retention-days: 1
