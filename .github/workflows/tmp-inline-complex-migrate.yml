name: Temporary Inline Complex Migration

on:
  push:
    branches:
      - hardening/inline-debt-complex-handlers

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hardening/inline-debt-complex-handlers
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Migrate complex inline handlers
        run: node scripts/tmp-migrate-complex-inline-handlers.mjs
      - name: Validate generated JavaScript
        run: node --check public/js/app-ui.js
      - name: Remove one-use migration tooling
        run: |
          git rm scripts/tmp-migrate-complex-inline-handlers.mjs
          git rm .github/workflows/tmp-inline-complex-migrate.yml
      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/js/app-ui.js scripts/audit-inline-csp.mjs tests/inline-handler-externalization.test.cjs
          git diff --cached --quiet && exit 1
          git commit -m "Externalizar handlers inline complexos"
          git push origin HEAD:hardening/inline-debt-complex-handlers
