name: Finalize v10.51.0 identity

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/offline-metadata-ring2-stability-v10.51.0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/offline-metadata-ring2-stability-v10.51.0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Synchronize release identity contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files = [
              'config/app-assets.json',
              'public/js/app-pwa.js',
              'tests/learning-advisor.test.cjs',
              'tests/offline-sync-authority.test.cjs',
              'tests/offline-sync-edital-graduation.test.cjs',
              'tests/offline-sync-metadata-authority.test.cjs',
              'tests/offline-sync-metadata-expanded-promotion.test.cjs',
              'tests/offline-sync-metadata-expanded-stability.test.cjs',
              'tests/offline-sync-metadata-expansion.test.cjs',
              'tests/offline-sync-metadata-graduation.test.cjs',
              'tests/offline-sync-metadata-population-promoted-stability.test.cjs',
              'tests/offline-sync-metadata-population-promotion.test.cjs',
              'tests/offline-sync-metadata-promoted-stability.test.cjs',
              'tests/offline-sync-metadata-rollout.test.cjs',
              'tests/offline-sync-metadata-shadow.test.cjs',
              'tests/offline-sync-metadata-stability.test.cjs',
              'tests/offline-sync-shadow.test.cjs',
          ]
          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('10.50.1', '10.51.0')
              text = text.replace(r'10\.50\.1', r'10\.51\.0')
              path.write_text(text, encoding='utf-8')
          Path('public/version.json').write_text(json.dumps({
              'version':'10.51.0',
              'build':'source',
              'commit':'source'
          }, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify release identity contracts
        run: |
          if grep -RIn --exclude-dir=.git --include='*.js' --include='*.cjs' --include='*.json' '10\.50\.1' public config tests; then
            echo 'Stale v10.50.1 reference remains in runtime/test contract.' >&2
            exit 1
          fi
          node tests/deploy-identity.test.cjs

      - name: Capture complete automated test suite
        id: tests
        shell: bash
        run: |
          set +e
          npm test > post-cleanup-npm-test-output.txt 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload post-cleanup diagnostics
        if: steps.tests.outputs.code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: v10-51-post-cleanup-diagnostics
          path: post-cleanup-npm-test-output.txt
          if-no-files-found: error

      - name: Require complete test success
        if: steps.tests.outputs.code != '0'
        run: exit 1

      - name: Commit cleanup and remove temporary workflow
        if: steps.tests.outputs.code == '0'
        run: |
          rm .github/workflows/diagnose-v10-51-tests.yml
          rm -f post-cleanup-npm-test-output.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(release): finalize v10.51.0 identity'
          git push origin HEAD:feat/offline-metadata-ring2-stability-v10.51.0
