name: Publish v10.25.1 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create canonical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v10.25.1 >/dev/null 2>&1; then
            echo "Release v10.25.1 already exists."
          else
            gh release create v10.25.1 \
              --target d87850e2b1f337cb549978f087f5b2fe334ee0d9 \
              --title "V10.25.1 — Backup Canônico" \
              --notes "Backup canônico da versão estável 10.25.1. Inclui correções de IA rápida nos flashcards e carregamento global da Biblioteca. Commit: d87850e2b1f337cb549978f087f5b2fe334ee0d9."
          fi
