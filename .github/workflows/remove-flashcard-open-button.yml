name: Remove Flashcard Open Button

on:
  push:
    branches: [fix/remove-flashcard-open-button]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/remove-flashcard-open-button
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Apply UI change and release bump
        shell: node {0}
        run: |
          const fs = require('fs');
          const oldVersion = '10.64.30';
          const nextVersion = '10.64.31';
          const nextCode = 106433;

          const corePath = 'public/js/app-core.js';
          let core = fs.readFileSync(corePath, 'utf8');
          const button = /\s*<button type=\"button\" class=\"btn btn-primary btn-sm\" onclick=\"event\.stopPropagation\(\); setFlashcardViewFilter\(decodeURIComponent\('\$\{safeMatHandler\}'\), ''\)\" title=\"Abrir caixa desta matéria\" aria-label=\"Abrir caixa de \$\{escapeHtml\(matName\)\}\">Abrir Caixa<\/button>/;
          if (!button.test(core)) throw new Error('flashcard open button anchor not found');
          core = core.replace(button, '');
          fs.writeFileSync(corePath, core);

          const cssPath = 'public/css/base.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          css = css.replace('.anki-folder-actions .anki-folder-count,.anki-folder-actions .btn{flex:0 0 auto;white-space:nowrap;}', '.anki-folder-actions .anki-folder-count{flex:0 0 auto;white-space:nowrap;}');
          fs.writeFileSync(cssPath, css);

          const testPath = 'tests/flashcard-box-actions-layout.test.cjs';
          fs.writeFileSync(testPath, `const test = require('node:test');\nconst assert = require('node:assert/strict');\nconst fs = require('node:fs');\n\nconst core = fs.readFileSync('public/js/app-core.js', 'utf8');\nconst css = fs.readFileSync('public/css/base.css', 'utf8');\n\ntest('flashcard folder keeps only the card count in the action row', () => {\n  assert.match(core, /class=\\\"anki-folder-actions\\\"/);\n  assert.match(core, /class=\\\"anki-folder-count\\\">\\$\\{matData\\.total\\} cartões<\\/span>/);\n  assert.doesNotMatch(core, />Abrir Caixa<\\/button>/);\n  assert.doesNotMatch(core, /<span>\\$\\{isOpen \\? 'Fechar' : 'Abrir'\\}<\\/span>/);\n  assert.match(css, /\\.anki-folder-actions\\{[^}]*display:flex;[^}]*flex-direction:row;[^}]*flex-wrap:nowrap;[^}]*align-items:center;[^}]*gap:10px;[^}]*justify-content:flex-end;/);\n});\n\ntest('flashcard folder header remains the control that opens and closes the box', () => {\n  assert.match(core, /class=\\\"anki-folder-header\\\" onclick=\\\"toggleFcFolder\\(decodeURIComponent\\('\\$\\{safeMatHandler\\}'\\)\\)\\\"/);\n});\n`);

          const replaceIn = (file, from, to) => {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(from)) throw new Error(`${file}: expected token not found: ${from}`);
            fs.writeFileSync(file, text.replaceAll(from, to));
          };

          const contractPath = 'config/release-contract.json';
          const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          contract.version = nextVersion;
          contract.android.versionCode = nextCode;
          fs.writeFileSync(contractPath, JSON.stringify(contract, null, 2) + '\n');

          for (const file of ['package.json','package-lock.json','public/version.json','config/app-assets.json','src/index.js','public/sw.js','public/index.html','public/js/app-pwa.js','public/js/ui/navigation.js']) {
            replaceIn(file, oldVersion, nextVersion);
          }

          let gradle = fs.readFileSync('android/app/build.gradle', 'utf8');
          gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${nextCode}`);
          gradle = gradle.replace(/versionName\s+\"[^\"]+\"/, `versionName \"${nextVersion}-mobile.1\"`);
          fs.writeFileSync('android/app/build.gradle', gradle);

          const oldResponsive = `public/css/responsive-polish-v${oldVersion}.css`;
          const newResponsive = `public/css/responsive-polish-v${nextVersion}.css`;
          if (!fs.existsSync(oldResponsive)) throw new Error(`missing source CSS: ${oldResponsive}`);
          fs.copyFileSync(oldResponsive, newResponsive);

          const headersPath = 'public/_headers';
          let headers = fs.readFileSync(headersPath, 'utf8');
          const rule = `/css/responsive-polish-v${nextVersion}.css\n  Cache-Control: public, max-age=31536000, immutable`;
          if (!headers.includes(rule)) headers = `${headers.trimEnd()}\n\n${rule}\n`;
          fs.writeFileSync(headersPath, headers);
      - name: Syntax checks
        run: |
          node --check public/js/app-core.js
          node --check public/js/app-ui.js
      - name: Focused layout test
        run: node --test tests/flashcard-box-actions-layout.test.cjs
      - name: Release contract
        run: node scripts/release-contract.mjs check
      - name: Full tests
        run: npm test
      - name: Structural audit
        run: npm run audit
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/js/app-core.js public/css/base.css tests/flashcard-box-actions-layout.test.cjs config/release-contract.json package.json package-lock.json public/version.json config/app-assets.json src/index.js public/sw.js public/index.html public/js/app-pwa.js public/js/ui/navigation.js android/app/build.gradle public/css/responsive-polish-v10.64.31.css public/_headers
          if ! git diff --cached --quiet; then
            git commit -m "fix(ui): remover botão abrir caixa dos flashcards"
            git push origin HEAD:fix/remove-flashcard-open-button
          fi
