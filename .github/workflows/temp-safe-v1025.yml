name: Temporary Safe V10.25 Migration
on:
  push:
    branches: [feature/v10-25-library-ai-models-safe]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          marker = Path('tests/v10-25-library-ai-models.test.cjs')
          if marker.exists():
              print('V10.25 migration already applied; no-op.')
              raise SystemExit(0)

          # --- Biblioteca: refresh deduplicado + Cards/Lista persistente ---
          p = Path('public/js/pdf/pdf-library-ui.js')
          s = p.read_text()
          old = "let state={docs:[],workspaces:[],scope:'global',activeWorkspace:'',activeMateria:'',activeAssunto:'',search:'',initializedFor:'',loadSeq:0};"
          new = old + "\nconst LIBRARY_VIEW_KEY='pdfLibraryViewMode';\nlet activationPromise=null,lastActivationAt=0;"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          anchor = "async function initialize(force=false){"
          insert = r'''function ensureLibraryViewStyles(){if($('pdfLibraryViewStyles'))return;const el=document.createElement('style');el.id='pdfLibraryViewStyles';el.textContent=`.pdf-library-view-toggle{display:flex;gap:4px;align-items:center;min-height:48px;padding:4px;border:1px solid var(--border-color,#29445d);border-radius:12px;background:rgba(7,25,41,.55)}.pdf-library-view-toggle button{border:0;border-radius:9px;background:transparent;color:var(--text-muted,#9fb2c6);padding:9px 11px;font:inherit;font-weight:650;cursor:pointer;white-space:nowrap}.pdf-library-view-toggle button.active{background:var(--accent-color,#55ddd2);color:#06202b}.pdf-library-grid.pdf-library-list-view{display:flex!important;flex-direction:column!important;gap:10px!important}.pdf-library-grid.pdf-library-list-view .pdf-library-card{width:100%!important;max-width:none!important;display:grid!important;grid-template-columns:minmax(200px,1.7fr) minmax(150px,1fr) minmax(220px,auto);grid-template-areas:'top top top' 'title context actions' 'workspace meta actions' 'progress progress actions';column-gap:16px;align-items:center;padding:15px 17px}.pdf-library-grid.pdf-library-list-view .pdf-card-top{grid-area:top}.pdf-library-grid.pdf-library-list-view h4{grid-area:title;margin:0}.pdf-library-grid.pdf-library-list-view .pdf-card-context{grid-area:context;margin:0}.pdf-library-grid.pdf-library-list-view .pdf-card-workspace{grid-area:workspace;margin:0}.pdf-library-grid.pdf-library-list-view .pdf-progress-line{grid-area:progress;margin-top:6px}.pdf-library-grid.pdf-library-list-view .pdf-card-meta{grid-area:meta}.pdf-library-grid.pdf-library-list-view .pdf-card-actions{grid-area:actions;justify-content:flex-end}@media(max-width:700px){.pdf-library-view-toggle{width:100%;grid-column:1/-1}.pdf-library-view-toggle button{flex:1}.pdf-library-grid.pdf-library-list-view .pdf-library-card{display:block!important}.pdf-library-grid.pdf-library-list-view .pdf-card-actions{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.pdf-library-grid.pdf-library-list-view .pdf-card-actions .btn{width:100%;min-width:0}}`;document.head.appendChild(el)}
function getLibraryViewMode(){try{return localStorage.getItem(LIBRARY_VIEW_KEY)==='list'?'list':'cards'}catch(_){return'cards'}}
function applyLibraryViewMode(mode=getLibraryViewMode()){mode=mode==='list'?'list':'cards';try{localStorage.setItem(LIBRARY_VIEW_KEY,mode)}catch(_){}const grid=$('pdfLibraryGrid');grid?.classList.toggle('pdf-library-list-view',mode==='list');document.querySelectorAll('#pdfLibraryViewToggle button[data-view]').forEach(btn=>{const active=btn.dataset.view===mode;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',active?'true':'false')})}
function ensureLibraryViewToggle(){ensureLibraryViewStyles();const assunto=$('pdfAssuntoFilter');if(!assunto)return;let wrap=$('pdfLibraryViewToggle');if(!wrap){wrap=document.createElement('div');wrap.id='pdfLibraryViewToggle';wrap.className='pdf-library-view-toggle';wrap.setAttribute('aria-label','Modo de visualização da Biblioteca');wrap.innerHTML='<button type="button" data-view="cards" aria-label="Visualizar em cards">▦ Cards</button><button type="button" data-view="list" aria-label="Visualizar em lista">☰ Lista</button>';wrap.addEventListener('click',event=>{const btn=event.target.closest('button[data-view]');if(btn)applyLibraryViewMode(btn.dataset.view)});assunto.insertAdjacentElement('afterend',wrap)}applyLibraryViewMode()}
async function activateLibrary(){ensureLibraryViewToggle();applyLibraryViewMode();if(activationPromise)return activationPromise;const now=Date.now();if(now-lastActivationAt<220)return;lastActivationAt=now;activationPromise=initialize(false).finally(()=>{activationPromise=null;ensureLibraryViewToggle();applyLibraryViewMode()});return activationPromise}
'''
          assert s.count(anchor) == 1
          s = s.replace(anchor, insert + anchor, 1)
          old_export = "global.PdfStudyLibraryUI=Object.freeze({initialize,refresh:refreshLibrary,getCurrentContest:contest,onTabActivated:()=>initialize(false),"
          new_export = "global.PdfStudyLibraryUI=Object.freeze({initialize,refresh:refreshLibrary,getCurrentContest:contest,onTabActivated:activateLibrary,setViewMode:applyLibraryViewMode,"
          assert s.count(old_export) == 1
          s = s.replace(old_export, new_export, 1)
          old_click = "if(oc.includes(\"switchTab('tab-biblioteca'\"))requestAnimationFrame(()=>requestAnimationFrame(()=>{tuneLibraryUiV1024();scrollLibraryStartV1024()}));"
          new_click = "if(oc.includes(\"switchTab('tab-biblioteca'\"))requestAnimationFrame(()=>requestAnimationFrame(()=>{tuneLibraryUiV1024();scrollLibraryStartV1024();window.PdfStudyLibraryUI?.onTabActivated?.()}));"
          assert s.count(old_click) == 1
          s = s.replace(old_click, new_click, 1)
          p.write_text(s)

          # --- Reader: seletor de modelos integrado ao fluxo existente ---
          p = Path('public/js/pdf/pdf-reader.js')
          s = p.read_text()
          top = "const $=id=>document.getElementById(id),core=()=>global.PdfStudyCore,ann=()=>global.PdfStudyAnnotations;"
          repl = top + "\nconst FLASHCARD_AI_MODEL_KEY='pdfFlashcardAiModel';\nconst FLASHCARD_AI_MODEL_OPTIONS=[['auto','Automático — recomendado'],['gemma','Gemma 4 26B — equilíbrio'],['nemotron','Nemotron 3 120B — elaborado'],['glm','GLM-4.7 Flash — rápido'],['llama','Llama 3.1 8B Fast — econômico']];"
          assert s.count(top) == 1
          s = s.replace(top, repl, 1)
          start = s.index('async function enhanceFlashcardWithAI(){')
          end = s.index('\nasync function openFlashcardComposer()', start)
          enhanced = r'''function ensureFlashcardAiModelSelector(){if($('pdfFlashcardAiModel'))return;const button=$('pdfFlashcardAiButton');if(!button)return;let saved='auto';try{saved=localStorage.getItem(FLASHCARD_AI_MODEL_KEY)||'auto'}catch(_){}if(!FLASHCARD_AI_MODEL_OPTIONS.some(([value])=>value===saved))saved='auto';const wrap=document.createElement('div');wrap.className='pdf-flashcard-ai-model-wrap';wrap.style.cssText='display:grid;gap:6px;margin:10px 0 4px;text-align:left';wrap.innerHTML='<label for="pdfFlashcardAiModel" style="color:#8dc8e7;font-weight:700;font-size:.88rem">Modelo de IA</label><select id="pdfFlashcardAiModel" style="width:100%;min-height:44px;border:1px solid #294b64;border-radius:11px;background:#071d2d;color:#e8f3ff;padding:0 12px;font:inherit">'+FLASHCARD_AI_MODEL_OPTIONS.map(([value,label])=>`<option value="${value}"${value===saved?' selected':''}>${label}</option>`).join('')+'</select><small style="color:#8fa9bc;line-height:1.35">Automático prioriza qualidade e usa fallback se o modelo principal estiver indisponível.</small>';const statusEl=$('pdfFlashcardAiStatus');(statusEl||button).insertAdjacentElement('beforebegin',wrap);$('pdfFlashcardAiModel')?.addEventListener('change',event=>{try{localStorage.setItem(FLASHCARD_AI_MODEL_KEY,event.target.value)}catch(_){}})}
async function enhanceFlashcardWithAI(){if(!flashcardDraft)return;ensureFlashcardAiModelSelector();const statusEl=$('pdfFlashcardAiStatus'),button=$('pdfFlashcardAiButton'),answerEl=$('pdfFlashcardAnswer'),questionEl=$('pdfFlashcardQuestion'),model=$('pdfFlashcardAiModel')?.value||'auto';const source=String(flashcardDraft.text||answerEl?.value||'').replace(/\s+/g,' ').trim();if(!source){if(statusEl)statusEl.textContent='Selecione um trecho no PDF ou escreva o conteúdo-base na resposta antes de gerar com IA.';answerEl?.focus();return}if(statusEl)statusEl.textContent='IA analisando conceito, regra, exceções, requisitos e pegadinhas…';if(button)button.disabled=true;try{const client=core().getSupabaseClient(),{data}=await client.auth.getSession(),token=data?.session?.access_token;if(!token)throw new Error('Sessão indisponível');const response=await fetch('/api/ai/flashcard',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({text:source,existingQuestion:questionEl?.value||'',model,materia:$('pdfFlashcardMateria')?.value||'',assunto:$('pdfFlashcardAssunto')?.value||''})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||'IA temporariamente indisponível');if(!flashcardDraft)return;if(result.question&&questionEl)questionEl.value=result.question;if(result.answer&&answerEl)answerEl.value=result.answer;if(statusEl)statusEl.textContent=`Gerado com ${result.model||'Workers AI'}${result.fallbackUsed?' · fallback automático utilizado':''}. Revise e edite antes de salvar.`}catch(e){if(statusEl)statusEl.textContent=`Não foi possível gerar com IA agora: ${e.message}. Você pode continuar criando o flashcard manualmente.`}finally{if(button)button.disabled=false}}
'''
          s = s[:start] + enhanced + s[end:]
          old_open = "$('modalPdfFlashcard').style.display='flex';const aiButton=$('pdfFlashcardAiButton'),aiStatus=$('pdfFlashcardAiStatus');"
          new_open = "$('modalPdfFlashcard').style.display='flex';ensureFlashcardAiModelSelector();const aiButton=$('pdfFlashcardAiButton'),aiStatus=$('pdfFlashcardAiStatus');"
          assert s.count(old_open) == 1
          s = s.replace(old_open, new_open, 1)
          p.write_text(s)

          # --- Worker: multi-modelo com whitelist e fallback no modo Automático ---
          p = Path('src/index.js')
          s = p.read_text()
          model_line = 'const MODEL = "@cf/meta/llama-3.1-8b-instruct-fast";'
          add = model_line + '''\nconst FLASHCARD_AI_MODELS = Object.freeze({\n  gemma: { id: "@cf/google/gemma-4-26b-a4b-it", label: "Gemma 4 26B" },\n  nemotron: { id: "@cf/nvidia/nemotron-3-120b-a12b", label: "Nemotron 3 120B" },\n  glm: { id: "@cf/zai-org/glm-4.7-flash", label: "GLM-4.7 Flash" },\n  llama: { id: "@cf/meta/llama-3.1-8b-instruct-fast", label: "Llama 3.1 8B Fast" }\n});\nconst FLASHCARD_AUTO_CHAIN = ["gemma", "glm", "llama"];'''
          assert s.count(model_line) == 1
          s = s.replace(model_line, add, 1)
          start = s.index('async function generateFlashcard(request, env) {')
          end = s.index('\n\nexport default', start)
          generator = r'''async function generateFlashcard(request, env) {
  const user = await authenticateSupabaseUser(request, env);
  if (!user?.id) return json({ error: "Sessão inválida ou expirada." }, 401);
  if (env.AI_RATE_LIMITER?.limit) {
    const { success } = await env.AI_RATE_LIMITER.limit({ key: `${user.id}:flashcard` });
    if (!success) return json({ error: "Muitas gerações em sequência. Aguarde um minuto." }, 429);
  }
  let body;
  try { body = await request.json(); } catch { return json({ error: "Corpo JSON inválido." }, 400); }
  const text = cleanText(body?.text, 12000);
  const existingQuestion = cleanText(body?.existingQuestion, 500);
  const materia = cleanText(body?.materia, 180);
  const assunto = cleanText(body?.assunto, 300);
  const requested = String(body?.model || "auto").toLowerCase();
  if (text.length < 8) return json({ error: "Selecione um trecho mais completo." }, 422);
  if (requested !== "auto" && !FLASHCARD_AI_MODELS[requested]) return json({ error: "Modelo de IA inválido." }, 400);

  const candidates = requested === "auto" ? FLASHCARD_AUTO_CHAIN : [requested];
  const systemPrompt = `Você é um especialista sênior em aprendizagem ativa e elaboração de flashcards para concursos públicos brasileiros. Trabalhe EXCLUSIVAMENTE com o trecho-fonte recebido: não invente, não complemente com conhecimento externo e não altere o sentido jurídico. Identifique silenciosamente a unidade de conhecimento central e classifique-a, quando aplicável, como conceito, regra, exceção, requisito, prazo, competência, consequência, comparação, causa/efeito ou pegadinha. Gere UM flashcard atômico e de alta qualidade. A pergunta deve ser autossuficiente, específica, inequívoca, exigir recuperação ativa e evitar formatos vagos ou de sim/não. Preserve na resposta condições, exceções, números, prazos e termos jurídicos essenciais. Se houver matéria/assunto, use-os apenas para contextualização, nunca para acrescentar fatos. Retorne somente JSON válido no formato {"question":"...","answer":"..."}.`;
  const userPrompt = `MATÉRIA (opcional): ${materia || "não informada"}\nASSUNTO (opcional): ${assunto || "não informado"}\nPERGUNTA ATUAL (opcional; melhore se útil): ${existingQuestion || "não fornecida"}\n\nTRECHO-FONTE:\n${text}`;
  const errors = [];

  for (let index = 0; index < candidates.length; index++) {
    const key = candidates[index];
    const model = FLASHCARD_AI_MODELS[key];
    try {
      const result = await env.AI.run(model.id, {
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: userPrompt }
        ],
        temperature: 0.1,
        max_tokens: 1600
      });
      const parsed = parseFlashcardAIResponse(result);
      const question = cleanText(parsed?.question, 500), answer = cleanText(parsed?.answer, 4000);
      if (!question || !answer) throw new Error("Resposta incompleta da IA");
      return json({ question, answer, model: `Workers AI · ${model.label}`, modelKey: key, fallbackUsed: requested === "auto" && index > 0 });
    } catch (error) {
      errors.push(`${model.label}: ${error?.message || error}`);
      console.warn("Workers AI flashcard model failed", model.id, error);
    }
  }
  console.error("Workers AI flashcard exhausted candidates", errors);
  return json({ error: "Não foi possível gerar a pergunta com IA agora. O modo manual continua disponível." }, 503);
}
'''
          s = s[:start] + generator + s[end:]
          s = s.replace('const APP_VERSION = "10.24.11";', 'const APP_VERSION = "10.25.0";', 1)
          p.write_text(s)

          # --- Versão PWA sincronizada ---
          p = Path('public/sw.js'); s = p.read_text(); assert "const APP_VERSION = '10.24.11';" in s; p.write_text(s.replace("const APP_VERSION = '10.24.11';", "const APP_VERSION = '10.25.0';", 1))
          p = Path('package.json'); data = json.loads(p.read_text()); data['version']='10.25.0'; p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          p = Path('public/version.json'); data = json.loads(p.read_text()); data['version']='10.25.0'; data['build']='2026-08-21T00:40:00.000Z'; p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')

          # --- Teste de regressão: app-pwa deve permanecer intacto funcionalmente ---
          marker.write_text(r'''const test=require('node:test');
const assert=require('node:assert/strict');
const fs=require('node:fs');
const read=p=>fs.readFileSync(p,'utf8');
test('V10.25 preserva PWA e implementa Biblioteca/IA multi-modelo com segurança',()=>{
  const library=read('public/js/pdf/pdf-library-ui.js');
  const reader=read('public/js/pdf/pdf-reader.js');
  const worker=read('src/index.js');
  const pwa=read('public/js/app-pwa.js');
  assert.match(library,/LIBRARY_VIEW_KEY='pdfLibraryViewMode'/);
  assert.match(library,/onTabActivated:activateLibrary/);
  assert.match(library,/pdfLibraryViewToggle/);
  assert.match(reader,/FLASHCARD_AI_MODEL_OPTIONS/);
  assert.match(reader,/pdfFlashcardAiModel/);
  assert.match(worker,/@cf\/google\/gemma-4-26b-a4b-it/);
  assert.match(worker,/@cf\/nvidia\/nemotron-3-120b-a12b/);
  assert.match(worker,/@cf\/zai-org\/glm-4\.7-flash/);
  assert.match(worker,/FLASHCARD_AUTO_CHAIN = \["gemma", "glm", "llama"\]/);
  assert.match(pwa,/window\.switchTab = switchTab/);
  assert.match(pwa,/window\.handleLogin = handleLogin/);
  assert.match(pwa,/window\.installPwaApp = installPwaApp/);
  assert.ok(pwa.length>10000,'app-pwa.js não pode ser truncado');
  assert.equal(JSON.parse(read('package.json')).version,'10.25.0');
  assert.equal(JSON.parse(read('public/version.json')).version,'10.25.0');
});
''')
          PY
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit
      - name: Commit safe migration
        run: |
          if git diff --quiet && git status --porcelain | grep -qv '^??'; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/js/pdf/pdf-library-ui.js public/js/pdf/pdf-reader.js src/index.js public/sw.js package.json public/version.json tests/v10-25-library-ai-models.test.cjs
          git commit -m 'feat: safe V10.25 library views and multi-model flashcard AI'
          git push
