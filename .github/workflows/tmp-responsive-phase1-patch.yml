name: Temporary Responsive Phase 1 Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'refactor/responsive-design-system-phase-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch app shell integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('public/index.html')
          text = index.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="./css/features.css">'
          addition = marker + '\n    <link rel="stylesheet" href="./css/responsive-system.css">'
          if './css/responsive-system.css' not in text:
              if marker not in text:
                  raise SystemExit('index marker not found')
              text = text.replace(marker, addition, 1)
              index.write_text(text, encoding='utf-8')

          sw = Path('public/sw.js')
          text = sw.read_text(encoding='utf-8')
          if './css/responsive-system.css' not in text:
              old = "'./css/base.css', './css/dashboard.css', './css/features.css', './css/pdf-library.css', './css/pdf-reader.css',"
              new = "'./css/base.css', './css/dashboard.css', './css/features.css', './css/responsive-system.css', './css/pdf-library.css', './css/pdf-reader.css',"
              if old not in text:
                  raise SystemExit('service worker CSS app-shell marker not found')
              text = text.replace(old, new, 1)
              sw.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/tmp-responsive-phase1-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/sw.js
          git commit -m 'Integrar sistema responsivo ao app shell'
          git push origin HEAD:${{ github.head_ref }}
