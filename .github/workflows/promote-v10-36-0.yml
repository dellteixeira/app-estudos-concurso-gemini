name: Promote v10.36.0

on:
  push:
    branches:
      - feat/offline-metadata-authority-v10.36.0
    paths:
      - .github/workflows/promote-v10-36-0.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/offline-metadata-authority-v10.36.0
          fetch-depth: 0

      - name: Promote release literals and remove helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('public'), Path('src'), Path('config'), Path('tests')]
          files = [Path('package.json')]
          for root in roots:
              for path in root.rglob('*'):
                  if path.is_file():
                      files.append(path)

          changed = []
          for path in files:
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace('10.35.0', '10.36.0').replace(r'10\.35\.0', r'10\.36\.0')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Promoted files:')
          for path in changed:
              print(path)
          if not changed:
              raise SystemExit('No v10.35.0 literals were promoted.')
          PY
          git rm .github/workflows/promote-v10-36-0.yml

      - name: Commit promoted identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public src config tests package.json .github/workflows/promote-v10-36-0.yml
          git commit -m "chore(release): promote v10.36.0"
          git push origin HEAD:feat/offline-metadata-authority-v10.36.0
