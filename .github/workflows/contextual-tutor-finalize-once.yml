name: Contextual Tutor Finalize Once
on:
  push:
    branches: [feat/contextual-ai-tutor-v1]
    paths: ['.github/workflows/contextual-tutor-finalize-once.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contextual-ai-tutor-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch canonical runtime contracts
        run: |
          python3 - <<'PY'
          import json,re,shutil
          from pathlib import Path
          OLD='10.64.22'; NEW='10.64.23'; CODE=106425
          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          c=json.loads(read('config/release-contract.json')); c['version']=NEW; c['android']['versionCode']=CODE; write('config/release-contract.json',json.dumps(c,ensure_ascii=False,indent=2)+'\n')
          p=json.loads(read('package.json')); p['version']=NEW; write('package.json',json.dumps(p,ensure_ascii=False,indent=2)+'\n')
          v=json.loads(read('public/version.json')); v['version']=NEW; write('public/version.json',json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          m=json.loads(read('config/app-assets.json')); m['version']=NEW
          route='/js/core/contextual-ai-tutor.js'
          for key in ['criticalAppShell','networkFirstPaths','workerNoStorePaths','headersNoStorePaths']:
            if route not in m[key]: m[key].append(route)
          m['criticalAppShell']=[x.replace(f'/css/responsive-polish-v{OLD}.css',f'/css/responsive-polish-v{NEW}.css') for x in m['criticalAppShell']]
          write('config/app-assets.json',json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          nav=read('public/js/ui/navigation.js').replace(OLD,NEW)
          needle="            if (!global.AppNextBestStudyAction) {\n                await loader.loadScript('./js/core/next-best-study-action.js', { async: false });\n            }\n"
          insert=needle+"            if (!global.AppContextualAiTutor) {\n                await loader.loadScript('./js/core/contextual-ai-tutor.js', { async: false });\n            }\n"
          if 'AppContextualAiTutor' not in nav:
            assert needle in nav
            nav=nav.replace(needle,insert)
          write('public/js/ui/navigation.js',nav)
          sw=read('public/sw.js').replace("const APP_VERSION = '"+OLD+"';","const APP_VERSION = '"+NEW+"';").replace(f'responsive-polish-v{OLD}.css',f'responsive-polish-v{NEW}.css')
          sw=sw.replace("'./js/core/exam-board-intelligence.js'", "'./js/core/exam-board-intelligence.js', './js/core/contextual-ai-tutor.js'") if "'./js/core/contextual-ai-tutor.js'" not in sw else sw
          sw=sw.replace("'/js/core/exam-board-intelligence.js'", "'/js/core/exam-board-intelligence.js', '/js/core/contextual-ai-tutor.js'") if "'/js/core/contextual-ai-tutor.js'" not in sw else sw
          write('public/sw.js',sw)
          h=read('public/_headers')
          if '/js/core/contextual-ai-tutor.js\n' not in h:
            h += '\n/js/core/contextual-ai-tutor.js\n  Cache-Control: no-cache, no-store, must-revalidate\n'
          write('public/_headers',h)
          idx=read('src/index.js').replace('const APP_VERSION = "'+OLD+'";','const APP_VERSION = "'+NEW+'";'); write('src/index.js',idx)
          grad=read('android/app/build.gradle'); grad=re.sub(r'versionCode\s+\d+',f'versionCode {CODE}',grad); grad=re.sub(r'versionName\s+"[^"]+"',f'versionName "{NEW}-mobile.1"',grad); write('android/app/build.gradle',grad)
          apppwa=read('public/js/app-pwa.js').replace(f'responsive-polish-v{OLD}.css?v={OLD}',f'responsive-polish-v{NEW}.css?v={NEW}'); write('public/js/app-pwa.js',apppwa)
          src=Path(f'public/css/responsive-polish-v{OLD}.css'); dst=Path(f'public/css/responsive-polish-v{NEW}.css')
          if not dst.exists(): shutil.copyfile(src,dst)
          PY
          node scripts/release-contract.mjs check
          node scripts/audit-asset-manifest.mjs
      - name: Commit finalized runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/contextual-tutor-finalize-once.yml
          git add config/release-contract.json package.json public/version.json config/app-assets.json public/js/ui/navigation.js public/sw.js public/_headers src/index.js android/app/build.gradle public/js/app-pwa.js public/css/responsive-polish-v10.64.23.css
          git commit -m "chore(release): preparar runtime 10.64.23 do Tutor Contextual"
          git push origin HEAD:feat/contextual-ai-tutor-v1
