name: Repair responsive stylesheet index parity

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-responsive-index.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Inject responsive polish stylesheet exactly once
        shell: python
        run: |
          from pathlib import Path

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')
          target = '    <link rel="stylesheet" href="./css/responsive-polish-v10.64.17.css">'
          anchor = '    <link rel="stylesheet" href="./css/responsive-system.css">'

          count = text.count(target)
          if count == 0:
              if anchor not in text:
                  raise SystemExit('responsive-system.css anchor not found')
              text = text.replace(anchor, anchor + '\n' + target, 1)
              path.write_text(text, encoding='utf-8')
          elif count != 1:
              raise SystemExit(f'unexpected responsive-polish link count: {count}')

          final = path.read_text(encoding='utf-8')
          if final.count(target) != 1:
              raise SystemExit('responsive-polish link was not injected exactly once')
          if not Path('public/css/responsive-polish-v10.64.17.css').is_file():
              raise SystemExit('responsive-polish stylesheet missing')

      - name: Commit repaired index
        run: |
          if git diff --quiet -- public/index.html; then
            echo 'Index already correct.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'fix(web): load v10.64.17 responsive polish'
          git push origin HEAD:main
