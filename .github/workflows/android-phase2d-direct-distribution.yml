# Phase 2D direct APK distribution. Keep tests/** in the push filter so release-contract fixes are validated before APK publication.
name: Android Phase 2D Direct APK Distribution

on:
  push:
    branches:
      - main
      - fix/ui-mobile-web-v10.64.17
    paths:
      - '.github/workflows/android-phase2d-direct-distribution.yml'
      - 'android/app/build.gradle'
      - 'public/**'
      - 'android/mobile/**'
      - 'scripts/migrate-android-phase1b.mjs'
      - 'scripts/apply-android-mobile-hotfix.mjs'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  direct-distribution-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      APP_VERSION: '10.64.17-mobile.1'
      APP_VERSION_CODE: '106419'
      WEB_VERSION: '10.64.17'
      APP_PACKAGE: 'com.estudoadaptativo.app'
      RELEASE_TAG: 'v10.64.17'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"

      - name: Materialize release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$RUNNER_TEMP/estudo-adaptativo-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical Android migration
        run: node scripts/migrate-android-phase1b.mjs

      - name: Run web unit tests
        run: npm test

      - name: Run structural audits
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

      - name: Prepare Worker-proxied vendor assets
        run: npm run android:prepare

      - name: Apply Android mobile UI and branding hotfix
        run: node scripts/apply-android-mobile-hotfix.mjs

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Verify Android hotfix identity
        shell: bash
        run: |
          grep -q "versionCode $APP_VERSION_CODE" android/app/build.gradle
          grep -q "versionName \"$APP_VERSION\"" android/app/build.gradle
          grep -q "\"version\": \"$WEB_VERSION\"" public/version.json
          grep -q 'android:icon="@drawable/estudo_adaptativo_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/estudo_adaptativo_launcher"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/drawable-nodpi/estudo_adaptativo_launcher.png
          grep -q 'android-mobile-hotfix.css' public/index.html
          grep -q 'android-mobile-hotfix.css' android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/css/responsive-polish-v10.64.17.css

      - name: Build signed APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Locate Android build tools
        shell: bash
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

      - name: Validate final distributable APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee android-release-signature.txt
          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "package: name='$APP_PACKAGE'"
          printf '%s\n' "$BADGING" | grep -q "versionCode='$APP_VERSION_CODE'"
          printf '%s\n' "$BADGING" | grep -q "versionName='$APP_VERSION'"
          unzip -l "$APK" | grep -q 'assets/public/css/android-mobile-hotfix.css'
          unzip -l "$APK" | grep -q 'assets/public/css/responsive-polish-v10.64.17.css'
          if find android/app/build/outputs -type f -name '*.aab' -print -quit | grep -q .; then
            echo 'AAB inesperado foi produzido; Phase 2D distribui somente APK.' >&2
            exit 1
          fi

      - name: Prepare direct distribution package
        shell: bash
        run: |
          OUT="dist/android/direct"
          mkdir -p "$OUT"
          FINAL="EstudoAdaptativo-v${APP_VERSION}-android-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT/$FINAL"
          sha256sum "$OUT/$FINAL" | tee "$OUT/SHA256SUMS.txt"
          cp android-release-signature.txt "$OUT/android-release-signature.txt"

          cat > "$OUT/INSTALL-ANDROID.txt" <<EOF
          Estudo Adaptativo Inteligente ${APP_VERSION}
          Pacote: ${APP_PACKAGE}
          Version code: ${APP_VERSION_CODE}
          Atualizacao responsiva: flashcards, calendario e Retencao/Diagnostico.

          INSTALACAO DIRETA NO APARELHO
          1. Transfira o arquivo ${FINAL} para o Android.
          2. Abra o APK no aparelho.
          3. Se solicitado, permita 'Instalar apps desconhecidos' somente para o app usado para abrir o APK.
          4. Confirme a atualizacao/instalacao.
          5. Abra o Estudo Adaptativo Inteligente.

          VALIDACAO VIA ADB (opcional)
          adb install -r ${FINAL}
          adb shell pm list packages | grep ${APP_PACKAGE}
          adb shell dumpsys package ${APP_PACKAGE} | grep -E 'versionName|versionCode'
          adb shell monkey -p ${APP_PACKAGE} -c android.intent.category.LAUNCHER 1

          O arquivo SHA256SUMS.txt permite conferir a integridade do APK antes da instalacao.
          EOF

          cat > "$OUT/validate-device.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          PACKAGE="com.estudoadaptativo.app"
          APK="${1:-EstudoAdaptativo-v10.64.17-mobile.1-android-release.apk}"
          command -v adb >/dev/null
          adb get-state
          adb install -r "$APK"
          adb shell pm path "$PACKAGE"
          adb shell dumpsys package "$PACKAGE" | grep -E 'versionName|versionCode'
          adb logcat -c
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
          sleep 8
          adb shell dumpsys activity activities | grep -m1 "$PACKAGE"
          if adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime" | grep -q "$PACKAGE"; then
            echo "Falha: crash AndroidRuntime detectado para $PACKAGE" >&2
            exit 1
          fi
          echo "Validacao fisica basica concluida sem crash detectado."
          EOF
          chmod +x "$OUT/validate-device.sh"

          cat > "$OUT/distribution-manifest.json" <<EOF
          {
            "app": "Estudo Adaptativo Inteligente",
            "package": "${APP_PACKAGE}",
            "versionName": "${APP_VERSION}",
            "versionCode": ${APP_VERSION_CODE},
            "webVersion": "${WEB_VERSION}",
            "format": "APK",
            "signed": true,
            "aabProduced": false,
            "androidMobileHotfix": true,
            "responsivePolish": true,
            "sourceCommit": "${GITHUB_SHA}",
            "workflowRun": "${GITHUB_RUN_ID}",
            "permanentReleaseTag": "${RELEASE_TAG}"
          }
          EOF

      - name: Upload direct distribution APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EstudoAdaptativo-v10.64.17-mobile.1-direct-distribution-apk
          path: dist/android/direct/
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent APK assets to canonical GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/android/direct"
          FINAL="EstudoAdaptativo-v${APP_VERSION}-android-release.apk"

          release_ready=0
          for attempt in {1..20}; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              release_ready=1
              break
            fi
            echo "Aguardando release canônica $RELEASE_TAG... tentativa $attempt/20"
            sleep 15
          done
          if [ "$release_ready" -ne 1 ]; then
            echo "Release canônica $RELEASE_TAG não ficou disponível no prazo." >&2
            exit 1
          fi

          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$existing_assets" | grep -Fxq "$FINAL"; then
            echo "Asset permanente $FINAL já existe em $RELEASE_TAG; mantendo o binário publicado sem substituição."
            gh release view "$RELEASE_TAG" --json url,tagName,assets --jq '{url,tagName,assets:[.assets[].name]}'
            exit 0
          fi

          cp "$OUT/SHA256SUMS.txt" "$OUT/EstudoAdaptativo-v${APP_VERSION}-android-SHA256SUMS.txt"
          cp "$OUT/android-release-signature.txt" "$OUT/EstudoAdaptativo-v${APP_VERSION}-android-signature.txt"
          cp "$OUT/distribution-manifest.json" "$OUT/EstudoAdaptativo-v${APP_VERSION}-android-distribution-manifest.json"
          cp "$OUT/INSTALL-ANDROID.txt" "$OUT/EstudoAdaptativo-v${APP_VERSION}-INSTALL-ANDROID.txt"

          gh release upload "$RELEASE_TAG" \
            "$OUT/$FINAL" \
            "$OUT/EstudoAdaptativo-v${APP_VERSION}-android-SHA256SUMS.txt" \
            "$OUT/EstudoAdaptativo-v${APP_VERSION}-android-signature.txt" \
            "$OUT/EstudoAdaptativo-v${APP_VERSION}-android-distribution-manifest.json" \
            "$OUT/EstudoAdaptativo-v${APP_VERSION}-INSTALL-ANDROID.txt"

          gh release view "$RELEASE_TAG" --json url,tagName,assets --jq '{url,tagName,assets:[.assets[].name]}'
