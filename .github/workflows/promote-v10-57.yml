name: Promote v10.57.0
on:
  push:
    branches:
      - feat/offline-metadata-ring3-promoted-stability-v10.57.0
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Promote release identity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-version.mjs 10.57.0
          python3 - <<'PY'
          from pathlib import Path
          roots=[Path('public'),Path('config'),Path('tests'),Path('src')]
          for root in roots:
              for p in root.rglob('*'):
                  if not p.is_file(): continue
                  if p.suffix.lower() not in {'.js','.cjs','.mjs','.json','.html','.css','.txt'}: continue
                  try: s=p.read_text()
                  except UnicodeDecodeError: continue
                  n=s.replace('10.56.0','10.57.0').replace(r'10\.56\.0',r'10\.57\.0')
                  if n!=s: p.write_text(n)
          Path('public/version.json').write_text('{\n  "version": "10.57.0",\n  "build": "source",\n  "commit": "source"\n}\n')
          PY
          node --test tests/deploy-identity.test.cjs
          npm test
      - name: Commit promotion and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/promote-v10-57.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public config tests src package.json
          git commit -m "chore(release): promote v10.57.0"
          git push origin HEAD:feat/offline-metadata-ring3-promoted-stability-v10.57.0