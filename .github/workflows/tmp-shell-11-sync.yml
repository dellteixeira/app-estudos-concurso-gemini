name: Temporary Shell 1.1 Sync

on:
  push:
    branches:
      - ui/edital-modernization-v106445

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui/edital-modernization-v106445
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Sync shell runtime and release contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const oldVersion = '10.64.45';
          const version = '10.64.46';
          const versionCode = 106448;
          const replaceText = path => {
            const source = fs.readFileSync(path, 'utf8');
            fs.writeFileSync(path, source.replaceAll(oldVersion, version));
          };

          const contractPath = 'config/release-contract.json';
          const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          contract.version = version;
          contract.android.versionCode = versionCode;
          fs.writeFileSync(contractPath, JSON.stringify(contract, null, 2) + '\n');

          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = version;
          if (lock.packages?.['']) lock.packages[''].version = version;
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');

          const publicVersionPath = 'public/version.json';
          const publicVersion = JSON.parse(fs.readFileSync(publicVersionPath, 'utf8'));
          publicVersion.version = version;
          publicVersion.build = 'source';
          publicVersion.commit = 'source';
          fs.writeFileSync(publicVersionPath, JSON.stringify(publicVersion, null, 2) + '\n');

          const assetsPath = 'config/app-assets.json';
          const assets = JSON.parse(fs.readFileSync(assetsPath, 'utf8'));
          const assetsText = JSON.stringify(assets, null, 2).replaceAll(oldVersion, version);
          fs.writeFileSync(assetsPath, assetsText + '\n');

          for (const path of [
            'public/index.html',
            'public/js/app-pwa.js',
            'public/js/ui/navigation.js',
            'public/sw.js',
            'src/index.js'
          ]) replaceText(path);

          let gradle = fs.readFileSync('android/app/build.gradle', 'utf8');
          gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${versionCode}`);
          gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "${version}-mobile.1"`);
          fs.writeFileSync('android/app/build.gradle', gradle);

          const oldCss = `public/css/responsive-polish-v${oldVersion}.css`;
          const newCss = `public/css/responsive-polish-v${version}.css`;
          fs.copyFileSync(oldCss, newCss);

          const navPath = 'public/js/ui/navigation.js';
          let nav = fs.readFileSync(navPath, 'utf8');
          if (!nav.includes('function organizeShellChrome()')) {
            const marker = '    global.AppNavigation = Object.freeze({';
            const helper = `    function organizeShellChrome() {\n        const dropdown = document.getElementById('compactActionsDropdown');\n        if (dropdown) {\n            const divider = dropdown.querySelector('.compact-menu-divider');\n            for (const id of ['btnRenomearConcurso', 'btnExcluirConcurso']) {\n                const button = document.getElementById(id);\n                if (!button || button.parentElement === dropdown) continue;\n                button.classList.add('compact-menu-item', 'shell-management-action');\n                button.setAttribute('role', 'menuitem');\n                dropdown.insertBefore(button, divider || null);\n            }\n        }\n        for (const id of ['modernOverviewTopics', 'modernOverviewTarget']) {\n            document.getElementById(id)?.closest('.overview-card')?.classList.add('overview-secondary-metric');\n        }\n    }\n\n`;
            if (!nav.includes(marker)) throw new Error('navigation marker not found');
            nav = nav.replace(marker, helper + marker);
            nav = nav.replace('    installDelegatedActions();\n', '    installDelegatedActions();\n    organizeShellChrome();\n');
            nav = nav.replace("        document.addEventListener('DOMContentLoaded', () => {\n            ensureAccessibleNames();", "        document.addEventListener('DOMContentLoaded', () => {\n            ensureAccessibleNames();\n            organizeShellChrome();");
          }
          fs.writeFileSync(navPath, nav);

          fs.writeFileSync('tests/shell-modernization-11.test.cjs', `const test = require('node:test');\nconst assert = require('node:assert/strict');\nconst fs = require('node:fs');\n\nconst css = fs.readFileSync('public/css/shell-modernization.css', 'utf8');\nconst nav = fs.readFileSync('public/js/ui/navigation.js', 'utf8');\n\ntest('shell 1.1 keeps runtime light and does not touch calendar selectors', () => {\n  assert.doesNotMatch(css, /MutationObserver|setInterval\\s*\\(/);\n  assert.doesNotMatch(nav, /new\\s+MutationObserver|setInterval\\s*\\(/);\n  assert.doesNotMatch(css, /#tab-calendario|\\.calendar/);\n});\n\ntest('shell 1.1 exposes one primary contest action and moves management actions to menu', () => {\n  assert.match(nav, /function organizeShellChrome\\(\\)/);\n  assert.match(nav, /btnRenomearConcurso/);\n  assert.match(nav, /btnExcluirConcurso/);\n  assert.match(nav, /shell-management-action/);\n  assert.match(css, /overview-secondary-metric/);\n});\n`);
          NODE
          node scripts/release-contract.mjs check
          node --test tests/shell-modernization-11.test.cjs
          rm .github/workflows/tmp-shell-11-sync.yml
          git config user.name "dellteixeira"
          git config user.email "111660903+dellteixeira@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): finalizar shell moderno 10.64.46"
          git push origin HEAD:ui/edital-modernization-v106445
