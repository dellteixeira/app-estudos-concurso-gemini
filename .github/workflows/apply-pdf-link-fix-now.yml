name: Apply PDF Link Constraint Fix Now

on:
  push:
    branches:
      - ops/apply-pdf-link-fix-now
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply-fix:
    if: github.event_name == 'push' || github.head_ref == 'ops/apply-pdf-link-fix-now'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Validate database secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Apply only PDF link constraint fix
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;

          alter table public.pdf_document_links
              drop constraint if exists pdf_document_links_materia_check;

          alter table public.pdf_document_links
              drop constraint if exists pdf_document_links_assunto_check;

          alter table public.pdf_document_links
              add constraint pdf_document_links_materia_check
              check (length(trim(materia)) between 0 and 180);

          alter table public.pdf_document_links
              add constraint pdf_document_links_assunto_check
              check (length(trim(assunto)) between 0 and 300);

          commit;
          SQL

      - name: Verify constraints in production
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "
            select conname || ' => ' || pg_get_constraintdef(oid)
            from pg_constraint
            where conrelid = 'public.pdf_document_links'::regclass
              and conname in ('pdf_document_links_materia_check','pdf_document_links_assunto_check')
            order by conname;
          "
