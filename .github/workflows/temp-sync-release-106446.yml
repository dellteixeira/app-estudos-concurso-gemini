name: Temp sync release 10.64.46

on:
  push:
    branches:
      - fix/mobile-header-search-touch-target

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Synchronize release contracts
        run: node scripts/temp-sync-release-106446.mjs

      - name: Validate release contract
        run: node scripts/release-contract.mjs check

      - name: Build clean generated commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-sync-release-106446.yml scripts/temp-sync-release-106446.mjs
          git add package.json package-lock.json public/version.json config/app-assets.json public/index.html public/sw.js src/index.js android/app/build.gradle public/css/responsive-polish-v10.64.46.css
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para gerar."
            exit 0
          fi
          git commit -m "chore(release): sincronizar contratos da v10.64.46"
          git push origin HEAD:refs/heads/automation/release-sync-v106446 --force
