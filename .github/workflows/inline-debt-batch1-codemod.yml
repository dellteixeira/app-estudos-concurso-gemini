name: Inline Debt Batch 1 Codemod

on:
  push:
    branches:
      - hardening/inline-debt-batch1

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/inline-debt-batch1
          fetch-depth: 0

      - name: Apply deterministic inline-action migration
        run: node scripts/migrate-inline-actions-batch1.mjs

      - name: Remove one-shot workflow before commit
        run: rm .github/workflows/inline-debt-batch1-codemod.yml

      - name: Commit transformed HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html scripts/audit-inline-csp.mjs .github/workflows/inline-debt-batch1-codemod.yml
          git diff --cached --check
          git commit -m "Hardening: migrar 25 handlers inline para delegação"
          git push origin HEAD:hardening/inline-debt-batch1
