name: Retention Modal Release Bump

on:
  push:
    branches: [fix/retention-diagnostic-modal-unification-v1]

permissions:
  contents: write

jobs:
  validate-and-bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Prepare canonical 10.64.26 workspace
        shell: bash
        run: |
          set -euo pipefail
          cp public/css/responsive-polish-v10.64.25.css public/css/responsive-polish-v10.64.26.css
          python3 - <<'PY'
          from pathlib import Path

          files = [
              'package.json',
              'config/release-contract.json',
              'config/app-assets.json',
              'public/version.json',
              'public/sw.js',
              'public/js/app-pwa.js',
              'public/js/ui/navigation.js',
              'public/index.html',
              'public/css/responsive-polish-v10.64.26.css',
              'src/index.js',
              'android/app/build.gradle',
          ]
          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('10.64.25', '10.64.26')
              if name in {'config/release-contract.json', 'android/app/build.gradle'}:
                  text = text.replace('106427', '106428')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate release contract
        run: node scripts/release-contract.mjs check

      - name: Validate retention modal regression
        run: node --test tests/retention-metric-modern-dialog.test.cjs tests/retention-metric-harmony-modal.test.cjs

      - name: Run complete test suite
        run: npm test

      - name: Run structural audits
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit

      - name: Commit canonical bump and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/retention-modal-release-bump.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore(release): bump visual fix to 10.64.26'
          git push origin HEAD:fix/retention-diagnostic-modal-unification-v1
