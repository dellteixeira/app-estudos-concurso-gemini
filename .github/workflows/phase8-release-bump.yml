name: Phase 8 Release Bump
on:
  push:
    branches:
      - feat/intelligent-model-routing-v1
    paths:
      - .github/workflows/phase8-release-bump.yml
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intelligent-model-routing-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Prepare canonical 10.64.24 workspace
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const oldVersion='10.64.23';
          const newVersion='10.64.24';
          const files=['package.json','config/release-contract.json','config/app-assets.json','public/version.json','public/sw.js','public/js/app-pwa.js','public/js/ui/navigation.js','src/index.js','android/app/build.gradle'];
          for(const file of files){
            let text=fs.readFileSync(file,'utf8');
            if(!text.includes(oldVersion))throw new Error(`${file} não contém ${oldVersion}`);
            text=text.split(oldVersion).join(newVersion);
            if(file==='config/release-contract.json')text=text.replace('"versionCode": 106425','"versionCode": 106426');
            if(file==='android/app/build.gradle')text=text.replace(/versionCode\s+106425/,'versionCode 106426');
            fs.writeFileSync(file,text);
          }
          const from=`public/css/responsive-polish-v${oldVersion}.css`;
          const to=`public/css/responsive-polish-v${newVersion}.css`;
          if(!fs.existsSync(from))throw new Error(`CSS base ausente: ${from}`);
          fs.copyFileSync(from,to);
          NODE
      - name: Validate release contract
        run: node scripts/release-contract.mjs check
      - name: Validate AI model router
        run: node --test tests/ai-model-router.test.cjs tests/learning-advisor.test.cjs tests/v10-64-17-responsive-polish.test.cjs
      - name: Run complete test suite
        run: npm test
      - name: Commit bump and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase8-release-bump.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json config/release-contract.json config/app-assets.json public/version.json public/sw.js public/js/app-pwa.js public/js/ui/navigation.js src/index.js android/app/build.gradle public/css/responsive-polish-v10.64.24.css .github/workflows/phase8-release-bump.yml
          git commit -m "chore(release): bump fase 8 para 10.64.24"
          git push origin HEAD:feat/intelligent-model-routing-v1
