name: Temporary Post Phase 8 Hardening

on:
  push:
    branches: [refactor/post-phase8-hardening]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/post-phase8-hardening
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Synchronize canonical release
        run: |
          node <<'NODE'
          const fs=require('fs');
          const oldVersion='10.64.40';
          const newVersion='10.64.41';
          const files=[
            'config/release-contract.json','package.json','package-lock.json','public/version.json',
            'config/app-assets.json','src/index.js','public/sw.js','android/app/build.gradle',
            'public/index.html','public/js/app-pwa.js','public/js/ui/navigation.js','public/_headers'
          ];
          for(const file of files){
            let text=fs.readFileSync(file,'utf8');
            text=text.split(oldVersion).join(newVersion);
            if(file==='config/release-contract.json'||file==='android/app/build.gradle') text=text.replace(/106442/g,'106443');
            fs.writeFileSync(file,text);
          }
          const oldCss=`public/css/responsive-polish-v${oldVersion}.css`;
          const newCss=`public/css/responsive-polish-v${newVersion}.css`;
          if(fs.existsSync(oldCss)&&!fs.existsSync(newCss)) fs.renameSync(oldCss,newCss);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Run structural audits
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: npm run audit
      - name: Remove temporary workflow and commit validated hardening
        run: |
          rm .github/workflows/tmp-post-phase8-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): publicar hardening 10.64.41 [hardening-applied]"
          git push origin HEAD:refactor/post-phase8-hardening
