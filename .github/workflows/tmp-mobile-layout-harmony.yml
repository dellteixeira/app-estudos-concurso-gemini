name: Temporary Mobile Layout Harmony

on:
  push:
    branches:
      - fix/mobile-layout-harmony-10.64.32

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/mobile-layout-harmony-10.64.32
          fetch-depth: 0

      - name: Apply deterministic mobile layout patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          OLD = '10.64.31'
          NEW = '10.64.32'
          OLD_CODE = '106433'
          NEW_CODE = '106434'

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected token not found in {path}: {old}')
              text = text.replace(old, new) if count is None else text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          # Release contract and synchronized runtime surfaces.
          contract = json.loads(Path('config/release-contract.json').read_text(encoding='utf-8'))
          contract['version'] = NEW
          contract['android']['versionCode'] = int(NEW_CODE)
          Path('config/release-contract.json').write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for path in ['package.json', 'package-lock.json', 'public/version.json']:
              replace(path, OLD, NEW)

          assets_path = Path('config/app-assets.json')
          assets = json.loads(assets_path.read_text(encoding='utf-8'))
          assets['version'] = NEW
          old_css = f'/css/responsive-polish-v{OLD}.css'
          new_css = f'/css/responsive-polish-v{NEW}.css'
          assets['criticalAppShell'] = [new_css if x == old_css else x for x in assets['criticalAppShell']]
          assets_path.write_text(json.dumps(assets, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for path in [
              'src/index.js',
              'public/sw.js',
              'public/index.html',
              'public/js/app-pwa.js',
              'public/js/ui/navigation.js'
          ]:
              replace(path, OLD, NEW)

          gradle = Path('android/app/build.gradle')
          gradle_text = gradle.read_text(encoding='utf-8')
          if f'versionCode {OLD_CODE}' not in gradle_text or f'versionName "{OLD}-mobile.1"' not in gradle_text:
              raise SystemExit('Android release tokens not found')
          gradle_text = gradle_text.replace(f'versionCode {OLD_CODE}', f'versionCode {NEW_CODE}')
          gradle_text = gradle_text.replace(f'versionName "{OLD}-mobile.1"', f'versionName "{NEW}-mobile.1"')
          gradle.write_text(gradle_text, encoding='utf-8')

          old_css_path = Path(f'public/css/responsive-polish-v{OLD}.css')
          new_css_path = Path(f'public/css/responsive-polish-v{NEW}.css')
          css = old_css_path.read_text(encoding='utf-8')
          css += r'''

/* V10.64.32 — correções exclusivamente mobile para retenção, cronograma e ações de flashcards. */
@media (max-width: 700px) {
    /* Retenção: impede sobreposição vertical dos quatro indicadores. */
    #retentionDiagnosticPanel .rd-metrics-v1077 {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        grid-template-rows: none !important;
        grid-auto-rows: minmax(164px, auto) !important;
        align-items: stretch !important;
        gap: 12px !important;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
    }

    #retentionDiagnosticPanel .rd-metric-card-v1077 {
        position: relative !important;
        inset: auto !important;
        transform: none !important;
        width: 100% !important;
        height: auto !important;
        min-height: 164px !important;
        margin: 0 !important;
        align-self: stretch !important;
    }

    /* Cronograma: quatro ações em uma grade 2 × 2 estável. */
    #calendarWorkspace .calendar-primary-actions {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        align-items: stretch !important;
        gap: 10px !important;
        width: 100% !important;
    }

    #calendarWorkspace .calendar-primary-actions > .btn {
        width: 100% !important;
        min-width: 0 !important;
        min-height: 46px !important;
        justify-content: center !important;
        text-align: center !important;
        white-space: normal !important;
        line-height: 1.15 !important;
        padding-inline: 10px !important;
    }

    /* Flashcards: exportar/importar na primeira linha e fechar caixa em largura total. */
    #flashcardsWorkspace .flashcard-anki-actions {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        align-items: stretch !important;
        gap: 10px !important;
        width: 100% !important;
    }

    #flashcardsWorkspace .flashcard-anki-actions > .btn {
        width: 100% !important;
        min-width: 0 !important;
        min-height: 44px !important;
        justify-content: center !important;
        text-align: center !important;
        white-space: normal !important;
        line-height: 1.15 !important;
        padding-inline: 9px !important;
    }

    #flashcardsWorkspace #btnResetFcFilter {
        grid-column: 1 / -1 !important;
    }
}
'''
          new_css_path.write_text(css, encoding='utf-8')

          headers = Path('public/_headers')
          headers_text = headers.read_text(encoding='utf-8')
          header_block = f'\n/css/responsive-polish-v{NEW}.css\n  Cache-Control: public, max-age=31536000, immutable\n'
          if f'/css/responsive-polish-v{NEW}.css' not in headers_text:
              headers.write_text(headers_text.rstrip() + '\n' + header_block, encoding='utf-8')

          test = r'''const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');

const css = fs.readFileSync('public/css/responsive-polish-v10.64.32.css', 'utf8');
const html = fs.readFileSync('public/index.html', 'utf8');

test('mobile retention metrics use a non-overlapping 2x2 grid', () => {
  assert.match(css, /#retentionDiagnosticPanel \.rd-metrics-v1077[\s\S]*grid-template-columns:\s*repeat\(2, minmax\(0, 1fr\)\)/);
  assert.match(css, /grid-auto-rows:\s*minmax\(164px, auto\)/);
  assert.match(css, /gap:\s*12px/);
});

test('mobile calendar actions are aligned as two rows of two buttons', () => {
  assert.match(css, /#calendarWorkspace \.calendar-primary-actions[\s\S]*grid-template-columns:\s*repeat\(2, minmax\(0, 1fr\)\)/);
  assert.match(html, /class="calendar-primary-actions"[\s\S]*Preencher Cronograma[\s\S]*Limpar Cronograma[\s\S]*Limpar Matérias[\s\S]*Reorganizar Matérias/);
});

test('mobile flashcard actions keep export import together and reset full width', () => {
  assert.match(css, /#flashcardsWorkspace \.flashcard-anki-actions[\s\S]*grid-template-columns:\s*repeat\(2, minmax\(0, 1fr\)\)/);
  assert.match(css, /#flashcardsWorkspace #btnResetFcFilter[\s\S]*grid-column:\s*1 \/ -1/);
  assert.match(html, /Exportar Flashcards[\s\S]*Importar Flashcards[\s\S]*Fechar Caixa \/ Ocultar Cartões/);
});
'''
          Path('tests/mobile-layout-harmony.test.cjs').write_text(test, encoding='utf-8')
          PY

      - name: Validate release and tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          test "$(node --version)" = "v22.23.2"
          npm run check

      - name: Commit generated patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle config/app-assets.json config/release-contract.json package.json package-lock.json public/version.json public/_headers public/index.html public/sw.js public/js/app-pwa.js public/js/ui/navigation.js src/index.js public/css/responsive-polish-v10.64.32.css tests/mobile-layout-harmony.test.cjs
          git commit -m "fix(ui): harmonizar layout mobile"
          git push origin HEAD:fix/mobile-layout-harmony-10.64.32
