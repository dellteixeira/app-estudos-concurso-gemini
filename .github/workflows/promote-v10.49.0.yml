name: Promote v10.49.0 Once

on:
  push:
    branches:
      - feat/offline-metadata-population-promoted-stability-v10.49.0
    paths:
      - .github/workflows/promote-v10.49.0.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/offline-metadata-population-promoted-stability-v10.49.0
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Promote release identity and self-remove
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const raw = cp.execFileSync('git', ['grep', '-l', '10.48.0', '--', 'package.json', 'public', 'src', 'config', 'tests'], {encoding:'utf8'}).trim();
          const files = raw ? raw.split(/\r?\n/).filter(Boolean) : [];
          if (!files.length) throw new Error('Nenhum arquivo de identidade v10.48.0 encontrado para promoção.');
          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            const after = before.replaceAll('10.48.0', '10.49.0');
            if (after !== before) fs.writeFileSync(file, after);
          }
          const doc = 'docs/phase-4q-population-promoted-stability.md';
          if (fs.existsSync(doc)) {
            let text = fs.readFileSync(doc, 'utf8');
            text = text.replace(/## Release[\s\S]*$/m, '## Release\n\nRelease candidate promovida para `v10.49.0` somente após o pré-gate integral — sintaxe, testes automatizados, auditoria estrutural e Browser Responsive Audit — permanecer verde.\n');
            fs.writeFileSync(doc, text);
          }
          NODE
          rm .github/workflows/promote-v10.49.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): promote phase 4Q to v10.49.0"
          git push origin HEAD:feat/offline-metadata-population-promoted-stability-v10.49.0
