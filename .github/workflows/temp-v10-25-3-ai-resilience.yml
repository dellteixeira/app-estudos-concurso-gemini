name: TEMP v10.25.3 AI resilience

on:
  push:
    branches: [fix/v10-25-3-ai-diagnostics-timeouts]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v10-25-3-ai-diagnostics-timeouts
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/temp-v10-25-3-ai-resilience.py
      - name: Syntax checks
        run: |
          node --check src/index.js
          node --check public/js/pdf/pdf-reader.js
      - name: Tests
        run: node --test tests/*.test.cjs
      - name: Audit
        env:
          AUDIT_ALLOW_ANY_ROOT: '1'
        run: node scripts/audit-release.mjs
      - name: Commit functional correction
        run: |
          rm -f scripts/temp-v10-25-3-ai-resilience.py .github/workflows/temp-v10-25-3-ai-resilience.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.js public/js/pdf/pdf-reader.js package.json public/version.json public/sw.js tests/*.test.cjs
          git add -u scripts/temp-v10-25-3-ai-resilience.py .github/workflows/temp-v10-25-3-ai-resilience.yml || true
          git diff --cached --quiet && exit 0
          git commit -m 'fix: improve AI diagnostics and fallback resilience v10.25.3'
          git push origin HEAD:fix/v10-25-3-ai-diagnostics-timeouts
