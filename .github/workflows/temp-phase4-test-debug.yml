name: Temporary Phase 4 Test Debug

on:
  push:
    branches:
      - fix/offline-init-diagnostics-v10.64.3
    paths:
      - .github/workflows/temp-phase4-test-debug.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offline-init-diagnostics-v10.64.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Capture exact failing test
        shell: bash
        run: |
          set +e
          npm test > /tmp/phase4-test.log 2>&1
          status=$?
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/phase4-test.log').read_text(errors='replace')
          lines=text.splitlines()
          out=[]
          for i,line in enumerate(lines):
              if ('not ok' in line or 'AssertionError' in line or 'ERR_ASSERTION' in line or 'failureType' in line):
                  a=max(0,i-18); b=min(len(lines),i+45)
                  block='\n'.join(lines[a:b])
                  if block not in out: out.append(block)
          Path('phase4-test-failure.txt').write_text('\n\n--- FAILURE BLOCK ---\n\n'.join(out) or text[-12000:], encoding='utf-8')
          PY
          echo "test_status=$status" >> phase4-test-failure.txt
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4-test-failure.txt
          git commit -m "chore(phase4): capturar falha de teste" || exit 0
          git push origin HEAD:fix/offline-init-diagnostics-v10.64.3
