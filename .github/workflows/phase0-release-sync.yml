name: Phase 0 Release Sync

on:
  push:
    branches: [refactor/phase-0-architecture]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/phase-0-architecture
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Synchronize canonical version and stale asset references
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const oldVersion = '10.64.27';
          const nextVersion = '10.64.28';

          const contractPath = 'config/release-contract.json';
          const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          contract.version = nextVersion;
          contract.android.revision = 1;
          contract.android.versionCode = 106430;
          fs.writeFileSync(contractPath, JSON.stringify(contract, null, 2) + '\n');

          for (const path of ['package.json', 'package-lock.json', 'public/version.json', 'config/app-assets.json']) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (path === 'package.json') data.version = nextVersion;
            if (path === 'package-lock.json') {
              data.version = nextVersion;
              if (data.packages?.['']) data.packages[''].version = nextVersion;
            }
            if (path === 'public/version.json') data.version = nextVersion;
            if (path === 'config/app-assets.json') {
              data.version = nextVersion;
              const replaceDeep = value => {
                if (Array.isArray(value)) return value.map(replaceDeep);
                if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).map(([k,v]) => [k, replaceDeep(v)]));
                return typeof value === 'string' ? value.replaceAll(oldVersion, nextVersion) : value;
              };
              Object.assign(data, replaceDeep(data));
            }
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          }

          const releaseScoped = [
            'src/index.js',
            'public/sw.js',
            'public/index.html',
            'public/js/app-pwa.js',
            'public/js/ui/navigation.js'
          ];
          for (const path of releaseScoped) {
            if (!fs.existsSync(path)) continue;
            const source = fs.readFileSync(path, 'utf8');
            fs.writeFileSync(path, source.replaceAll(oldVersion, nextVersion));
          }

          const gradlePath = 'android/app/build.gradle';
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          gradle = gradle.replace(/versionCode\s+\d+/, 'versionCode 106430');
          gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "${nextVersion}-mobile.1"`);
          fs.writeFileSync(gradlePath, gradle);

          const appStatePath = 'public/js/app-state.js';
          const appState = fs.readFileSync(appStatePath, 'utf8');
          fs.writeFileSync(appStatePath, appState.replaceAll('?v=10.56.0', `?v=${nextVersion}`));

          const headersPath = 'public/_headers';
          let headers = fs.readFileSync(headersPath, 'utf8');
          const immutableRule = `\n/css/responsive-polish-v${nextVersion}.css\n  Cache-Control: public, max-age=31536000, immutable\n`;
          if (!headers.includes(`/css/responsive-polish-v${nextVersion}.css`)) headers += immutableRule;
          fs.writeFileSync(headersPath, headers);

          const oldCss = `public/css/responsive-polish-v${oldVersion}.css`;
          const newCss = `public/css/responsive-polish-v${nextVersion}.css`;
          if (!fs.existsSync(newCss)) fs.copyFileSync(oldCss, newCss);
          NODE

      - name: Validate contracts and tests
        run: |
          node scripts/release-contract.mjs check
          npm test
          npm run audit

      - name: Commit synchronized Phase 0 release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json config/release-contract.json config/app-assets.json public/version.json src/index.js public/sw.js android/app/build.gradle public/index.html public/js/app-pwa.js public/js/ui/navigation.js public/js/app-state.js public/_headers public/css/responsive-polish-v10.64.28.css
          git commit -m "chore(release): preparar v10.64.28 e consolidar assets"
          git push origin HEAD:refactor/phase-0-architecture

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/phase0-release-sync.yml
          git commit -m "chore(ci): remover workflow temporário da Fase 0"
          git push origin HEAD:refactor/phase-0-architecture
