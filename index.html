<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Estudos</title>
    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 1.5rem;
            color: #2563eb;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        #dashboard {
            display: none;
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- Tela de Autenticação -->
    <div id="auth-screen" class="auth-card">
        <h2>🔑 Entrar no Sistema</h2>
        
        <div class="form-group">
            <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        
        <div class="form-group">
            <input type="password" id="password" placeholder="Senha (mínimo 6 caracteres)" required>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="handleLogin()">Entrar</button>
            <button class="btn btn-secondary" onclick="handleSignUp()">Cadastrar</button>
        </div>
    </div>

    <!-- Tela do Dashboard (Aparece após logar) -->
    <div id="dashboard">
        <h2>Bem-vindo ao Painel de Estudos!</h2>
        <p>Você está autenticado com sucesso.</p>
        <button class="btn btn-secondary" style="margin-top: 1rem;" onclick="handleLogout()">Sair</button>
    </div>

    <script>
        // CONFIGURAÇÃO DO SUPABASE
        // IMPORTANTE: Mantenha suas credenciais originais abaixo
        const SUPABASE_URL = 'https://SEU-PROJETO.supabase.co'; 
        const SUPABASE_ANON_KEY = 'SUA-CHAVE-ANON-AQUI';

        // Inicializamos o cliente com 'supabaseClient' para evitar conflito com 'window.supabase'
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // FUNÇÃO DE CADASTRO
        async function handleSignUp() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                alert('Por favor, preencha o e-mail e a senha.');
                return;
            }

            if (password.length < 6) {
                alert('A senha deve ter pelo menos 6 caracteres.');
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

            if (error) {
                alert('Erro ao cadastrar: ' + error.message);
            } else {
                alert('Cadastro realizado com sucesso! Agora clique em Entrar.');
            }
        }

        // FUNÇÃO DE LOGIN
        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                alert('Por favor, preencha o e-mail e a senha.');
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert('Erro ao entrar: ' + error.message);
            } else {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            }
        }

        // FUNÇÃO DE LOGOUT
        async function handleLogout() {
            await supabaseClient.auth.signOut();
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'block';
        }

        // Expondo as funções no objeto 'window' para garantir acesso via onclick
        window.handleSignUp = handleSignUp;
        window.handleLogin = handleLogin;
        window.handleLogout = handleLogout;
    </script>
</body>
</html>
