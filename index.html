<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Estudos Concurso</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js para Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            min-height: 100vh;
        }

        /* TELA DE AUTH */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 1.5rem;
            color: #2563eb;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.75rem 1.2rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-secondary { background-color: #64748b; color: white; }
        .btn-danger { background-color: #ef4444; color: white; }

        /* DASHBOARD PRINCIPAL */
        #app-dashboard {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            margin-bottom: 2rem;
        }

        .card h3 {
            margin-bottom: 1rem;
            color: #1e293b;
        }

        /* POMODORO */
        .timer-display {
            font-size: 3.5rem;
            font-weight: bold;
            text-align: center;
            margin: 1rem 0;
            color: #2563eb;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        /* EDITAL TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th { background-color: #f8fafc; }
    </style>
</head>
<body>

    <!-- TELA DE AUTENTICAÇÃO -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <h2>🔑 Entrar no Sistema</h2>
            <div class="form-group">
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Senha (min. 6 caracteres)" required>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="handleLogin()">Entrar</button>
                <button class="btn btn-secondary" onclick="handleSignUp()">Cadastrar</button>
            </div>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL (APÓS LOGIN) -->
    <div id="app-dashboard">
        <header>
            <h2>📚 Painel de Estudos</h2>
            <button class="btn btn-secondary" onclick="handleLogout()">Sair</button>
        </header>

        <div class="grid-layout">
            <!-- COLUNA ESQUERDA: TIMER POMODORO & GRÁFICO -->
            <div>
                <!-- TIMER POMODORO -->
                <div class="card">
                    <h3>⏱️ Timer Pomodoro</h3>
                    <div class="timer-display" id="timer">25:00</div>
                    <div class="timer-controls">
                        <button class="btn btn-primary" onclick="startTimer()">Iniciar</button>
                        <button class="btn btn-secondary" onclick="pauseTimer()">Pausar</button>
                        <button class="btn btn-danger" onclick="resetTimer()">Resetar</button>
                    </div>
                </div>

                <!-- GRÁFICO DE PROGRESSO -->
                <div class="card">
                    <h3>📊 Progresso por Matéria</h3>
                    <canvas id="progressChart"></canvas>
                </div>
            </div>

            <!-- COLUNA DIREITA: EDITAL VERTICALIZADO -->
            <div>
                <div class="card">
                    <h3>📝 Edital Verticalizado</h3>
                    <form id="edital-form" onsubmit="addEditalItem(event)">
                        <div class="form-group">
                            <input type="text" id="materia" placeholder="Matéria (ex: Direito Constitucional)" required>
                        </div>
                        <div class="form-group">
                            <input type="text" id="assunto" placeholder="Assunto (ex: Artigo 5º)" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Adicionar Tópico</button>
                    </form>

                    <table id="edital-table">
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Matéria</th>
                                <th>Assunto</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody id="edital-list">
                            <!-- Itens carregados do Supabase -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO SUPABASE
        const SUPABASE_URL = 'https://vqtcveixmwiaoweimdik.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxdGN2ZWl4bXdpYW93ZWltZGlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MzA4ODgsImV4cCI6MjEwMTUwNjg4OH0._8OOEdGbvDK1Vh_af2FJJn0-EVFjJjGZ_krQ6ue6V6c';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let myChart = null;

        // --- AUTENTICAÇÃO ---
        async function handleSignUp() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) return alert('Preencha e-mail e senha.');

            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert('Erro ao cadastrar: ' + error.message);
            else alert('Cadastro realizado com sucesso! Agora clique em Entrar.');
        }

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) return alert('Preencha e-mail e senha.');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Erro ao entrar: ' + error.message);
            } else {
                showDashboard();
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            document.getElementById('app-dashboard').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
        }

        function showDashboard() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-dashboard').style.display = 'block';
            loadEditalData();
        }

        // Check sessão ativa
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) showDashboard();
        });

        // --- GERENCIAMENTO DE EDITAL & SUPABASE ---
        async function loadEditalData() {
            const { data, error } = await supabaseClient.from('edital').select('*');
            if (error) console.error('Erro ao buscar dados:', error);
            else {
                renderEditalTable(data || []);
                renderChart(data || []);
            }
        }

        async function addEditalItem(e) {
            e.preventDefault();
            const materia = document.getElementById('materia').value;
            const assunto = document.getElementById('assunto').value;
            const user = (await supabaseClient.auth.getUser()).data.user;

            const { error } = await supabaseClient.from('edital').insert([
                { materia, assunto, status: false, user_id: user.id }
            ]);

            if (error) alert('Erro ao salvar: ' + error.message);
            else {
                document.getElementById('edital-form').reset();
                loadEditalData();
            }
        }

        async function toggleStatus(id, currentStatus) {
            const { error } = await supabaseClient
                .from('edital')
                .update({ status: !currentStatus })
                .eq('id', id);

            if (!error) loadEditalData();
        }

        async function deleteItem(id) {
            const { error } = await supabaseClient.from('edital').delete().eq('id', id);
            if (!error) loadEditalData();
        }

        function renderEditalTable(items) {
            const list = document.getElementById('edital-list');
            list.innerHTML = '';
            items.forEach(item => {
                list.innerHTML += `
                    <tr>
                        <td>
                            <input type="checkbox" ${item.status ? 'checked' : ''} onchange="toggleStatus(${item.id}, ${item.status})">
                        </td>
                        <td>${item.materia}</td>
                        <td>${item.assunto}</td>
                        <td>
                            <button class="btn btn-danger" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;" onclick="deleteItem(${item.id})">x</button>
                        </td>
                    </tr>
                `;
            });
        }

        // --- GRÁFICOS (CHART.JS) ---
        function renderChart(items) {
            const ctx = document.getElementById('progressChart').getContext('2d');
            
            // Agrupar por matéria
            const counts = {};
            items.forEach(item => {
                if (!counts[item.materia]) counts[item.materia] = { total: 0, concluido: 0 };
                counts[item.materia].total++;
                if (item.status) counts[item.materia].concluido++;
            });

            const labels = Object.keys(counts);
            const dataConcluido = labels.map(l => counts[l].concluido);

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Tópicos Concluídos',
                        data: dataConcluido,
                        backgroundColor: '#2563eb'
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        }

        // --- TIMER POMODORO ---
        let timerInterval = null;
        let timeLeft = 25 * 60;

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').innerText = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert('Tempo esgotado! Faça uma pausa.');
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = 25 * 60;
            updateTimerDisplay();
        }

        // Tornando funções acessíveis globalmente
        window.handleSignUp = handleSignUp;
        window.handleLogin = handleLogin;
        window.handleLogout = handleLogout;
        window.addEditalItem = addEditalItem;
        window.toggleStatus = toggleStatus;
        window.deleteItem = deleteItem;
        window.startTimer = startTimer;
        window.pauseTimer = pauseTimer;
        window.resetTimer = resetTimer;
    </script>
</body>
</html>
