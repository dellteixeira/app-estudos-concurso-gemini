<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Estudos</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e2e8f0;
            --primary-blue: #2563eb;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --primary-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* AUTH SCREEN */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h2 { margin-bottom: 1.5rem; color: var(--primary-blue); }

        /* DASHBOARD LAYOUT */
        #app-dashboard {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .action-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .grid-top {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .grid-top { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .card h3 {
            margin-bottom: 1rem;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* BUTTONS & INPUTS */
        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background-color: var(--primary-blue); color: white; }
        .btn-secondary { background-color: #64748b; color: white; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-danger { background-color: #ef4444; color: white; }

        input, select {
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        /* POMODORO */
        .timer-display {
            font-size: 4rem;
            font-weight: bold;
            text-align: center;
            margin: 0.5rem 0;
            letter-spacing: 2px;
        }

        .timer-settings {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .timer-settings input { width: 60px; text-align: center; }

        /* EDITAL TABLE */
        .form-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .form-row input[type="text"] { flex: 2; }
        .form-row input[type="number"] { width: 80px; }

        .table-responsive { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.9rem;
        }

        th, td {
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(0,0,0,0.03);
            font-weight: 600;
        }

        body.dark-mode th { background-color: rgba(255,255,255,0.05); }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <h2>🔑 Entrar no Sistema</h2>
            <div style="margin-bottom: 1rem;">
                <input type="email" id="email" placeholder="seu@email.com" style="width:100%; margin-bottom: 0.5rem;" required>
                <input type="password" id="password" placeholder="Senha (min. 6 caracteres)" style="width:100%;" required>
            </div>
            <div style="display:flex; gap:0.5rem;">
                <button class="btn btn-primary" style="flex:1;" onclick="handleLogin()">Entrar</button>
                <button class="btn btn-secondary" style="flex:1;" onclick="handleSignUp()">Cadastrar</button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="app-dashboard">
        <header>
            <h2>🎯 Meu Painel de Estudos</h2>
            <button class="btn btn-secondary" onclick="handleLogout()">Sair</button>
        </header>

        <!-- BARRA DE AÇÕES -->
        <div class="action-bar">
            <button class="btn btn-secondary" onclick="toggleDarkMode()">🌙 Modo Escuro</button>
            
            <label class="btn btn-success" style="cursor: pointer;">
                📥 Importar JSON
                <input type="file" id="jsonInput" accept=".json" style="display: none;" onchange="importJSON(event)">
            </label>

            <button class="btn btn-danger" onclick="clearData()">🗑️ Limpar Dados</button>
        </div>

        <!-- SEÇÃO SUPERIOR: POMODORO & PROGRESSO -->
        <div class="grid-top">
            <!-- TIMER POMODORO -->
            <div class="card">
                <h3>⏱️ Relógio Pomodoro</h3>
                <div class="timer-display" id="timer">25:00</div>
                <div style="text-align: center; margin-bottom: 1rem;">
                    <button class="btn btn-primary" onclick="startTimer()">Iniciar</button>
                    <button class="btn btn-secondary" onclick="resetTimer()">Resetar</button>
                </div>
                <div class="timer-settings">
                    <label>Foco (min): <input type="number" id="focoMin" value="25" min="1" onchange="updateTimerSettings()"></label>
                    <label>Pausa (min): <input type="number" id="pausaMin" value="5" min="1" onchange="updateTimerSettings()"></label>
                </div>
            </div>

            <!-- GRÁFICO -->
            <div class="card">
                <h3>📊 Progresso Geral de Estudo</h3>
                <canvas id="progressChart" height="160"></canvas>
            </div>
        </div>

        <!-- SEÇÃO INFERIOR: EDITAL COM PRIORIDADES E REVISÕES -->
        <div class="card">
            <h3>📚 Edital por Ordem de Prioridade (24h / 7d / 30d)</h3>
            
            <form class="form-row" onsubmit="addManualItem(event)">
                <input type="text" id="materia" placeholder="Matéria (ex: Direito Administrativo)" required>
                <input type="text" id="assunto" placeholder="Assunto (ex: Atos Administrativos)" required>
                <input type="number" id="prioridade" placeholder="Prioridade" value="1" min="1" title="Prioridade/Peso">
                <button type="submit" class="btn btn-primary">Adicionar Manualmente</button>
            </form>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Prioridade</th>
                            <th>Matéria</th>
                            <th>Assunto</th>
                            <th>Teoria</th>
                            <th>Questões</th>
                            <th>Rev. 24h</th>
                            <th>Rev. 7d</th>
                            <th>Rev. 30d</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="edital-list">
                        <!-- Linhas geradas dinamicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO SUPABASE
        const SUPABASE_URL = 'https://vqtcveixmwiaoweimdik.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxdGN2ZWl4bXdpYW93ZWltZGlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MzA4ODgsImV4cCI6MjEwMTUwNjg4OH0._8OOEdGbvDK1Vh_af2FJJn0-EVFjJjGZ_krQ6ue6V6c';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let myChart = null;
        let editalItems = [];

        // --- AUTHENTICATION ---
        async function handleSignUp() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) return alert('Preencha e-mail e senha.');

            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert('Erro ao cadastrar: ' + error.message);
            else alert('Cadastro realizado com sucesso! Clique em Entrar.');
        }

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) return alert('Preencha e-mail e senha.');

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert('Erro ao entrar: ' + error.message);
            else showDashboard();
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            document.getElementById('app-dashboard').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
        }

        function showDashboard() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-dashboard').style.display = 'block';
            loadData();
        }

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) showDashboard();
        });

        // --- MODO ESCURO ---
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        // --- CARREGAR & RENDERIZAR DADOS ---
        async function loadData() {
            const { data, error } = await supabaseClient.from('edital').select('*').order('prioridade', { ascending: true });
            if (!error && data) {
                editalItems = data;
                renderTable();
                renderChart();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('edital-list');
            tbody.innerHTML = '';

            editalItems.forEach((item) => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${item.prioridade || 1}</strong></td>
                        <td>${item.materia}</td>
                        <td>${item.assunto}</td>
                        <td><input type="checkbox" ${item.teoria ? 'checked' : ''} onchange="toggleCheck(${item.id}, 'teoria', ${item.teoria})"></td>
                        <td><input type="checkbox" ${item.questoes ? 'checked' : ''} onchange="toggleCheck(${item.id}, 'questoes', ${item.questoes})"></td>
                        <td><input type="checkbox" ${item.rev_24h ? 'checked' : ''} onchange="toggleCheck(${item.id}, 'rev_24h', ${item.rev_24h})"></td>
                        <td><input type="checkbox" ${item.rev_7d ? 'checked' : ''} onchange="toggleCheck(${item.id}, 'rev_7d', ${item.rev_7d})"></td>
                        <td><input type="checkbox" ${item.rev_30d ? 'checked' : ''} onchange="toggleCheck(${item.id}, 'rev_30d', ${item.rev_30d})"></td>
                        <td><button class="btn btn-danger" style="padding:0.2rem 0.5rem; font-size:0.8rem;" onclick="deleteItem(${item.id})">✕</button></td>
                    </tr>
                `;
            });
        }

        async function toggleCheck(id, field, currentValue) {
            const updateObj = {};
            updateObj[field] = !currentValue;
            await supabaseClient.from('edital').update(updateObj).eq('id', id);
            loadData();
        }

        async function addManualItem(e) {
            e.preventDefault();
            const materia = document.getElementById('materia').value;
            const assunto = document.getElementById('assunto').value;
            const prioridade = parseInt(document.getElementById('prioridade').value) || 1;
            const user = (await supabaseClient.auth.getUser()).data.user;

            await supabaseClient.from('edital').insert([{
                materia, assunto, prioridade, user_id: user.id,
                teoria: false, questoes: false, rev_24h: false, rev_7d: false, rev_30d: false
            }]);

            document.getElementById('materia').value = '';
            document.getElementById('assunto').value = '';
            loadData();
        }

        async function deleteItem(id) {
            await supabaseClient.from('edital').delete().eq('id', id);
            loadData();
        }

        async function clearData() {
            if (confirm('Tem certeza que deseja apagar todos os tópicos do edital?')) {
                const user = (await supabaseClient.auth.getUser()).data.user;
                await supabaseClient.from('edital').delete().eq('user_id', user.id);
                loadData();
            }
        }

        // --- IMPORTAR JSON ---
        async function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    const user = (await supabaseClient.auth.getUser()).data.user;

                    const formattedData = data.map(item => ({
                        materia: item.materia || item.disciplina || 'Geral',
                        assunto: item.assunto || item.topico || 'Geral',
                        prioridade: item.prioridade || item.peso || 1,
                        teoria: false, questoes: false, rev_24h: false, rev_7d: false, rev_30d: false,
                        user_id: user.id
                    }));

                    await supabaseClient.from('edital').insert(formattedData);
                    alert('Edital importado com sucesso!');
                    loadData();
                } catch (err) {
                    alert('Erro ao ler arquivo JSON. Verifique a estrutura do arquivo.');
                }
            };
            reader.readAsText(file);
        }

        // --- GRÁFICO (CHART.JS) ---
        function renderChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            const counts = {};

            editalItems.forEach(item => {
                if (!counts[item.materia]) counts[item.materia] = { total: 0, concluido: 0 };
                counts[item.materia].total += 5; // 5 checkpoints (Teoria, Questões, 3 Revs)
                if (item.teoria) counts[item.materia].concluido++;
                if (item.questoes) counts[item.materia].concluido++;
                if (item.rev_24h) counts[item.materia].concluido++;
                if (item.rev_7d) counts[item.materia].concluido++;
                if (item.rev_30d) counts[item.materia].concluido++;
            });

            const labels = Object.keys(counts);
            const dataConcluidos = labels.map(l => counts[l].concluido);

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Etapas Concluídas',
                        data: dataConcluidos,
                        backgroundColor: '#2563eb'
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        // --- POMODORO EDITÁVEL ---
        let timerInterval = null;
        let isFocusTime = true;
        let timeLeft = 25 * 60;

        function updateTimerSettings() {
            if (!timerInterval) {
                const foco = parseInt(document.getElementById('focoMin').value) || 25;
                timeLeft = foco * 60;
                updateDisplay();
            }
        }

        function updateDisplay() {
            const min = Math.floor(timeLeft / 60);
            const sec = timeLeft % 60;
            document.getElementById('timer').innerText = 
                `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    isFocusTime = !isFocusTime;
                    alert(isFocusTime ? 'Hora de focar!' : 'Hora da pausa!');
                    const nextMin = isFocusTime ? document.getElementById('focoMin').value : document.getElementById('pausaMin').value;
                    timeLeft = (parseInt(nextMin) || 5) * 60;
                    updateDisplay();
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isFocusTime = true;
            updateTimerSettings();
        }

        // Expor para acesso global
        window.handleSignUp = handleSignUp;
        window.handleLogin = handleLogin;
        window.handleLogout = handleLogout;
        window.toggleDarkMode = toggleDarkMode;
        window.importJSON = importJSON;
        window.clearData = clearData;
        window.addManualItem = addManualItem;
        window.toggleCheck = toggleCheck;
        window.deleteItem = deleteItem;
        window.startTimer = startTimer;
        window.resetTimer = resetTimer;
        window.updateTimerSettings = updateTimerSettings;
    </script>
</body>
</html>
