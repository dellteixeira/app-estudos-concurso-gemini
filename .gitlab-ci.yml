stages:
  - validate
  - security

variables:
  NODE_VERSION: "22.23.2"

.default_node:
  image: node:22.23.2-bookworm
  before_script:
    - node --version
    - npm --version

quality:
  extends: .default_node
  stage: validate
  script:
    - node --check src/index.js
    - npm test
    - AUDIT_ALLOW_ANY_ROOT=1 npm run audit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

security_current_tree:
  extends: .default_node
  stage: security
  script:
    - node scripts/audit-secrets.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
